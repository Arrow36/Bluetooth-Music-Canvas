<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>蓝牙音乐看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-overflow-scrolling: auto !important;
        }

        /* 彻底消除任何系统滚动条 */
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }
        ::-webkit-scrollbar-thumb {
            display: none !important;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0b0d10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow: hidden !important;
            overscroll-behavior: none !important;
            touch-action: none !important;
        }

        /* 动态全屏氛围背景约束容器 */
        .ambient-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-bg {
            position: absolute;
            top: -15%;
            left: -15%;
            width: 130%;
            height: 130%;
            background-size: cover;
            background-position: center;
            filter: blur(85px) brightness(0.26) saturate(1.8);
            transform: scale(1.05);
            transition: background-image 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .ambient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 50%, rgba(15, 18, 24, 0.15) 0%, rgba(11, 13, 16, 0.72) 100%);
        }

        /* 全屏容器：网格式纵向布局 */
        .container {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 18px 36px 16px 36px;
            box-sizing: border-box;
        }

        /* 顶部全宽栏：左上角设备电量胶囊，右上角退出按钮 */
        .top-bar {
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 60;
            flex-shrink: 0;
        }

        /* 设备电量胶囊与浮层容器 */
        .device-card-wrapper {
            position: relative;
            display: inline-block;
        }

        .device-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 38px;
            padding: 0 18px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(16px);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* 触控命中热区扩展：在四周增加无形触控垫，杜绝电视触控点偏误触 */
        .device-pill::after {
            content: '';
            position: absolute;
            top: -16px;
            bottom: -16px;
            left: -20px;
            right: -20px;
            z-index: 1;
        }

        .device-pill:active, .device-pill.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: scale(0.97);
        }

        .device-pill * {
            pointer-events: none;
        }

        .device-bt-icon {
            width: 13px;
            height: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            fill: #00d2ff;
            flex-shrink: 0;
        }

        .device-bt-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .battery-widget {
            display: flex;
            align-items: center;
            position: relative;
        }

        .battery-shell {
            width: 22px;
            height: 11px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 3px;
            padding: 1.5px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }

        .battery-level-bar {
            height: 100%;
            width: 100%;
            background: #1db954;
            border-radius: 1px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .battery-tip {
            width: 2px;
            height: 5px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 0 1px 1px 0;
            margin-left: 1px;
        }

        .battery-pct-text {
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.85);
        }

        /* 展开的详情浮层卡片：与四个角落及音量组件完全相同的磨砂毛玻璃风格 */
        .device-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 270px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 14px 16px;
            box-sizing: border-box;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
        }

        .device-dropdown.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .device-dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            margin-bottom: 10px;
        }

        .device-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .device-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1db954;
            box-shadow: 0 0 8px #1db954;
            flex-shrink: 0;
        }

        .device-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-status-badge {
            font-size: 11px;
            color: #1db954;
            background: rgba(29, 185, 84, 0.12);
            border: 1px solid rgba(29, 185, 84, 0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .device-dropdown-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .spec-label {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .spec-val-text {
            color: rgba(255, 255, 255, 0.88);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: monospace, -apple-system, sans-serif;
        }

        /* 顶部右侧：简约叉叉图标按钮（支持长按3秒充能进度环，视觉中心精准居中） */
        .btn-close {
            position: relative;
            width: 38px;
            height: 38px;
            box-sizing: border-box;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            padding: 0;
            margin: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-close::after {
            content: '';
            position: absolute;
            top: -16px;
            bottom: -16px;
            left: -20px;
            right: -20px;
            z-index: 1;
        }

        .close-ring-svg {
            position: absolute;
            top: -1px;
            left: -1px;
            width: 36px;
            height: 36px;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .close-ring-bg {
            fill: none;
            stroke: transparent;
            stroke-width: 2.2;
        }

        .close-ring-bar {
            fill: none;
            stroke: #ff4b2b;
            stroke-width: 2.2;
            stroke-dasharray: 107;
            stroke-dashoffset: 107;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.15s ease-out;
        }

        .btn-close.pressing .close-ring-bar {
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 3s linear;
        }

        .close-x-icon {
            width: 18px;
            height: 18px;
            display: block;
            margin: auto;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            pointer-events: none;
        }

        .btn-close:active {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: scale(0.92);
        }

        /* 中部主体双栏区 */
        .main-body {
            flex: 1;
            width: 100%;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* 左侧面板：黑胶唱机与播控一体化高阶设计 */
        .left-panel {
            width: 44%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-right: 36px;
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            gap: 20px;
        }

        .turntable-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .vinyl-record {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background:
                radial-gradient(circle, transparent 36%, rgba(255, 255, 255, 0.04) 37%, transparent 38%),
                radial-gradient(circle, transparent 48%, rgba(255, 255, 255, 0.035) 49%, transparent 50%),
                radial-gradient(circle, transparent 62%, rgba(255, 255, 255, 0.04) 63%, transparent 64%),
                radial-gradient(circle, transparent 76%, rgba(255, 255, 255, 0.035) 77%, transparent 78%),
                radial-gradient(circle, #0e1013 0%, #17191d 30%, #0d0f12 50%, #1a1d22 70%, #08090a 100%);
            box-shadow:
                0 22px 55px rgba(0, 0, 0, 0.75),
                inset 0 0 0 2px rgba(255, 255, 255, 0.08),
                inset 0 0 16px rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: spinVinyl 24s linear infinite;
            animation-play-state: paused;
            transition: box-shadow 0.6s ease;
        }

        .vinyl-record.playing {
            animation-play-state: running;
            box-shadow:
                0 26px 60px rgba(0, 0, 0, 0.82),
                0 0 30px rgba(255, 255, 255, 0.12),
                inset 0 0 0 2px rgba(255, 255, 255, 0.12);
        }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-cover {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow:
                0 0 0 4px #0d0f12,
                0 0 0 5px rgba(255, 255, 255, 0.16),
                inset 0 0 16px rgba(0, 0, 0, 0.7);
            background: #14161b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl-cover-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 2;
        }

        .vinyl-cover-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .vinyl-center-dot {
            display: none;
        }

        .tonearm-base {
            display: none;
        }

        /* 真实黑胶唱臂：精工金属材质、高保真倒角与唱头，根据播放进度实时计算旋转角度 */
        .tonearm {
            position: absolute;
            top: -38px;
            right: 8px;
            width: 72px;
            height: 208px;
            transform-origin: 36px 54.4px;
            transform: rotate(-16deg);
            transition: transform  0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
            mix-blend-mode: screen;
            pointer-events: none;
            will-change: transform;
        }

        .tonearm-overlay {
            width: 100%;
            height: 100%;
            display: block;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        .tonearm svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 紧凑而富有质感的控制底座 */
        .player-deck {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 16px 20px 15px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .meta-container {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        .song-title {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.36;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: normal;
            overflow-wrap: break-word;
        }

        .song-artist {
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.68);
            margin-top: 5px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }

        .progress-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .time-label {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            letter-spacing: 0.5px;
            min-width: 36px;
            text-align: center;
        }

        .progress-bar-bg {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            position: relative;
            overflow: visible;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            border-radius: 3px;
            transition: width 0.3s linear;
        }

        .progress-bar-thumb {
            position: absolute;
            right: -4px;
            top: -2.5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 75, 43, 0.9);
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-ctrl:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.22);
        }

        .btn-ctrl svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            pointer-events: none;
        }

        .btn-main {
            width: 52px;
            height: 52px;
            background: #ffffff;
            border: none;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.28);
        }

        .btn-main:active {
            transform: scale(0.92);
            background: #e6e6e6;
            box-shadow: 0 3px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-main svg {
            width: 24px;
            height: 24px;
            fill: #0b0d10;
        }

        /* 右侧面板：歌词大视口（完全对称居中） */
        .right-panel {
            width: 56%;
            height: 100%;
            padding: 0 36px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
        }

        .lyrics-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            touch-action: pan-y;
        }

        .lyrics-viewport:active {
            cursor: grabbing;
        }

        .lyrics-stream {
            position: absolute;
            width: 100%;
            top: 40%;
            /* 平滑跨行缓动曲线：五次减速曲线柔顺回弹 */
            transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
            text-align: center;
            will-change: transform;
        }

        /* 
           歌词固定行高设计：彻底杜绝动态字体尺寸变化引起的 DOM 布局重排（Reflow）颠簸抖动！
           完全水平居中对齐，高亮放大通过 transform-origin: center center 从正中心等比放大，平滑对称！
        */
        .lyric-line {
            height: 50px;
            line-height: 50px;
            font-size: 21px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0.15;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
            white-space: nowrap;
            overflow: visible;
        }

        /* 当前激活歌词：高亮、实心白、无模糊杂边、彻底去除发散光晕 */
        .lyric-line.active {
            font-weight: 700;
            color: #ffffff;
            opacity: 1;
            transform: scale(1.28);
            text-shadow: none !important;
        }

        .lyric-line.near-1 {
            color: rgba(255, 255, 255, 0.85);
            opacity: 0.75;
            transform: scale(1.04);
        }

        .lyric-line.near-2 {
            color: rgba(255, 255, 255, 0.65);
            opacity: 0.45;
            transform: scale(1.0);
        }

        .lyric-line.near-3 {
            color: rgba(255, 255, 255, 0.45);
            opacity: 0.22;
            transform: scale(0.98);
        }

        .lyric-line.near-4 {
            color: rgba(255, 255, 255, 0.30);
            opacity: 0.08;
            transform: scale(0.96);
        }

        .lyric-line.far {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.94);
        }

        /* 蓝牙实时单行车载歌词视口：纯净大字无晕光 */
        .live-stream-box {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
            padding-bottom: 20px;
            text-align: center;
            padding-left: 20px;
            padding-right: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .live-stream-lyric {
            font-size: 38px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.5;
            letter-spacing: 0.6px;
            text-shadow: none !important;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 92%;
            word-break: break-word;
        }

        .empty-lyrics {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            gap: 20px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.4s ease;
        }

        .empty-lyrics-text {
            font-size: 26px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.88);
            letter-spacing: 1.2px;
            text-align: center;
        }

        .equalizer-wave {
            display: flex;
            gap: 7px;
            align-items: flex-end;
            height: 38px;
        }

        .wave-bar {
            width: 5px;
            height: 38px;
            background: linear-gradient(to top, #ff416c, #ff4b2b);
            border-radius: 2.5px;
            transform-origin: bottom center;
            transform: scaleY(0.08);
            transition: transform 0.08s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            will-change: transform;
        }

        /* 律动氛围：大号发烧级全屏声波频谱动画 */
        .large-visualizer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            pointer-events: none;
            z-index: 10;
        }

        .large-wave {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 120px;
        }

        .large-bar {
            width: 10px;
            height: 120px;
            background: linear-gradient(to top, #ff416c, #ff4b2b, #f5a623);
            border-radius: 5px;
            transform-origin: bottom center;
            transform: scaleY(0.08);
            box-shadow: 0 0 18px rgba(255, 75, 43, 0.45);
            transition: transform 0.08s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            will-change: transform;
        }

        .large-wave-title {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 2.5px;
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        /* 底部全宽栏：左下角音频硬件规格，右下角歌词源切换 */
        .bottom-bar {
            width: 100%;
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 50;
            flex-shrink: 0;
            padding-top: 4px;
        }

        /* 全屏左下角：发烧级音频参数卡片（与四个角落及音量组件统一 36px 规格） */
        .audio-spec-card {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 36px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.3px;
            font-variant-numeric: tabular-nums;
        }

        .spec-param {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
        }

        .spec-slash, .spec-bullet {
            color: rgba(255, 255, 255, 0.35);
        }

        /* 全屏右下角：歌词源切换胶囊（与四个角落及音量组件统一 36px 规格） */
        .source-tag {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 38px;
            padding: 0 18px;
            font-size: 13.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            letter-spacing: 0.3px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        /* 触控命中热区扩展：在四周增加无形触控垫，大幅提升右下角按钮触控容错率 */
        .source-tag::after {
            content: '';
            position: absolute;
            top: -16px;
            bottom: -16px;
            left: -20px;
            right: -20px;
            z-index: 1;
        }

        .source-tag * {
            pointer-events: none;
        }

        .source-tag:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.96);
        }

        .source-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff3a3a;
            display: inline-block;
            transition: background-color 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 10px rgba(255, 58, 58, 0.8);
            flex-shrink: 0;
        }

        /* 歌词源二级选择弹层菜单：与四个角落及音量组件完全相同的磨砂毛玻璃风格 */
        .lyric-source-menu {
            position: fixed;
            right: 36px;
            bottom: 58px;
            width: 216px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 200;
            padding: 10px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px) scale(0.96);
            transform-origin: bottom right;
            transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lyric-source-menu.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .source-menu-header {
            font-size: 11.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.55);
            padding: 2px 6px 9px 6px;
            letter-spacing: 0.8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-menu-items {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .source-menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: transparent;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s ease, transform 0.1s ease;
            outline: none;
            position: relative;
        }

        .source-menu-item:hover, .source-menu-item:active {
            background: rgba(255, 255, 255, 0.10);
        }

        .source-menu-item.active {
            background: rgba(255, 255, 255, 0.16);
        }

        .menu-item-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .source-menu-item:hover .menu-item-dot {
            transform: scale(1.25);
        }

        .menu-item-name {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.90);
            flex: 1;
            letter-spacing: 0.2px;
        }

        .menu-item-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            transform: scale(0.8);
        }

        .source-menu-item.active .menu-item-check {
            opacity: 1;
            transform: scale(1);
        }

        .source-switch-icon {
            font-size: 12px;
            opacity: 0.6;
            margin-left: 2px;
        }

        /* 无操作后自动优雅渐隐四个角落的控件与二级菜单 */
        .top-bar, .bottom-bar {
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 1;
        }

        body.idle .top-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
        }

        body.idle .bottom-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
        }

        body.idle .lyric-source-menu,
        body.idle .device-dropdown {
            opacity: 0;
            pointer-events: none;
        }

        /* 常驻垂直音量控制组件：极简磨砂质感，与右上角关闭按钮宽度相等（36px）、右边距严格对齐（36px），加减号位于圆弧圆心 */
        .volume-widget {
            position: fixed;
            right: 36px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            padding: 0;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 60;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body.idle .volume-widget {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) scale(0.96);
        }

        /* 手机端按键调整音量时：仅淡入音量条，四个角的控件保持隐藏 */
        body.idle .volume-widget.force-show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .vol-btn {
            width: 36px;
            height: 36px;
            box-sizing: border-box;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            padding: 0;
            margin: 0;
            border-radius: 50%;
            transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .vol-btn:active {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            transform: scale(0.9);
        }

        .vol-btn svg {
            width: 18px;
            height: 18px;
            display: block;
            margin: auto;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            pointer-events: none;
        }

        .vol-track-container {
            width: 100%;
            padding: 2px 0 3px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 禁止按到音量条直接跳跃调节 */
        }

        .vol-track {
            width: 4px;
            height: 96px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            pointer-events: none;
        }

        .vol-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, #00d2ff, #0072ff);
            border-radius: 2px;
            transition: height 0.12s ease-out;
            pointer-events: none;
        }

        .vol-pct-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.2px;
            text-align: center;
            width: 100%;
            padding: 2px 0 2px 0;
            line-height: 1;
            user-select: none;
            pointer-events: none;
        }

        /* 优雅提示小弹窗 */
        .toast-tip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(18, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            padding: 14px 24px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast-tip.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

        <!-- 歌词源二级选择弹层菜单：极简深空磨砂毛玻璃 -->

    <!-- 常驻垂直音量控制组件：左右严格对齐右上角关闭按键、宽度相等（36px） -->

    <!-- 优雅提示轻弹层 -->
    <div class="toast-tip" id="toastTip">正在重启应用...</div>

    <script>
        // 彻底禁止屏幕拖动引起的 WebView 滚动
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        let currentTrack = { title: "", artist: "", album: "", duration: 0, streamLyric: "" };
        let isPlaying = false;
        let lastPositionMs = 0;
        let lastSyncTime = performance.now();
        let lyrics = [];
        let parsedOfficialLyrics = [];
        let hasOfficialLyrics = false;
        let activeLyricIndex = -1;
        let currentCoverUrl = "";
        let lyricMode = 'official'; // 'official' | 'bluetooth'
        
        // 歌曲元数据与歌词内存缓存表（避免返回桌面重新点击时重复请求与闪白）
        const songCache = {};

        function toggleDeviceInfo(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            closeLyricMenu();
            const dropdown = document.getElementById('deviceDropdown');
            const pill = document.getElementById('devicePill');
            if (dropdown) {
                const isOpen = dropdown.classList.toggle('show');
                if (pill) {
                    if (isOpen) pill.classList.add('active');
                    else pill.classList.remove('active');
                }
            }
            document.body.classList.remove('idle');
            resetIdleTimer();
        }

        // 点击或触摸外部区域自动关闭设备详情浮层
        function handleOutsideDismiss(e) {
            const wrapper = document.getElementById('deviceCardWrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                const dropdown = document.getElementById('deviceDropdown');
                const pill = document.getElementById('devicePill');
                if (dropdown && dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                    if (pill) pill.classList.remove('active');
                }
            }
        }
        document.addEventListener('pointerdown', handleOutsideDismiss);
        document.addEventListener('touchstart', handleOutsideDismiss, { passive: true });
        document.addEventListener('click', handleOutsideDismiss);

        // 接收来自 Java 原生层的蓝牙设备状态与音频协议数据
        window.onBluetoothStatusChanged = function(data) {
            console.log("Bluetooth status:", data);
            if (!data) return;

            const text = document.getElementById('batteryPctText');
            const dropBat = document.getElementById('dropdownDeviceBat');
            const widget = document.getElementById('batteryWidget');

            if (data.batteryLevel !== undefined && data.batteryLevel >= 0) {
                const pct = Math.min(100, Math.max(0, data.batteryLevel));
                const bar = document.getElementById('batteryLevelBar');
                if (widget) widget.style.display = 'flex';
                if (bar) {
                    bar.style.width = pct + '%';
                    if (pct <= 20) {
                        bar.style.background = '#ff4b2b';
                    } else if (pct <= 40) {
                        bar.style.background = '#f5a623';
                    } else {
                        bar.style.background = '#1db954';
                    }
                }
                if (text) text.textContent = pct + '%';
                if (dropBat) dropBat.textContent = pct + '%';
            } else {
                // 手机未通过 A2DP 回传电量（标准蓝牙车载协议限制）：不显示伪造电量，显示真实连接态
                if (widget) widget.style.display = 'none';
                if (text) text.textContent = '已连接';
                if (dropBat) dropBat.textContent = '手机未回传 (A2DP协议限制)';
            }

            if (data.deviceName) {
                const nameEl = document.getElementById('dropdownDeviceName');
                if (nameEl) nameEl.textContent = data.deviceName;
            }
            if (data.deviceAddress) {
                const macEl = document.getElementById('dropdownDeviceMac');
                if (macEl) macEl.textContent = data.deviceAddress;
            }

            // 更新左下角音频规格
            if (data.codec) {
                const el = document.getElementById('specCodec');
                if (el) el.textContent = data.codec;
            }
            if (data.sampleRate) {
                const el = document.getElementById('specRate');
                if (el) el.textContent = data.sampleRate;
            }
            if (data.bitDepth) {
                const el = document.getElementById('specBits');
                if (el) el.textContent = data.bitDepth;
            }
            if (data.channels) {
                const el = document.getElementById('specChannels');
                if (el) el.textContent = data.channels;
            }
        };

        function updateStatusTag(text, dotColor) {
            const tagText = document.getElementById('statusTagText');
            const dot = document.getElementById('sourceDot');
            if (tagText) tagText.textContent = text;
            if (dot && dotColor) {
                dot.style.backgroundColor = dotColor;
                dot.style.boxShadow = `0 0 10px ${dotColor}`;
            }
        }

        function setCoverImage(url) {
            currentCoverUrl = url || "";
            const img = document.getElementById('vinylCoverImg');
            const bg = document.getElementById('ambientBg');
            if (currentCoverUrl) {
                img.onload = () => { img.style.opacity = '1'; };
                img.onerror = () => { img.style.opacity = '0'; };
                img.src = currentCoverUrl;
                bg.style.backgroundImage = `url('${currentCoverUrl}')`;
            } else {
                img.style.opacity = '0';
                bg.style.backgroundImage = 'none';
            }
        }

        
        let toastTimeout = null;
        function showToastTip(msg) {
            const toast = document.getElementById('toastTip');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function formatTime(ms) {
            if (!ms || ms < 0 || isNaN(ms)) return "00:00";
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function parseLRC(lrcText) {
            if (!lrcText) return [];
            const lines = lrcText.split('\n');
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;

            for (const line of lines) {
                const matches = [...line.matchAll(timeReg)];
                const text = line.replace(timeReg, '').trim();
                if (!text) continue;

                for (const match of matches) {
                    const m = parseInt(match[1]);
                    const s = parseInt(match[2]);
                    const ms = parseInt(match[3].padEnd(3, '0').slice(0, 3));
                    const totalTime = m * 60000 + s * 1000 + ms;
                    result.push({ time: totalTime, text: text });
                }
            }
            result.sort((a, b) => a.time - b.time);
            return result;
        }

                // 智能优化歌名分行逻辑（尤其是古典音乐作品名、乐章、编号等）
        function formatSongTitle(rawTitle) {
            if (!rawTitle) return "";
            // 1. 标准化标点符号与其后空格：确保冒号后有空格（如 "K. 285:I. Allegro" -> "K. 285: I. Allegro"）
            let t = rawTitle.replace(/:([^\s])/g, ': $1');
            // 2. 乐章罗马数字（I. / II. / III. / IV. 等）与后方速度标记之间绑定不换行空格（&nbsp; /  ），
            //    确保 "I." 和 "Allegro" 绝对保持在同一行，绝不孤立分行
            t = t.replace(/\b([IVXLCDM]+\.)\s+/gi, '$1\u00A0');
            // 3. 作品编号前缀（Op. / K. / BWV / Hob. / No.）与其编号之间绑定不换行空格
            t = t.replace(/\b(Op\.|K\.|BWV|Hob\.|No\.)\s*(\d+)/gi, '$1\u00A0$2');
            return t;
        }

        
        // 真实音频频谱与智能节拍律动驱动引擎
        let lastFftTime = 0;
        let realSpectrum = [0.08, 0.08, 0.08, 0.08, 0.08];
        const waveBars = [];

        function getEqualizerBars() {
            if (waveBars.length < 5) {
                const eq = document.getElementById('equalizerWave');
                if (eq) {
                    const bars = eq.querySelectorAll('.wave-bar');
                    waveBars.length = 0;
                    bars.forEach(b => waveBars.push(b));
                }
            }
            return waveBars;
        }

        // Android 原生 Visualizer 实时回调：接收 5 个归一化频段 (0.05 ~ 1.0)
        window.onAudioSpectrum = function(b0, b1, b2, b3, b4) {
            lastFftTime = performance.now();
            if (!isPlaying) {
                realSpectrum = [0.08, 0.08, 0.08, 0.08, 0.08];
            } else {
                realSpectrum = [
                    Math.max(0.08, Math.min(1.0, b0 || 0)),
                    Math.max(0.08, Math.min(1.0, b1 || 0)),
                    Math.max(0.08, Math.min(1.0, b2 || 0)),
                    Math.max(0.08, Math.min(1.0, b3 || 0)),
                    Math.max(0.08, Math.min(1.0, b4 || 0))
                ];
            }
            const bars = getEqualizerBars();
            if (bars.length >= 5) {
                for (let i = 0; i < 5; i++) {
                    bars[i].style.transform = `scaleY(${realSpectrum[i].toFixed(3)})`;
                }
            }

            // 驱动大号律动频谱柱形 (9频段插值细腻动态)
            const lbars = getLargeWaveBars();
            if (lbars.length >= 9) {
                const s = realSpectrum;
                const l9 = [
                    s[0],
                    s[0] * 0.6 + s[1] * 0.4,
                    s[1],
                    s[1] * 0.5 + s[2] * 0.5,
                    s[2],
                    s[2] * 0.5 + s[3] * 0.5,
                    s[3],
                    s[3] * 0.4 + s[4] * 0.6,
                    s[4]
                ];
                for (let i = 0; i < 9; i++) {
                    lbars[i].style.transform = `scaleY(${l9[i].toFixed(3)})`;
                }
            }
        };

        // ===== 歌词视口手势上下拖拽滑动与 3 秒柔顺回滚 =====
        let isManualScrolling = false;
        let isDraggingLyrics = false;
        let dragStartY = 0;
        let dragStartTranslateY = 0;
        let currentTranslateY = 0;
        let manualScrollResumeTimer = null;

        function updateLyricHighlight(targetIndex) {
            const lines = document.querySelectorAll('.lyric-line');
            for (let idx = 0; idx < lines.length; idx++) {
                const el = lines[idx];
                const dist = Math.abs(idx - targetIndex);
                el.className = 'lyric-line';
                if (dist === 0) {
                    el.classList.add('active');
                } else if (dist <= 4) {
                    el.classList.add('near', `near-${dist}`);
                } else {
                    el.classList.add('far');
                }
            }
        }

        function scrollToLyricIndex(index, animated) {
            const stream = document.getElementById('lyricsStream');
            if (!stream) return;
            const targetEl = document.getElementById(`line-${index}`);
            if (!targetEl) return;
            const targetOffset = targetEl.offsetTop;
            currentTranslateY = -targetOffset;
            if (animated) {
                // 五次减速柔顺曲线（Quintic Deceleration）：松手 3 秒后丝滑滚回
                stream.style.transition = 'transform 0.85s cubic-bezier(0.22, 1, 0.36, 1)';
            } else {
                stream.style.transition = 'none';
            }
            stream.style.transform = `translateY(-${targetOffset}px)`;
        }

        function initLyricsDragGesture() {
            const viewport = document.getElementById('lyricsViewport');
            const stream = document.getElementById('lyricsStream');
            if (!viewport || !stream) return;

            viewport.addEventListener('pointerdown', function(e) {
                if (lyricMode !== 'official' || !hasOfficialLyrics || !lyrics || lyrics.length === 0) return;
                dragStartY = e.clientY;
                dragStartTranslateY = currentTranslateY;
                isDraggingLyrics = false;
                clearTimeout(manualScrollResumeTimer);
            });

            viewport.addEventListener('pointermove', function(e) {
                if (lyricMode !== 'official' || !hasOfficialLyrics || !lyrics || lyrics.length === 0) return;
                const deltaY = e.clientY - dragStartY;
                if (!isDraggingLyrics && Math.abs(deltaY) > 5) {
                    isDraggingLyrics = true;
                    isManualScrolling = true;
                    stream.style.transition = 'none';
                }

                if (isDraggingLyrics) {
                    let targetY = dragStartTranslateY + deltaY;
                    const maxOffset = -(lyrics.length - 1) * 50;
                    // 阻尼弹性边界
                    if (targetY > 100) targetY = 100 + (targetY - 100) * 0.3;
                    if (targetY < maxOffset - 100) targetY = maxOffset - 100 + (targetY - (maxOffset - 100)) * 0.3;

                    currentTranslateY = targetY;
                    stream.style.transform = `translateY(${targetY}px)`;

                    // 动态高亮当前视口中心对齐的歌词行
                    const previewIndex = Math.max(0, Math.min(lyrics.length - 1, Math.round(-targetY / 50)));
                    updateLyricHighlight(previewIndex);
                }
            });

            const onDragEnd = function(e) {
                if (!isDraggingLyrics) return;
                isDraggingLyrics = false;
                resetIdleTimer();

                // 手松开 3 秒后柔顺地自动滚回当前播放位置
                clearTimeout(manualScrollResumeTimer);
                manualScrollResumeTimer = setTimeout(() => {
                    isManualScrolling = false;
                    if (activeLyricIndex >= 0) {
                        updateLyricHighlight(activeLyricIndex);
                        scrollToLyricIndex(activeLyricIndex, true);
                    }
                }, 3000);
            };

            viewport.addEventListener('pointerup', onDragEnd);
            viewport.addEventListener('pointercancel', onDragEnd);
        }
        document.addEventListener('DOMContentLoaded', initLyricsDragGesture);
        setTimeout(initLyricsDragGesture, 200);

        function renderLyrics(lrcArray) {
            lyrics = lrcArray;
            const stream = document.getElementById('lyricsStream');
            const emptyBox = document.getElementById('emptyLyrics');
            const emptyText = document.getElementById('emptyText');
            const largeViz = document.getElementById('largeVisualizer');
            stream.innerHTML = '';
            activeLyricIndex = -1;
            isManualScrolling = false;
            clearTimeout(manualScrollResumeTimer);

            if (currentActiveSource === 'visualizer') {
                if (stream) stream.style.display = 'none';
                if (emptyBox) emptyBox.style.display = 'none';
                if (largeViz) largeViz.style.display = 'flex';
                return;
            }

            if (largeViz) largeViz.style.display = 'none';

            if (!lyrics || lyrics.length === 0) {
                hasOfficialLyrics = false;
                if (currentTrack.streamLyric) {
                    if (emptyBox) emptyBox.style.display = 'none';
                    if (stream) stream.style.display = 'block';
                    showStreamLyric(currentTrack.streamLyric);
                } else {
                    if (emptyBox) {
                        emptyBox.style.display = 'flex';
                        if (emptyText) emptyText.textContent = '纯音乐，请欣赏';
                    }
                    if (stream) stream.innerHTML = '';
                    updateStatusTag('纯音乐', '#888888');
                }
                return;
            }

            hasOfficialLyrics = true;
            if (emptyBox) emptyBox.style.display = 'none';
            if (stream) stream.style.display = 'block';

            lyrics.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line' + (index === 0 ? ' active' : (index <= 4 ? ` near near-${index}` : ' far'));
                div.id = `line-${index}`;
                div.textContent = item.text;
                stream.appendChild(div);
            });
            scrollToLyricIndex(0, false);
        }

        function showStreamLyric(text) {
            const stream = document.getElementById('lyricsStream');
            const emptyBox = document.getElementById('emptyLyrics');
            if (emptyBox) emptyBox.style.display = 'none';
            stream.style.transform = 'translateY(-24px)';
            stream.innerHTML = `
                <div class="live-stream-box">
                    <div class="live-stream-lyric">${text}</div>
                </div>`;
            updateStatusTag('蓝牙实时歌词', '#4a90e2');
        }

        // 歌词源代表色与信息字典（新增律动氛围选项）
        const SOURCE_META = {
            netease: { name: '网易云音乐', color: '#ff3a3a', label: '网易云音乐', id: 'netease' },
            qq: { name: 'QQ音乐', color: '#31c27c', label: 'QQ音乐', id: 'qq' },
            kugou: { name: '酷狗音乐', color: '#0084ff', label: '酷狗音乐', id: 'kugou' },
            lrclib: { name: 'LRCLIB 全球库', color: '#a855f7', label: 'LRCLIB', id: 'lrclib' },
            bluetooth: { name: '蓝牙实时歌词', color: '#38bdf8', label: '蓝牙实时歌词', id: 'bluetooth' },
            visualizer: { name: '律动氛围', color: '#00f2fe', label: '律动氛围', id: 'visualizer' },
            auto: { name: '自动推荐', color: '#f59e0b', label: '自动匹配', id: 'auto' }
        };

        // 记忆歌词源偏好：切歌时严格保持用户手动选择的来源，不自动回退
        let currentActiveSource = localStorage.getItem('preferred_lyric_source') || 'auto';
        let userExplicitMode = (currentActiveSource !== 'auto') ? currentActiveSource : null;

        function getSourceMeta(src) {
            if (!src) return SOURCE_META.auto;
            const s = src.toLowerCase();
            if (s.includes('网易') || s.includes('netease')) return SOURCE_META.netease;
            if (s.includes('qq') || s.includes('tencent')) return SOURCE_META.qq;
            if (s.includes('酷狗') || s.includes('kugou')) return SOURCE_META.kugou;
            if (s.includes('lrclib')) return SOURCE_META.lrclib;
            if (s.includes('律动') || s.includes('visualizer') || s.includes('氛围')) return SOURCE_META.visualizer;
            if (s.includes('蓝牙') || s.includes('bluetooth') || s.includes('stream')) return SOURCE_META.bluetooth;
            return { name: src, color: '#31c27c', label: src, id: 'auto' };
        }

        function toggleLyricMenu(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const dropdown = document.getElementById('deviceDropdown');
            const pill = document.getElementById('devicePill');
            if (dropdown) dropdown.classList.remove('show');
            if (pill) pill.classList.remove('active');

            const menu = document.getElementById('lyricSourceMenu');
            if (!menu) return;
            menu.classList.toggle('show');
            updateMenuCheckmarks();
            document.body.classList.remove('idle');
            resetIdleTimer();
        }

        function closeLyricMenu() {
            const menu = document.getElementById('lyricSourceMenu');
            if (menu) menu.classList.remove('show');
            resetIdleTimer();
        }

        function updateMenuCheckmarks() {
            const keys = ['auto', 'netease', 'qq', 'kugou', 'lrclib', 'bluetooth', 'visualizer'];
            keys.forEach(k => {
                const item = document.getElementById('menuItem-' + k);

        function updateTimeline() {
            let currentPos = lastPositionMs;
            if (isPlaying) {
                const delta = performance.now() - lastSyncTime;
                currentPos += delta;
            }

            // 更新播放进度条
            if (currentTrack.duration > 0) {
                const pct = Math.min(100, Math.max(0, (currentPos / currentTrack.duration) * 100));
                document.getElementById('progressBar').style.width = pct + '%';
                document.getElementById('timeCurrent').textContent = formatTime(currentPos);
            }

            // 真实唱机唱针物理轨迹：根据当前播放进度从黑胶外圈(-26°)平滑走向内圈(-6°)
            const tonearm = document.getElementById('tonearm');
            if (tonearm) {
                if (isPlaying) {
                    let progressRatio = 0;
                    if (currentTrack.duration > 0) {
                        progressRatio = Math.min(1.0, Math.max(0.0, currentPos / currentTrack.duration));
                    }
                    const tonearmAngle = -10 + progressRatio * 10; // 0% at -10deg (outer groove) -> 100% at 0deg (inner groove)
                    tonearm.style.transform = `rotate(${tonearmAngle.toFixed(2)}deg)`;
                } else {
                    tonearm.style.transform = 'rotate(-16deg)'; // Parked outside platter at -16deg
                }

            // 官方歌词流处理

                    }
                }

                // 严格单调防抖迟滞锁：
                // 严禁因手机蓝牙 AVRCP 传输延时微弱抖动导致 targetIndex 往回掉引发的歌词上下颠簸。
                // 仅当用户手动拖动倒退超过 3 秒时才允许回退。
                if (activeLyricIndex >= 0 && targetIndex < activeLyricIndex) {
                    const activeTime = lyrics[activeLyricIndex] ? lyrics[activeLyricIndex].time : 0;
                    if (currentPos > (activeTime - 3000)) {

                if (!isPlaying) {
                    for (let i = 0; i < 5; i++) {
                        bars[i].style.transform = 'scaleY(0.08)';
                    }

                    const timeSinceFft = performance.now() - lastFftTime;
                    if (timeSinceFft > 250) {
                        const t = currentPos / 1000.0;
                        const b0 = 0.20 + 0.65 * Math.pow(Math.max(0, Math.sin(t * 3.8)), 2.5) + 0.15 * Math.sin(t * 1.5);
                        const b1 = 0.25 + 0.55 * Math.pow(Math.max(0, Math.sin(t * 3.8 + 0.8)), 2.0) + 0.20 * Math.sin(t * 5.2);
                        const b2 = 0.30 + 0.60 * Math.pow(Math.max(0, Math.sin(t * 3.8 + 1.6)), 2.0) + 0.15 * Math.sin(t * 7.1);
                        const b3 = 0.22 + 0.50 * Math.pow(Math.max(0, Math.sin(t * 3.8 + 2.4)), 2.0) + 0.25 * Math.sin(t * 9.3);
                        const b4 = 0.15 + 0.45 * Math.pow(Math.max(0, Math.sin(t * 3.8 + 3.2)), 2.2) + 0.20 * Math.sin(t * 11.0);
                        const simBands = [b0, b1, b2, b3, b4];
                        for (let i = 0; i < 5; i++) {
                            const s = Math.max(0.08, Math.min(1.0, simBands[i]));
                            bars[i].style.transform = `scaleY(${s.toFixed(3)})`;
                        }
                    }

        document.addEventListener('pointermove', function(e) {
            if (isTapCandidate) {
                const dist = Math.hypot(e.clientX - tapDownX, e.clientY - tapDownY);
                if (dist > 20) {
                    isTapCandidate = false;
                    if (document.body.classList.contains('idle')) {
                        setIdleState(false);
                    } else {
                        resetIdleTimer();
                    }
                }
            }
        }, { passive: true });

        document.addEventListener('pointerup', function(e) {
            handleTapEnd(e.clientX, e.clientY, e.target);
        }, { passive: true });

        // Fallback for touch devices if PointerEvent doesn't fire
        document.addEventListener('touchstart', function(e) {
            if (e.touches && e.touches[0]) {
                handleTapStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            if (e.changedTouches && e.changedTouches[0]) {
                handleTapEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY, e.target);
            }
        }, { passive: true });

        // 点击屏幕空白处保底事件（兼容各种输入设备与电视遥控器）
        document.addEventListener('click', function(e) {
            const isInteractive = e.target && e.target.closest && !!e.target.closest('button, .btn-ctrl, .vol-btn, .volume-widget, .source-tag, .device-pill, .device-dropdown, .lyric-source-menu, #closeBtn, .top-bar, .bottom-bar, .player-deck, .source-menu-item, .device-card-wrapper, .audio-spec-card');
            if (!isInteractive) {
                const now = performance.now();
                if (now - lastTapHandledTime < 600) return; // 过滤 300ms 移动端合成点击
                lastTapHandledTime = now;
                if (document.body.classList.contains('idle')) {
                    setIdleState(false);
                } else {
                    setIdleState(true);
                }
            }
        });

        resetIdleTimer();

        // ===== 常驻垂直音量控制组件交互与系统联动 =====
        let currentVolumePct = 50;
        let volForceTimeout = null;

        function updateVolumeDisplay(pct) {
            currentVolumePct = Math.max(0, Math.min(100, Math.round(pct)));
            const fill = document.getElementById('volFill');
            const text = document.getElementById('volPctText');
            if (fill) fill.style.height = currentVolumePct + '%';
            if (text) text.textContent = currentVolumePct + '%';
        }

        function handleVolumeStep(delta, e) {
            if (e) {
                if (e.preventDefault) e.preventDefault();
                if (e.stopPropagation) e.stopPropagation();
            }
            resetIdleTimer();
            if (window.AndroidApp && window.AndroidApp.changeVolumeBy) {
                const res = window.AndroidApp.changeVolumeBy(delta);
                updateVolumeDisplay(res);
            } else if (window.AndroidApp && window.AndroidApp.setVolumePercent) {
                const target = Math.max(0, Math.min(100, currentVolumePct + delta));
                const res = window.AndroidApp.setVolumePercent(target);
                updateVolumeDisplay(res);
            } else {
                updateVolumeDisplay(currentVolumePct + delta);
            }
        }

        // 手机端物理按键/蓝牙调整音量时的系统级事件同步：仅淡入音量条，四个角落的控件保持隐藏
        window.onSystemVolumeChanged = function(newPct) {
            updateVolumeDisplay(newPct);
            const widget = document.getElementById('volumeWidget');
            if (widget) {
                widget.classList.add('force-show');
                clearTimeout(volForceTimeout);
                volForceTimeout = setTimeout(function() {
                    widget.classList.remove('force-show');
                }, 3000);
            }
        };

        // 页面初始化时拉取当前系统音量
        if (window.AndroidApp && window.AndroidApp.getVolume) {
            try {
                updateVolumeDisplay(window.AndroidApp.getVolume());
            } catch (err) {}
        }
    </script>
</body>
</html>
