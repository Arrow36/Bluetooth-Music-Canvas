<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>蓝牙音乐看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-overflow-scrolling: auto !important;
        }

        /* 彻底消除任何系统滚动条 */
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }
        ::-webkit-scrollbar-thumb {
            display: none !important;
        }

        :root {
            --lyric-font-size: 20px;
            --lyric-line-height: 50px;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0b0d10;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-feature-settings: "palt", "kern";
            overflow: hidden !important;
            overscroll-behavior: none !important;
            touch-action: none !important;
        }

        /* 低配图形降级模式 (针对低端电视盒与老旧车机，禁用高消耗的 backdrop-filter 模糊与 GPU 重合运算) */
        body.perf-mode, body.perf-mode * {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        body.perf-mode .lyrics-stream {
            contain: content;
        }

        /* 动态全屏氛围背景约束容器 */
        .ambient-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            contain: strict;
        }


        /* 一次性离屏预烘焙模糊画布：切歌加载时仅计算一次 64x64 像素，后续 60fps 播放期间 GPU 模糊着色器零负载 */
        .ambient-canvas {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            opacity: 0;
            transition: opacity 1.0s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: none;
        }


        .ambient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 50%, rgba(15, 18, 24, 0.15) 0%, rgba(11, 13, 16, 0.72) 100%);
        }

        /* 全屏容器：网格式纵向布局 */
        .container {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 18px 36px 16px 36px;
            box-sizing: border-box;
        }

        /* 顶部全宽栏：左上角设备电量胶囊，右上角退出按钮 */
        .top-bar {
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 60;
            flex-shrink: 0;
        }

        /* 设备电量胶囊与浮层容器 */
        .device-card-wrapper {
            position: relative;
            display: inline-block;
        }

        .device-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 38px;
            padding: 0 18px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(16px);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* 触控命中热区扩展：在四周增加无形触控垫，杜绝电视触控点偏误触 */
        .device-pill::after {
            content: '';
            position: absolute;
            top: -24px;
            bottom: -24px;
            left: -28px;
            right: -28px;
            z-index: 1;
        }

        .device-pill:active, .device-pill.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: scale(0.97);
        }

        .device-pill * {
            pointer-events: none;
        }

        .device-bt-icon {
            width: 13px;
            height: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            fill: #00d2ff;
            flex-shrink: 0;
        }

        .device-bt-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .device-status-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.85);
        }

        /* 展开的详情浮层卡片：与四个角落及音量组件完全相同的磨砂毛玻璃风格 */
        .device-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 270px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 14px 16px;
            box-sizing: border-box;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
        }

        .device-dropdown.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .device-dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            margin-bottom: 10px;
        }

        .device-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .device-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1db954;
            box-shadow: 0 0 8px #1db954;
            flex-shrink: 0;
        }

        .device-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-status-badge {
            font-size: 11px;
            color: #1db954;
            background: rgba(29, 185, 84, 0.12);
            border: 1px solid rgba(29, 185, 84, 0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .device-dropdown-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .spec-label {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .spec-val-text {
            color: rgba(255, 255, 255, 0.88);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: monospace, -apple-system, sans-serif;
        }

        /* 顶部右侧：简约叉叉图标按钮（支持长按3秒充能进度环，视觉中心精准居中） */
        .btn-close {
            position: relative;
            width: 38px;
            height: 38px;
            box-sizing: border-box;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            padding: 0;
            margin: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-close::after {
            content: '';
            position: absolute;
            top: -24px;
            bottom: -24px;
            left: -28px;
            right: -28px;
            z-index: 1;
        }

        .close-ring-svg {
            position: absolute;
            top: -1px;
            left: -1px;
            width: 36px;
            height: 36px;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .close-ring-bg {
            fill: none;
            stroke: transparent;
            stroke-width: 2.2;
        }

        .close-ring-bar {
            fill: none;
            stroke: #ff4b2b;
            stroke-width: 2.2;
            stroke-dasharray: 107;
            stroke-dashoffset: 107;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.15s ease-out;
        }

        .btn-close.pressing .close-ring-bar {
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 3s linear;
        }

        .close-x-icon {
            width: 18px;
            height: 18px;
            display: block;
            margin: auto;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            pointer-events: none;
        }

        .btn-close:active {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: scale(0.92);
        }

        /* 中部主体双栏区 */
        .main-body {
            flex: 1;
            width: 100%;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* 左侧面板：黑胶唱机与播控一体化高阶设计 */
        .left-panel {
            width: 44%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-right: 36px;
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            gap: 20px;
        }

        .turntable-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            isolation: isolate;
            contain: layout style;
        }

        /* 静态黑胶投影层：与旋转层分离，避免 GPU 每帧重绘旋转的非对称阴影 */
        .turntable-container::before {
            content: '';
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            box-shadow: 0 24px 55px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 0;
        }

        .vinyl-record {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background:
                radial-gradient(circle, transparent 36%, rgba(255, 255, 255, 0.04) 37%, transparent 38%),
                radial-gradient(circle, transparent 48%, rgba(255, 255, 255, 0.035) 49%, transparent 50%),
                radial-gradient(circle, transparent 62%, rgba(255, 255, 255, 0.04) 63%, transparent 64%),
                radial-gradient(circle, transparent 76%, rgba(255, 255, 255, 0.035) 77%, transparent 78%),
                radial-gradient(circle, #0e1013 0%, #17191d 30%, #0d0f12 50%, #1a1d22 70%, #08090a 100%);
            box-shadow:
                inset 0 0 0 2px rgba(255, 255, 255, 0.08),
                inset 0 0 16px rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            animation: spinVinyl 24s linear infinite;
            animation-play-state: paused;
            will-change: transform;
        }

        .vinyl-record.playing {
            animation-play-state: running;
            box-shadow:
                inset 0 0 0 2px rgba(255, 255, 255, 0.14),
                inset 0 0 16px rgba(0, 0, 0, 0.9);
        }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-cover {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow:
                0 0 0 4px #0d0f12,
                0 0 0 5px rgba(255, 255, 255, 0.16),
                inset 0 0 16px rgba(0, 0, 0, 0.7);
            background: #14161b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl-cover-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 2;
        }

        .vinyl-cover-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .vinyl-center-dot {
            display: none;
        }

        .tonearm-base {
            display: none;
        }

        /* 真实黑胶唱臂：精工金属材质、高保真倒角与唱头，根据播放进度实时计算旋转角度 */
        .tonearm {
            position: absolute;
            top: -38px;
            right: 8px;
            width: 72px;
            height: 208px;
            transform-origin: 36px 54.4px;
            transform: rotate(-16deg);
            transition: transform  0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
            mix-blend-mode: screen;
            pointer-events: none;
            will-change: transform;
        }

        .tonearm-overlay {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        .tonearm svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 紧凑而富有质感的控制底座 */
        .player-deck {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 16px 20px 15px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .meta-container {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        .song-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.34;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
            overflow-wrap: break-word;
            line-break: strict;
            text-wrap: balance;
            white-space: pre-line;
        }

        .song-artist {
            font-size: 15.5px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 6px;
            line-height: 1.38;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }

        .progress-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .time-label {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            letter-spacing: 0.5px;
            min-width: 36px;
            text-align: center;
        }

        .progress-bar-bg {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            position: relative;
            overflow: visible;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            border-radius: 3px;
        }

        .progress-bar-thumb {
            position: absolute;
            right: -4px;
            top: -2.5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 75, 43, 0.9);
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-ctrl:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.22);
        }

        .btn-ctrl svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            pointer-events: none;
        }

        .btn-main {
            width: 52px;
            height: 52px;
            background: #ffffff;
            border: none;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.28);
        }

        .btn-main:active {
            transform: scale(0.92);
            background: #e6e6e6;
            box-shadow: 0 3px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-main svg {
            width: 24px;
            height: 24px;
            fill: #0b0d10;
        }

        /* 右侧面板：歌词大视口（完全对称居中，右侧仅预留音量条安全间距） */
        .right-panel {
            width: 56%;
            height: 100%;
            padding: 0 28px 0 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
        }

        .lyrics-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            touch-action: pan-y;
        }

        .lyrics-viewport:active {
            cursor: grabbing;
        }

        .lyrics-stream {
            position: absolute;
            width: 100%;
            top: 40%;
            /* 平滑跨行缓动曲线：五次减速曲线柔顺回弹 */
            transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
            text-align: center;
            will-change: transform;
        }

        /* 
           歌词固定行高设计：彻底杜绝动态字体尺寸变化引起的 DOM 布局重排（Reflow）颠簸抖动！
           完全水平居中对齐，高亮放大通过 transform-origin: center center 从正中心等比放大，平滑对称！
        */
        .lyric-line {
            height: var(--lyric-line-height, 50px);
            line-height: var(--lyric-line-height, 50px);
            font-size: var(--lyric-font-size, 20px);
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0.15;
            padding: 0 12px;
            box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
            white-space: nowrap;
            overflow: visible;
        }

        /* 当前激活歌词：高亮、实心白、中心视觉焦点（严格保证大于上下所有歌词） */
        .lyric-line.active {
            font-weight: 700;
            color: #ffffff;
            opacity: 1;
            transform: scale(1.18);
            text-shadow: none !important;
        }

        .lyric-line.near-1 {
            color: rgba(255, 255, 255, 0.80);
            opacity: 0.65;
            transform: scale(0.92);
        }

        .lyric-line.near-2 {
            color: rgba(255, 255, 255, 0.55);
            opacity: 0.40;
            transform: scale(0.85);
        }

        .lyric-line.near-3 {
            color: rgba(255, 255, 255, 0.38);
            opacity: 0.20;
            transform: scale(0.78);
        }

        .lyric-line.near-4 {
            color: rgba(255, 255, 255, 0.25);
            opacity: 0.08;
            transform: scale(0.72);
        }

        .lyric-line.far {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none;
            transform: scale(0.68);
            transition: none !important;
        }

        /* 蓝牙实时单行车载歌词视口：纯净大字无晕光 */
        .live-stream-box {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
            padding-bottom: 20px;
            text-align: center;
            padding-left: 20px;
            padding-right: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .live-stream-lyric {
            font-size: 38px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.5;
            letter-spacing: 0.6px;
            text-shadow: none !important;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 92%;
            word-break: break-word;
        }

        .empty-lyrics {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            gap: 20px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.4s ease;
        }

        .empty-lyrics-text {
            font-size: 26px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.88);
            letter-spacing: 1.2px;
            text-align: center;
        }

        .equalizer-wave {
            display: flex;
            gap: 7px;
            align-items: flex-end;
            height: 38px;
        }

        .wave-bar {
            width: 5px;
            background: linear-gradient(to top, #ff416c, #ff4b2b);
            border-radius: 2.5px;
            height: 8%;
            min-height: 5px;
            transition: height 80ms ease-out;
        }

        /* 律动氛围：大号发烧级全屏声波频谱动画 */
        .large-visualizer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            pointer-events: none;
            z-index: 10;
        }

        .large-wave {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 120px;
        }

        .large-bar {
            width: 10px;
            background: linear-gradient(to top, #ff416c, #ff4b2b, #f5a623);
            border-radius: 5px;
            height: 8%;
            min-height: 10px;
            box-shadow: 0 0 18px rgba(255, 75, 43, 0.45);
            transition: height 80ms ease-out;
        }

        .large-wave-title {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 2.5px;
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        /* 底部全宽栏：左下角音频硬件规格，右下角歌词源切换 */
        .bottom-bar {
            width: 100%;
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 50;
            flex-shrink: 0;
            padding-top: 4px;
        }

        /* 全屏左下角：发烧级音频参数卡片（与四个角落及音量组件统一 36px 规格） */
        .audio-spec-card {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 36px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.3px;
            font-variant-numeric: tabular-nums;
        }

        .spec-param {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
        }

        .spec-slash, .spec-bullet {
            color: rgba(255, 255, 255, 0.35);
        }

        .bottom-right-cluster {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        /* 歌词字号精细调节控件：置于歌词来源控件左侧，极简磨砂毛玻璃胶囊（与音量及底部组件规范统一） */
        .lyric-font-widget {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            height: 38px;
            padding: 0 4px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 19px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none !important;
            visibility: hidden;
            transform: translateX(8px);
            transition: opacity 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 20;
        }

        .lyric-font-widget * {
            pointer-events: none !important;
        }

        body.lyric-menu-open .lyric-font-widget {
            opacity: 1 !important;
            pointer-events: auto !important;
            visibility: visible !important;
            transform: translateX(0);
        }

        body.lyric-menu-open .lyric-font-widget .font-btn {
            pointer-events: auto !important;
        }

        body.idle .lyric-font-widget {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        /* 参考音量组件 vol-btn 设计规范：无周围常驻圆圈、中心对齐、超大触控热区、点击时微光反馈 */
        .font-btn {
            width: 38px;
            height: 38px;
            box-sizing: border-box;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.75);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            padding: 0;
            margin: 0;
            border-radius: 50%;
            position: relative;
            touch-action: manipulation;
            transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto !important;
            user-select: none;
            z-index: 25;
        }

        /* 触控命中热区无形扩展：上下各扩 20px，覆盖完整半区，与右侧来源标签互不侵占 */
        .font-btn::after {
            content: '';
            position: absolute;
            top: -20px;
            bottom: -20px;
            z-index: 30;
        }

        #btnFontDec::after {
            left: -24px;
            right: 0;
        }

        #btnFontInc::after {
            left: 0;
            right: 0;
        }

        .font-btn:hover {
            color: rgba(255, 255, 255, 0.95);
        }

        .font-btn:active {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            transform: scale(0.9);
        }

        .font-btn svg {
            width: 18px;
            height: 18px;
            display: block;
            margin: auto;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            pointer-events: none !important;
        }

        .font-btn svg * {
            pointer-events: none !important;
        }

        .font-size-label {
            min-width: 44px;
            height: 38px;
            line-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 13.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
            user-select: none;
            pointer-events: none;
        }

        /* 全屏右下角：歌词源切换胶囊（与四个角落及音量组件统一 36px 规格） */
        .source-tag {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 38px;
            padding: 0 18px;
            font-size: 13.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            letter-spacing: 0.3px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        /* 触控命中热区舒适扩展（上下各 10px，左右各 8px），杜绝大面积侵占 */
        .source-tag::after {
            content: '';
            position: absolute;
            top: -10px;
            bottom: -10px;
            left: -8px;
            right: -8px;
            z-index: 1;
        }

        body.lyric-menu-open .source-tag::after {
            left: 0 !important;
            right: -8px;
        }

        .source-tag * {
            pointer-events: none;
        }

        .source-tag:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.96);
        }

        .source-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff3a3a;
            display: inline-block;
            transition: background-color 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 10px rgba(255, 58, 58, 0.8);
            flex-shrink: 0;
        }

        /* 歌词源二级选择弹层菜单：与四个角落及音量组件完全相同的磨砂毛玻璃风格 */
        .lyric-source-menu {
            position: fixed;
            right: 36px;
            bottom: 58px;
            width: 216px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 200;
            padding: 10px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px) scale(0.96);
            transform-origin: bottom right;
            transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lyric-source-menu.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .source-menu-header {
            font-size: 11.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.55);
            padding: 2px 6px 9px 6px;
            letter-spacing: 0.8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-menu-items {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .source-menu-item {
            width: 100%;
            height: 46px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            background: transparent;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s ease, transform 0.1s ease;
            outline: none;
            position: relative;
        }

        /* 菜单项无死角命中扩展 */
        .source-menu-item::after {
            content: '';
            position: absolute;
            top: -3px;
            bottom: -3px;
            left: 0;
            right: 0;
            z-index: 1;
        }

        .source-menu-item:hover, .source-menu-item:active {
            background: rgba(255, 255, 255, 0.10);
        }

        .source-menu-item.active {
            background: rgba(255, 255, 255, 0.16);
        }

        .menu-item-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .source-menu-item:hover .menu-item-dot {
            transform: scale(1.25);
        }

        .menu-item-name {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.90);
            flex: 1;
            letter-spacing: 0.2px;
        }

        .menu-item-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            transform: scale(0.8);
        }

        .source-menu-item.active .menu-item-check {
            opacity: 1;
            transform: scale(1);
        }

        .source-switch-icon {
            font-size: 12px;
            opacity: 0.6;
            margin-left: 2px;
        }

        /* 无操作后自动优雅渐隐四个角落的控件与二级菜单 */
        .top-bar, .bottom-bar {
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 1;
        }

        body.idle .top-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
        }

        body.idle .bottom-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
        }

        body.idle .lyric-source-menu,
        body.idle .device-dropdown {
            opacity: 0;
            pointer-events: none;
        }

        /* 常驻垂直音量控制组件：极简磨砂质感，与右上角关闭按钮宽度相等（36px）、右边距严格对齐（36px），加减号位于圆弧圆心 */
        .volume-widget {
            position: fixed;
            right: 36px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            padding: 0;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 60;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body.idle .volume-widget {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) scale(0.96);
        }

        /* 展开右下角歌词源菜单时自动避让右侧音量条，彻底杜绝控件重叠遮挡 */
        body.lyric-menu-open .volume-widget:not(.force-show) {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(-50%) scale(0.92);
        }

        /* 手机端按键调整音量时：仅淡入音量条，四个角的控件保持隐藏 */
        body.idle .volume-widget.force-show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .vol-btn {
            width: 36px;
            height: 36px;
            box-sizing: border-box;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            padding: 0;
            margin: 0;
            border-radius: 50%;
            transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .vol-btn:active {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            transform: scale(0.9);
        }

        .vol-btn svg {
            width: 18px;
            height: 18px;
            display: block;
            margin: auto;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            pointer-events: none;
        }

        .vol-track-container {
            width: 100%;
            padding: 2px 0 3px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 禁止按到音量条直接跳跃调节 */
        }

        .vol-track {
            width: 4px;
            height: 96px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            pointer-events: none;
        }

        .vol-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, #00d2ff, #0072ff);
            border-radius: 2px;
            transition: height 0.12s ease-out;
            pointer-events: none;
        }

        .vol-pct-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.2px;
            text-align: center;
            width: 100%;
            padding: 2px 0 2px 0;
            line-height: 1;
            user-select: none;
            pointer-events: none;
        }

        /* 优雅提示小弹窗 */
        .toast-tip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(18, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            padding: 14px 24px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast-tip.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 隐藏状态的浮层与沉浸模式隐藏栏禁用 backdrop-filter，消除透明层的全屏背景采样合成开销 */
        .device-dropdown:not(.show),
        .lyric-source-menu:not(.show),
        .toast-tip:not(.show),
        body.idle .top-bar .device-pill,
        body.idle .bottom-bar .audio-spec-card,
        body.idle .bottom-bar .source-tag,
        body.idle .volume-widget:not(.force-show) {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        /* 首次安装免 ADB 权限自检居中弹窗（适配无触屏电视遥控器一键按 OK 开启） */
        .perm-guide-pill {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 950;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 420px;
            max-width: 88vw;
            padding: 24px 28px;
            background: rgba(18, 22, 30, 0.96);
            border: 1.5px solid rgba(255, 65, 108, 0.65);
            border-radius: 24px;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85), 0 0 0 100vmax rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.2s ease, border-color 0.2s ease;
            outline: none;
            user-select: none;
            text-align: center;
        }
        .perm-guide-pill.show {
            display: flex;
        }
        .perm-guide-pill:active, .perm-guide-pill:focus {
            border-color: #00d2ff;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.85), 0 0 24px rgba(0, 210, 255, 0.55), 0 0 0 100vmax rgba(0, 0, 0, 0.62);
        }
        .perm-guide-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }
        .perm-guide-desc {
            font-size: 13.5px;
            font-weight: 400;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.78);
        }
        .perm-guide-cta {
            margin-top: 4px;
            padding: 10px 22px;
            border-radius: 18px;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.4px;
            box-shadow: 0 6px 18px rgba(255, 65, 108, 0.45);
        }
        .perm-guide-cta:focus { outline: 3px solid white; }
        #notificationLater { background: #39404b; }
        .perm-guide-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff416c;
            box-shadow: 0 0 10px #ff416c;
            flex-shrink: 0;
        }

        /* 电视遥控器焦点高亮样式 */
        .source-menu-item.remote-focus,
        .btn-ctrl.remote-focus,
        .device-pill.remote-focus,
        .source-tag.remote-focus {
            outline: 2px solid rgba(0, 210, 255, 0.85) !important;
            box-shadow: 0 0 16px rgba(0, 210, 255, 0.45) !important;
        }

        /* ===== 多尺寸屏幕、分辨率与横竖屏自适应媒体查询 ===== */
        /* 1. 标准 Android TV 2x 缩放视口 (960x540 = 1920x1080 @ 320dpi) 与紧凑型智慧屏 */
        @media (max-height: 560px), (max-width: 980px) {
            .container {
                padding: 12px 26px 10px 26px;
            }
            .main-body {
                gap: 14px;
            }
            .left-panel {
                flex: 0 0 38%;
                max-width: 336px;
                gap: 4px;
            }
            .turntable-container {
                transform: scale(0.76);
                transform-origin: center center;
                margin: -28px 0 -24px 0;
            }
            .player-deck {
                max-width: 330px;
                padding: 10px 15px 10px 15px;
                border-radius: 18px;
            }
            .meta-container {
                margin-bottom: 6px;
            }
            .song-title {
                font-size: 17px;
                -webkit-line-clamp: 2;
            }
            .song-artist {
                font-size: 12.5px;
                margin-top: 3px;
            }
            .progress-box {
                margin-bottom: 8px;
            }
            .btn-ctrl {
                width: 38px;
                height: 38px;
            }
            .btn-main {
                width: 44px;
                height: 44px;
            }
            .right-panel {
                width: 62%;
                padding: 0 26px 0 4px;
            }
            .lyric-line {
                height: var(--lyric-line-height, 42px);
                line-height: var(--lyric-line-height, 42px);
                font-size: var(--lyric-font-size, 16px);
            }
            .lyric-line.active {
                transform: scale(1.15);
            }
            .volume-widget {
                right: 22px;
            }
            .vol-track {
                height: 72px;
            }
            .lyric-source-menu {
                right: 26px;
                bottom: 50px;
                width: 204px;
                padding: 8px;
            }
            .source-menu-header {
                padding: 2px 6px 6px 6px;
                margin-bottom: 4px;
            }
            .source-menu-items {
                gap: 2px;
            }

    <script>
        // 彻底禁止屏幕拖动引起的 WebView 滚动
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        let currentTrack = { title: "", artist: "", album: "", duration: 0, streamLyric: "" };
        window.currentTrack = currentTrack;
        let isPlaying = false;
        let lastPositionMs = 0;
        let lastSyncTime = performance.now();
        let lyrics = [];
        let parsedOfficialLyrics = [];
        let hasOfficialLyrics = false;
        let activeLyricIndex = -1;
        let renderedLyricIndex = -1;
        let currentRawLrcText = "";
        let currentLyricFontSize = 20;
        try {
            const savedSize = parseInt(localStorage.getItem('bmc_lyric_font_size'), 10);
            if (savedSize >= 14 && savedSize <= 52) {
                currentLyricFontSize = savedSize;
            }
        } catch (e) {}
        let currentCoverUrl = "";
        let lastValidMusicCoverUrl = "";
        let lyricMode = 'official'; // 'official' | 'bluetooth'
        
        // 歌曲元数据与歌词内存缓存表（避免返回桌面重新点击时重复请求与闪白，上限 50 首防长时运行内存膨胀）
        const MAX_SONG_CACHE_ENTRIES = 50;
        const songCache = {};
        window.songCache = songCache;

        function ensureSongCacheEntry(key) {
            if (!key) return {};
            if (!songCache[key]) {
                const keys = Object.keys(songCache);
                if (keys.length >= MAX_SONG_CACHE_ENTRIES) {
                    delete songCache[keys[0]];
                }
                songCache[key] = {};
            }
            return songCache[key];
        }

        Object.defineProperty(window, 'lastPositionMs', {
            get: () => lastPositionMs,
            set: (v) => { lastPositionMs = v; },
            configurable: true
        });
        Object.defineProperty(window, 'lastSyncTime', {
            get: () => lastSyncTime,
            set: (v) => { lastSyncTime = v; },
            configurable: true
        });
        Object.defineProperty(window, 'activeLyricIndex', {
            get: () => activeLyricIndex,
            set: (v) => { activeLyricIndex = v; },
            configurable: true
        });
        Object.defineProperty(window, 'renderedLyricIndex', {
            get: () => renderedLyricIndex,
            set: (v) => { renderedLyricIndex = v; },
            configurable: true
        });
        Object.defineProperty(window, 'hasOfficialLyrics', {
            get: () => hasOfficialLyrics,
            set: (v) => { hasOfficialLyrics = v; },
            configurable: true
        });
        Object.defineProperty(window, 'lyrics', {
            get: () => lyrics,
            set: (v) => { lyrics = v; },
            configurable: true
        });

        function toggleDeviceInfo(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            closeLyricMenu();
            const dropdown = document.getElementById('deviceDropdown');
            const pill = document.getElementById('devicePill');
            if (dropdown) {
                const isOpen = dropdown.classList.toggle('show');
                if (pill) {
                    if (isOpen) pill.classList.add('active');
                    else pill.classList.remove('active');
                }
            }
            document.body.classList.remove('idle');
            resetIdleTimer();
        }

        // 点击或触摸外部区域自动关闭设备详情浮层
        function handleOutsideDismiss(e) {
            const wrapper = document.getElementById('deviceCardWrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                const dropdown = document.getElementById('deviceDropdown');
                const pill = document.getElementById('devicePill');
                if (dropdown && dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                    if (pill) pill.classList.remove('active');
                }
            }
        }
        document.addEventListener('pointerdown', handleOutsideDismiss);

        // 离屏微缩降采样画布缓存：将专辑图先降采样至 16x16 再双线性插值放大到 64x64，
        // 零 CORS 跨域报错（不调用 toDataURL/getImageData），每首歌仅计算一次（<0.5ms），播放期间 GPU 模糊着色器零消耗！
        let offscreenBlurSampleCanvas = null;
        function bakeAmbientCanvas(imgEl) {
            const canvas = document.getElementById('ambientCanvas');
            if (!canvas || !canvas.getContext || !imgEl || !imgEl.naturalWidth) return false;
            try {
                const ctx = canvas.getContext('2d');
                if (!ctx) return false;
                if (!offscreenBlurSampleCanvas) {
                    offscreenBlurSampleCanvas = document.createElement('canvas');
                    offscreenBlurSampleCanvas.width = 16;
                    offscreenBlurSampleCanvas.height = 16;
                }
                const sCtx = offscreenBlurSampleCanvas.getContext('2d');
                if (!sCtx) return false;
                sCtx.imageSmoothingEnabled = true;
                sCtx.clearRect(0, 0, 16, 16);
                sCtx.drawImage(imgEl, 0, 0, 16, 16);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.imageSmoothingEnabled = true;
                if ('filter' in ctx) {
                    ctx.filter = 'blur(4px) saturate(1.75) brightness(0.32)';
                }
                ctx.drawImage(offscreenBlurSampleCanvas, 0, 0, canvas.width, canvas.height);
                if ('filter' in ctx) {
                    ctx.filter = 'none';
                }
                // 叠加柔和暗角遮罩，保证高饱和度封面下前景歌词依然清晰通透
                ctx.fillStyle = 'rgba(10, 12, 16, 0.42)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                canvas.style.opacity = '1';
                return true;
            } catch (e) {
                return false;

        let measureCanvas = null;

                    if (!measureCanvas) {
                        measureCanvas = document.createElement('canvas');
                        measureCtx = measureCanvas ? measureCanvas.getContext('2d') : null;

                    if (measureCtx) {
                        measureCtx.font = `700 ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                        const metrics = measureCtx.measureText(text);
                        if (metrics && typeof metrics.width === 'number') {
                            return metrics.width;
                        }
                    }
                } catch (e) {}
            }
            let w = 0;
            for (let i = 0; i < text.length; i++) {
                w += text.charCodeAt(i) > 255 ? (fontSize * 1.05) : (fontSize * 0.58);
            }
            return w;

        // 智能切分超长单行歌词：动态结合当前字号与视口真实宽度，能完整显示则绝不拆分
        function splitLongLyrics(items) {
            if (!items || items.length === 0) return [];
            const result = [];
            const limit = Math.max(1, getAvailableLyricWidth() / 1.18);
            items.forEach((item, index) => {
                const text = item.text.trim().replace(/[\u2018\u2019\u0060\u00b4]/g, "'")
                    .replace(/\b([a-zA-Z]+)\s*'\s*([a-zA-Z]+)\b/g, "$1'$2");
                const chars = Array.from(text);
                const parts = [];
                for (let start = 0; start < chars.length;) {
                    let end = start;
                    let boundary = start;
                    let line = '';
                    while (end < chars.length) {
                        const candidate = line + chars[end];
                        if (end > start && measureLyricTextWidth(candidate, currentLyricFontSize) > limit) break;
                        line = candidate;
                        if (/[\s，。！？、,;；!?]/.test(chars[end])) boundary = end + 1;
                        end++;
                    }
                    if (end < chars.length && boundary > start) end = boundary;
                    const part = chars.slice(start, end).join('').trim();
                    if (part) parts.push(part);
                    start = end;
                }
                const total = parts.reduce((sum, part) => sum + getVisualLength(part), 0);
                const next = items[index + 1];
                const duration = next ? Math.max(0, next.time - item.time) : 4000;
                let consumed = 0;
                for (const part of parts) {
                    result.push({ time: item.time + Math.floor(duration * consumed / total), text: part });
                    consumed += getVisualLength(part);
                }
            });
            return result;
        }

        function parseLRC(lrcText) {
            if (!lrcText) return [];
            const lines = lrcText.split('\n');
            const result = [];
            let globalOffsetMs = 0;

            // 1. 提取全局时间偏移标签 [offset: +/-xxx]
            const offsetReg = /\[offset:\s*([+-]?\d+)\]/i;
            for (const line of lines) {
                const offMatch = line.match(offsetReg);
                if (offMatch) {
                    globalOffsetMs = parseInt(offMatch[1], 10) || 0;
                    break;
                }
            }

            // 2. 支持无小数 [mm:ss]、变长小数 [mm:ss.s] / [mm:ss.xx] / [mm:ss.xxx] 以及分秒毫秒
            const timeReg = /\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g;

            for (const line of lines) {
                // 忽略非歌词的元数据标签行，如 [ti:], [ar:], [al:], [by:], [offset:]
                if (/^\[(ti|ar|al|by|offset|length):/i.test(line.trim())) continue;

                const matches = [...line.matchAll(timeReg)];
                if (matches.length === 0) continue;
                const text = line.replace(timeReg, '').trim();
                if (!text) continue;

                for (const match of matches) {
                    const m = parseInt(match[1], 10);
                    const s = parseInt(match[2], 10);
                    const fracStr = match[3] || '0';
                    const ms = parseInt(fracStr.padEnd(3, '0').slice(0, 3), 10);
                    let totalTime = m * 60000 + s * 1000 + ms + globalOffsetMs;
                    if (totalTime < 0) totalTime = 0;
                    result.push({ time: totalTime, text: text });
                }
            }
            result.sort((a, b) => a.time - b.time);
            return isPureMusicLyric(result) ? result : splitLongLyrics(result);
        }
        window.parseLRC = parseLRC;

        // 智能优化歌名分行逻辑（古典作品乐章绑定、括号副标题语义换行、破折号断句、防末尾寡字）
        function formatSongTitle(rawTitle) {
            if (!rawTitle) return "";
            // 0. 规范化弯单双引号并紧凑英文缩写（如 "It’s" -> "It's"，杜绝 CJK 全角单引号占用大字格空白）
            let t = rawTitle.replace(/[\u2018\u2019\u0060\u00b4]/g, "'");
            t = t.replace(/[\u201c\u201d]/g, '"');
            t = t.replace(/\b([a-zA-Z]+)\s*'\s*([a-zA-Z]+)\b/g, "$1'$2");

            // 1. 标准化标点符号与其后空格：确保冒号后有空格（如 "K. 285:I. Allegro" -> "K. 285: I. Allegro"）
            t = t.replace(/:([^\s])/g, ': $1');
            // 2. 乐章罗马数字（I. / II. / III. / IV. 等）与后方速度标记之间绑定不换行空格（\u00A0），
            //    确保 "I." 和 "Allegro" 绝对保持在同一行，绝不孤立分行
            t = t.replace(/\b([IVXLCDM]+\.)\s+/gi, '$1\u00A0');
            // 3. 作品编号前缀（Op. / K. / BWV / Hob. / No.）与其编号之间绑定不换行空格
            t = t.replace(/\b(Op\.|K\.|BWV|Hob\.|No\.)\s*(\d+)/gi, '$1\u00A0$2');
            // 4. 合作歌手标识词绑定（feat. / ft. / with）
            t = t.replace(/\b(feat\.|ft\.|with)\s+/gi, '$1\u00A0');

            // 5. 智能语义断句分行（副标题、影视原声括号、版本说明、破折号断句）
            // 当歌名总字符数较长 (>= 12 个字符) 且包含括号或破折号时，在断句处引入语义换行 \n
            if (t.length >= 12) {
                // 括号副标题前插入换行（如 "好不容易 (电视剧《华灯初上》片尾曲)" -> "好不容易\n(电视剧《华灯初上》片尾曲)"）
                // 仅当括号前已有至少 2 个字符的主歌名时断句，避免标题以括号开头时首行空行
                t = t.replace(/^(.{2,}?)\s*([\(（【\[])(?=[^\)）\]】]{2,}[\)）\]】])/u, '$1\n$2');

                // 破折号副标题前插入换行（如 "青花瓷 - 伴奏" -> "青花瓷\n- 伴奏"）
                if (!t.includes('\n')) {
                    t = t.replace(/^(.{2,}?)\s+([—–\-]\s+.+)$/u, '$1\n$2');
                }
            }

            return t;
        }

        // Android 原生 Visualizer 实时回调：接收 9 个真实物理频段 (0.08 ~ 1.0)

                Math.max(0.08, Math.min(1.0, b1 || 0)),
                Math.max(0.08, Math.min(1.0, b2 || 0)),
                Math.max(0.08, Math.min(1.0, b3 || 0)),
                Math.max(0.08, Math.min(1.0, b4 || 0)),
                Math.max(0.08, Math.min(1.0, b5 || b3 || 0)),
                Math.max(0.08, Math.min(1.0, b6 || b4 || 0)),
                Math.max(0.08, Math.min(1.0, b7 || b4 || 0)),
                Math.max(0.08, Math.min(1.0, b8 || b4 || 0))

            const largeVisible = !!(largeViz && largeViz.style.display === 'flex');

            // 仅在检索占位频谱可见或静音归零时更新 5 柱迷你均衡器 DOM，杜绝隐藏态 25Hz 无效重绘

        // ===== 歌词视口手势上下拖拽滑动与 3 秒柔顺回滚 =====
        let isManualScrolling = false;
        let isDraggingLyrics = false;
        let dragStartY = 0;
        let dragStartTranslateY = 0;
        let currentTranslateY = 0;

        function updateLyricHighlight(targetIndex, instant) {
            const oldIndex = renderedLyricIndex;
            const lines = document.querySelectorAll('.lyric-line');
            if (!lines || lines.length === 0) return;

            if (oldIndex < 0 || (instant && oldIndex === targetIndex)) {
                // 首次高亮或全量初始化
                for (let idx = 0; idx < lines.length; idx++) {
                    const el = lines[idx];
                    const dist = Math.abs(idx - targetIndex);

                    } else if (el.style.transition) {

                        } else {
                            newClass += ' far';
                        }
                    }
                    el.className = newClass;
                }
            } else if (oldIndex !== targetIndex) {
                // 真正邻域并集：[oldIndex-4, oldIndex+4] ∪ [targetIndex-4, targetIndex+4]
                const affectedIndices = new Set();
                const total = lines.length;
                for (let i = oldIndex - 4; i <= oldIndex + 4; i++) {
                    if (i >= 0 && i < total) affectedIndices.add(i);
                }
                for (let i = targetIndex - 4; i <= targetIndex + 4; i++) {
                    if (i >= 0 && i < total) affectedIndices.add(i);
                }
                affectedIndices.forEach(idx => {
                    const el = lines[idx];
                    if (!el) return;
                    const dist = Math.abs(idx - targetIndex);
                    if (instant) {
                        el.style.transition = 'none';
                    } else if (el.style.transition) {

                    }

                    if (dist === 0) {

                    } else {

                            newClass += ` near near-${dist}`;
                        } else {
                            newClass += ' far';
                        }
                    }

        function scrollToLyricIndex(index, animated) {
            const stream = document.getElementById('lyricsStream');

        function triggerLyricFadeTransition(targetIdx) {

            if (!stream) {
                isManualScrolling = false;
                return;

            const destIndex = (typeof targetIdx === 'number' && targetIdx >= 0) ? targetIdx : activeLyricIndex;

        function getLyricLineStepPx() {

        function initLyricsDragGesture() {

        // 演职员制作信息与纯音乐占位行统一过滤正则（供纯音乐识别与蓝牙实时歌词校准共用）
        const CREDIT_LINE_REGEX = /^(作词|作曲|编曲|制作|制作人|监制|混音|混音师|母带|母带工程|录音|录音师|录音棚|录音室|吉他|木吉他|电吉他|贝斯|鼓|键盘|钢琴|弦乐|小提琴|大提琴|古筝|二胡|笛子|箫|琵琶|和声|和音|伴唱|演唱|女声|男声|主唱|合唱|配唱|制作统筹|统筹|企划|文案|宣传|推广|出品|出品人|发行|监制人|封面|设计|鸣谢|特别鸣谢|指导|配音|念白|旁白|语言指导|粤语指导|潮语指导|闽南语指导|方言指导|原唱|翻唱|词|曲|编|混|录|唱|op|sp|written by|composed by|arranged by|produced by|mixed by|mastered by|recorded by|recorded at|vocal|vocals|chorus|guitar|bass|drums|piano|strings|lyrics by|music by|published by)[:：\s]/i;
        const PURE_MUSIC_REGEX = /(纯音乐|请欣赏|没有填词|暂无歌词|无歌词|享受音乐|instrumental|no lyrics|pure music)/i;

        // 智能判断歌词是否为纯音乐（覆盖“作词：... 作曲：... 纯音乐，请欣赏”、无填词、或纯制作演职员信息）
        function isPureMusicLyric(lrcArray) {
            if (!lrcArray || lrcArray.length === 0) return true;

            let realSingingLines = 0;
            let hasPureMusicMarker = false;

            for (const item of lrcArray) {
                const text = (item.text || "").trim();
                if (!text) continue;

                if (PURE_MUSIC_REGEX.test(text)) {
                    hasPureMusicMarker = true;
                    continue;
                }

                if (CREDIT_LINE_REGEX.test(text)) {
                    // 演职员名单/制作信息行，非歌词唱词
                    continue;
                }

                // 属于实际唱词
                realSingingLines++;
            }

            // 1. 若出现了明确的纯音乐占位文案，只要实际唱词行 <= 2，即确认为纯音乐
            if (hasPureMusicMarker && realSingingLines <= 2) {
                return true;
            }

            // 2. 若全篇只包含作词/作曲等演职员信息而无任何实际唱词，也归为纯音乐
            if (realSingingLines === 0) {
                return true;
            }

            return false;
        }

        // 蓝牙实时歌词与网络拉取官方歌词的双层时间窗口与权威校准引擎
        let isOfficialLyricVerified = false;
        let lastHardwarePosSyncTime = 0;

        function normalizeLyricForMatch(text) {
            return String(text || "")
                .toLowerCase()
                .replace(/[\u2018\u2019\u0060\u00b4]/g, "'")

                const minLen = Math.min(lClean.length, sClean.length);
                const maxLen = Math.max(lClean.length, sClean.length);
                if (minLen >= 2 && (minLen / maxLen) >= 0.65) {

                }

            return 0;

        function crossCheckLyrics(streamLyric) {
            if (!streamLyric || !hasOfficialLyrics || !lyrics || lyrics.length === 0) return;

            const trimmedStream = String(streamLyric).trim();
            if (!trimmedStream) return;
            // 忽略纯音乐与演职员制作信息行（如“演唱：...”、“录音师：...”、“录音棚：...”、“潮语指导：...”），防止误将播放时钟拽回片头
            if (PURE_MUSIC_REGEX.test(trimmedStream) || CREDIT_LINE_REGEX.test(trimmedStream)) return;
            if (trimmedStream.includes("纯音乐") || trimmedStream.includes("请欣赏") || trimmedStream.includes("作词") || trimmedStream.includes("作曲")) return;

            // 纯净文本标准化（去除标点、符号、空格，统一小写与常见英语缩略词如 we've/we、gotta/got to）
            const sClean = normalizeLyricForMatch(trimmedStream);

            const curEstimated = lastPositionMs + (isPlaying ? (performance.now() - lastSyncTime) * playbackSpeed : 0);

            // 严禁命中第一个候选就提前 break（否则如《Sign of the Times》中密集重复的 "The bullets" / "We gotta get away"

            let bestWindowScoreDist = Infinity;

                if (CREDIT_LINE_REGEX.test(rawLine)) continue;
                const lTime = lyrics[i].time;
                if (lTime >= curEstimated - WINDOW_MS && lTime <= curEstimated + WINDOW_MS) {
                    const lClean = normalizeLyricForMatch(rawLine);
                    const matchType = evaluateLyricMatch(lClean, sClean);
                    if (matchType > 0) {
                        let scoreDist = Math.abs(lTime - curEstimated);
                        // 精确匹配绝对优先于子串包含匹配（如 "Stop your crying" 优先于 "Just stop your crying"）
                        if (matchType < 3) {
                            scoreDist += 3500;
                        }
                        // 顺向播放单调偏置：对落后于当前已激活行 (i < activeLyricIndex) 的历史重复句施加逆向惩罚，

                        if (activeLyricIndex >= 0 && i < activeLyricIndex && curEstimated >= (lyrics[activeLyricIndex].time - 2000)) {

                        }
                        if (scoreDist < bestWindowScoreDist) {
                            bestWindowScoreDist = scoreDist;
                            matchedIndex = i;
                        }
                    }
                }
            }

            // 第二层（全局兜底窗口）：仅当优先窗口未命中，且硬件 AVRCP 时钟未处于实时高频同步锁定态时，
            // 使用严格的高置信度匹配寻找全局最近候选行（杜绝如 01:04 的长句因细微词差落入全局窗口后，
            // 误命中 04:20 处的短句引发跨分钟远距离乱跳）。
            const hardwarePosLocked = (lastHardwarePosSyncTime > 0 && (performance.now() - lastHardwarePosSyncTime) < 3500 && lastPositionMs > 0);
            if (matchedIndex < 0 && !hardwarePosLocked) {

                for (let i = 0; i < lyrics.length; i++) {
                    const rawLine = (lyrics[i].text || "").trim();
                    if (CREDIT_LINE_REGEX.test(rawLine)) continue;
                    const lClean = normalizeLyricForMatch(rawLine);
                    const matchType = evaluateLyricMatch(lClean, sClean);
                    // 全局跨窗口兜底要求精确匹配或极高长度占比 (>= 0.8)
                    const lenRatio = (lClean && sClean) ? (Math.min(lClean.length, sClean.length) / Math.max(lClean.length, sClean.length)) : 0;
                    if (matchType === 3 || (matchType === 2 && lenRatio >= 0.8)) {

                        if (scoreDist < bestFallbackScoreDist) {
                            bestFallbackScoreDist = scoreDist;
                            matchedIndex = i;
                        }
                    }

            if (matchedIndex >= 0) {

                const timeDiff = Math.abs(matchedTime - curEstimated);

                if (activeLyricIndex >= 0 && matchedIndex < activeLyricIndex && timeDiff <= 3500 && curEstimated >= (lyrics[activeLyricIndex].time - 3500)) {

                activeLyricIndex = matchedIndex;
                if (!isManualScrolling) {
                    updateLyricHighlight(activeLyricIndex);
                    scrollToLyricIndex(activeLyricIndex, true);
                }
                // 仅当估算时钟与匹配行时间偏差超过阈值时才重设播放时钟，
                // 杜绝正常播放时因行首时间戳回写导致进度条倒退跳变（如 00:06 跳回 00:04）
                const reanchorThreshold = hardwarePosLocked ? 5000 : 2500;
                if (isPlaying && matchedTime > 0 && timeDiff > reanchorThreshold) {

                    lastSyncTime = performance.now();
                }
            }
        }
        window.crossCheckLyrics = crossCheckLyrics;

        function renderLyrics(lrcArray) {
            lyrics = lrcArray;
            lastHardwarePosSyncTime = 0;
            const stream = document.getElementById('lyricsStream');
            const emptyBox = document.getElementById('emptyLyrics');
            const emptyText = document.getElementById('emptyText');

            const isPureMusic = isPureMusicLyric(lyrics);

                activeLyricIndex = -1;
                renderedLyricIndex = -1;

                    if (stream) {
                        stream.innerHTML = '';
                        stream.style.display = 'none';

                    if (largeViz) largeViz.style.display = 'flex';

            activeLyricIndex = 0;
            renderedLyricIndex = -1;

            if (emptyBox) {
                emptyBox.style.transition = 'opacity 0.25s ease-out';
                emptyBox.style.opacity = '0';

                    if (hasOfficialLyrics && emptyBox) {
                        emptyBox.style.display = 'none';
                        syncSpectrumVisibility();
                    }
                }, 260);
            }
            syncSpectrumVisibility();

            // 2. 新歌词直接从第0行开始，平滑淡入展示 (0.35s)
            if (stream) {
                stream.innerHTML = '';
                stream.style.display = 'block';
                stream.style.transition = 'none';
                stream.style.opacity = '0';
                stream.style.transform = 'translateY(0px)';
                currentTranslateY = 0;

                lyrics.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'lyric-line' + (index === 0 ? ' active' : (index <= 4 ? ` near near-${index}` : ' far'));
                    div.id = `line-${index}`;
                    div.textContent = item.text;

                });
