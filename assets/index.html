<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>蓝牙音乐看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-overflow-scrolling: auto !important;
        }

        /* 彻底消除任何系统滚动条 */
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }
        ::-webkit-scrollbar-thumb {
            display: none !important;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0b0d10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow: hidden !important;
            overscroll-behavior: none !important;
            touch-action: none !important;
        }

        /* 低配图形降级模式 (针对低端电视盒与老旧车机，禁用高消耗的 backdrop-filter 模糊与 GPU 重合运算) */
        body.perf-mode, body.perf-mode * {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        body.perf-mode .ambient-bg {
            filter: none !important;
            opacity: 0.15 !important;
        }
        body.perf-mode .lyrics-stream {
            contain: content;
        }

        /* 动态全屏氛围背景约束容器 */
        .ambient-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-bg {
            position: absolute;
            top: -15%;
            left: -15%;
            width: 130%;
            height: 130%;
            background-size: cover;
            background-position: center;
            filter: blur(85px) brightness(0.26) saturate(1.8);
            transform: scale(1.05);
            transition: background-image 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .ambient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 50%, rgba(15, 18, 24, 0.15) 0%, rgba(11, 13, 16, 0.72) 100%);
        }

        /* 全屏容器：网格式纵向布局 */
        .container {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 18px 36px 16px 36px;
            box-sizing: border-box;
        }

        /* 顶部全宽栏：左上角设备电量胶囊，右上角退出按钮 */
        .top-bar {
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 60;
            flex-shrink: 0;
        }

        /* 设备电量胶囊与浮层容器 */
        .device-card-wrapper {
            position: relative;
            display: inline-block;
        }

        .device-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 38px;
            padding: 0 18px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(16px);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* 触控命中热区扩展：在四周增加无形触控垫，杜绝电视触控点偏误触 */
        .device-pill::after {
            content: '';
            position: absolute;
            top: -24px;
            bottom: -24px;
            left: -28px;
            right: -28px;
            z-index: 1;
        }

        .device-pill:active, .device-pill.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: scale(0.97);
        }

        .device-pill * {
            pointer-events: none;
        }

        .device-bt-icon {
            width: 13px;
            height: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            fill: #00d2ff;
            flex-shrink: 0;
        }

        .device-bt-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .device-status-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.85);
        }

        /* 展开的详情浮层卡片：与四个角落及音量组件完全相同的磨砂毛玻璃风格 */
        .device-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 270px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 14px 16px;
            box-sizing: border-box;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
        }

        .device-dropdown.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .device-dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            margin-bottom: 10px;
        }

        .device-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .device-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1db954;
            box-shadow: 0 0 8px #1db954;
            flex-shrink: 0;
        }

        .device-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-status-badge {
            font-size: 11px;
            color: #1db954;
            background: rgba(29, 185, 84, 0.12);
            border: 1px solid rgba(29, 185, 84, 0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .device-dropdown-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .spec-label {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .spec-val-text {
            color: rgba(255, 255, 255, 0.88);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: monospace, -apple-system, sans-serif;
        }

        /* 顶部右侧：简约叉叉图标按钮（支持长按3秒充能进度环，视觉中心精准居中） */
        .btn-close {
            position: relative;
            width: 38px;
            height: 38px;
            box-sizing: border-box;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            padding: 0;
            margin: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-close::after {
            content: '';
            position: absolute;
            top: -24px;
            bottom: -24px;
            left: -28px;
            right: -28px;
            z-index: 1;
        }

        .close-ring-svg {
            position: absolute;
            top: -1px;
            left: -1px;
            width: 36px;
            height: 36px;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .close-ring-bg {
            fill: none;
            stroke: transparent;
            stroke-width: 2.2;
        }

        .close-ring-bar {
            fill: none;
            stroke: #ff4b2b;
            stroke-width: 2.2;
            stroke-dasharray: 107;
            stroke-dashoffset: 107;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.15s ease-out;
        }

        .btn-close.pressing .close-ring-bar {
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 3s linear;
        }

        .close-x-icon {
            width: 18px;
            height: 18px;
            display: block;
            margin: auto;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            pointer-events: none;
        }

        .btn-close:active {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: scale(0.92);
        }

        /* 中部主体双栏区 */
        .main-body {
            flex: 1;
            width: 100%;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* 左侧面板：黑胶唱机与播控一体化高阶设计 */
        .left-panel {
            width: 44%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-right: 36px;
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            gap: 20px;
        }

        .turntable-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .vinyl-record {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background:
                radial-gradient(circle, transparent 36%, rgba(255, 255, 255, 0.04) 37%, transparent 38%),
                radial-gradient(circle, transparent 48%, rgba(255, 255, 255, 0.035) 49%, transparent 50%),
                radial-gradient(circle, transparent 62%, rgba(255, 255, 255, 0.04) 63%, transparent 64%),
                radial-gradient(circle, transparent 76%, rgba(255, 255, 255, 0.035) 77%, transparent 78%),
                radial-gradient(circle, #0e1013 0%, #17191d 30%, #0d0f12 50%, #1a1d22 70%, #08090a 100%);
            box-shadow:
                0 22px 55px rgba(0, 0, 0, 0.75),
                inset 0 0 0 2px rgba(255, 255, 255, 0.08),
                inset 0 0 16px rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: spinVinyl 24s linear infinite;
            animation-play-state: paused;
            transition: box-shadow 0.6s ease;
        }

        .vinyl-record.playing {
            animation-play-state: running;
            box-shadow:
                0 26px 60px rgba(0, 0, 0, 0.82),
                0 0 30px rgba(255, 255, 255, 0.12),
                inset 0 0 0 2px rgba(255, 255, 255, 0.12);
        }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-cover {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow:
                0 0 0 4px #0d0f12,
                0 0 0 5px rgba(255, 255, 255, 0.16),
                inset 0 0 16px rgba(0, 0, 0, 0.7);
            background: #14161b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl-cover-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 2;
        }

        .vinyl-cover-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .vinyl-center-dot {
            display: none;
        }

        .tonearm-base {
            display: none;
        }

        /* 真实黑胶唱臂：精工金属材质、高保真倒角与唱头，根据播放进度实时计算旋转角度 */
        .tonearm {
            position: absolute;
            top: -38px;
            right: 8px;
            width: 72px;
            height: 208px;
            transform-origin: 36px 54.4px;
            transform: rotate(-16deg);
            transition: transform  0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
            mix-blend-mode: screen;
            pointer-events: none;
            will-change: transform;
        }

        .tonearm-overlay {
            width: 100%;
            height: 100%;
            display: block;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        .tonearm svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 紧凑而富有质感的控制底座 */
        .player-deck {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 16px 20px 15px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .meta-container {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        .song-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.34;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
            overflow-wrap: break-word;
            line-break: strict;
            text-wrap: balance;
            white-space: pre-line;
        }

        .song-artist {
            font-size: 15.5px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 6px;
            line-height: 1.38;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }

        .progress-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .time-label {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            letter-spacing: 0.5px;
            min-width: 36px;
            text-align: center;
        }

        .progress-bar-bg {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            position: relative;
            overflow: visible;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            border-radius: 3px;
            transition: width 0.3s linear;
        }

        .progress-bar-thumb {
            position: absolute;
            right: -4px;
            top: -2.5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 75, 43, 0.9);
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-ctrl:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.22);
        }

        .btn-ctrl svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            pointer-events: none;
        }

        .btn-main {
            width: 52px;
            height: 52px;
            background: #ffffff;
            border: none;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.28);
        }

        .btn-main:active {
            transform: scale(0.92);
            background: #e6e6e6;
            box-shadow: 0 3px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-main svg {
            width: 24px;
            height: 24px;
            fill: #0b0d10;
        }

        /* 右侧面板：歌词大视口（完全对称居中） */
        .right-panel {
            width: 56%;
            height: 100%;
            padding: 0 36px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
        }

        .lyrics-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            touch-action: pan-y;
        }

        .lyrics-viewport:active {
            cursor: grabbing;
        }

        .lyrics-stream {
            position: absolute;
            width: 100%;
            top: 40%;
            /* 平滑跨行缓动曲线：五次减速曲线柔顺回弹 */
            transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
            text-align: center;
            will-change: transform;
        }

        /* 
           歌词固定行高设计：彻底杜绝动态字体尺寸变化引起的 DOM 布局重排（Reflow）颠簸抖动！
           完全水平居中对齐，高亮放大通过 transform-origin: center center 从正中心等比放大，平滑对称！
        */
        .lyric-line {
            height: 50px;
            line-height: 50px;
            font-size: 21px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0.15;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
            white-space: nowrap;
            overflow: visible;
        }

        /* 当前激活歌词：高亮、实心白、无模糊杂边、彻底去除发散光晕 */
        .lyric-line.active {
            font-weight: 700;
            color: #ffffff;
            opacity: 1;
            transform: scale(1.28);
            text-shadow: none !important;
        }

        .lyric-line.near-1 {
            color: rgba(255, 255, 255, 0.85);
            opacity: 0.75;
            transform: scale(1.04);
        }

        .lyric-line.near-2 {
            color: rgba(255, 255, 255, 0.65);
            opacity: 0.45;
            transform: scale(1.0);
        }

        .lyric-line.near-3 {
            color: rgba(255, 255, 255, 0.45);
            opacity: 0.22;
            transform: scale(0.98);
        }

        .lyric-line.near-4 {
            color: rgba(255, 255, 255, 0.30);
            opacity: 0.08;
            transform: scale(0.96);
        }

        .lyric-line.far {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none;
            transform: scale(0.94);
            transition: none !important;
        }

        /* 蓝牙实时单行车载歌词视口：纯净大字无晕光 */
        .live-stream-box {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
            padding-bottom: 20px;
            text-align: center;
            padding-left: 20px;
            padding-right: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .live-stream-lyric {
            font-size: 38px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.5;
            letter-spacing: 0.6px;
            text-shadow: none !important;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 92%;
            word-break: break-word;
        }

        .empty-lyrics {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            gap: 20px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.4s ease;
        }

        .empty-lyrics-text {
            font-size: 26px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.88);
            letter-spacing: 1.2px;
            text-align: center;
        }

        .equalizer-wave {
            display: flex;
            gap: 7px;
            align-items: flex-end;
            height: 38px;
        }

        .wave-bar {
            width: 5px;
            height: 38px;
            background: linear-gradient(to top, #ff416c, #ff4b2b);
            border-radius: 2.5px;
            transform-origin: bottom center;
            transform: scaleY(0.08);
            transition: transform 0.08s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            will-change: transform;
        }

        /* 律动氛围：大号发烧级全屏声波频谱动画 */
        .large-visualizer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            pointer-events: none;
            z-index: 10;
        }

        .large-wave {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 120px;
        }

        .large-bar {
            width: 10px;
            height: 120px;
            background: linear-gradient(to top, #ff416c, #ff4b2b, #f5a623);
            border-radius: 5px;
            transform-origin: bottom center;
            transform: scaleY(0.08);
            box-shadow: 0 0 18px rgba(255, 75, 43, 0.45);
            transition: transform 0.08s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            will-change: transform;
        }

        .large-wave-title {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 2.5px;
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        /* 底部全宽栏：左下角音频硬件规格，右下角歌词源切换 */
        .bottom-bar {
            width: 100%;
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 50;
            flex-shrink: 0;
            padding-top: 4px;
        }

        /* 全屏左下角：发烧级音频参数卡片（与四个角落及音量组件统一 36px 规格） */
        .audio-spec-card {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 36px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.3px;
            font-variant-numeric: tabular-nums;
        }

        .spec-param {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
        }

        .spec-slash, .spec-bullet {
            color: rgba(255, 255, 255, 0.35);
        }

        /* 全屏右下角：歌词源切换胶囊（与四个角落及音量组件统一 36px 规格） */
        .source-tag {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 38px;
            padding: 0 18px;
            font-size: 13.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 20px;
            letter-spacing: 0.3px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        /* 触控命中热区扩展：在四周增加无形触控垫，大幅提升右下角按钮触控容错率 */
        .source-tag::after {
            content: '';
            position: absolute;
            top: -30px;
            bottom: -30px;
            left: -36px;
            right: -36px;
            z-index: 1;
        }

        .source-tag * {
            pointer-events: none;
        }

        .source-tag:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.96);
        }

        .source-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff3a3a;
            display: inline-block;
            transition: background-color 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 10px rgba(255, 58, 58, 0.8);
            flex-shrink: 0;
        }

        /* 歌词源二级选择弹层菜单：与四个角落及音量组件完全相同的磨砂毛玻璃风格 */
        .lyric-source-menu {
            position: fixed;
            right: 36px;
            bottom: 58px;
            width: 216px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 200;
            padding: 10px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px) scale(0.96);
            transform-origin: bottom right;
            transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lyric-source-menu.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .source-menu-header {
            font-size: 11.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.55);
            padding: 2px 6px 9px 6px;
            letter-spacing: 0.8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-menu-items {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .source-menu-item {
            width: 100%;
            height: 46px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            background: transparent;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s ease, transform 0.1s ease;
            outline: none;
            position: relative;
        }

        /* 菜单项无死角命中扩展 */
        .source-menu-item::after {
            content: '';
            position: absolute;
            top: -3px;
            bottom: -3px;
            left: 0;
            right: 0;
            z-index: 1;
        }

        .source-menu-item:hover, .source-menu-item:active {
            background: rgba(255, 255, 255, 0.10);
        }

        .source-menu-item.active {
            background: rgba(255, 255, 255, 0.16);
        }

        .menu-item-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .source-menu-item:hover .menu-item-dot {
            transform: scale(1.25);
        }

        .menu-item-name {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.90);
            flex: 1;
            letter-spacing: 0.2px;
        }

        .menu-item-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            transform: scale(0.8);
        }

        .source-menu-item.active .menu-item-check {
            opacity: 1;
            transform: scale(1);
        }

        .source-switch-icon {
            font-size: 12px;
            opacity: 0.6;
            margin-left: 2px;
        }

        /* 无操作后自动优雅渐隐四个角落的控件与二级菜单 */
        .top-bar, .bottom-bar {
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 1;
        }

        body.idle .top-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
        }

        body.idle .bottom-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
        }

        body.idle .lyric-source-menu,
        body.idle .device-dropdown {
            opacity: 0;
            pointer-events: none;
        }

        /* 常驻垂直音量控制组件：极简磨砂质感，与右上角关闭按钮宽度相等（36px）、右边距严格对齐（36px），加减号位于圆弧圆心 */
        .volume-widget {
            position: fixed;
            right: 36px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            padding: 0;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 60;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body.idle .volume-widget {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) scale(0.96);
        }

        /* 手机端按键调整音量时：仅淡入音量条，四个角的控件保持隐藏 */
        body.idle .volume-widget.force-show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .vol-btn {
            width: 36px;
            height: 36px;
            box-sizing: border-box;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            padding: 0;
            margin: 0;
            border-radius: 50%;
            transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .vol-btn:active {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            transform: scale(0.9);
        }

        .vol-btn svg {
            width: 18px;
            height: 18px;
            display: block;
            margin: auto;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            pointer-events: none;
        }

        .vol-track-container {
            width: 100%;
            padding: 2px 0 3px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 禁止按到音量条直接跳跃调节 */
        }

        .vol-track {
            width: 4px;
            height: 96px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            pointer-events: none;
        }

        .vol-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, #00d2ff, #0072ff);
            border-radius: 2px;
            transition: height 0.12s ease-out;
            pointer-events: none;
        }

        .vol-pct-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.2px;
            text-align: center;
            width: 100%;
            padding: 2px 0 2px 0;
            line-height: 1;
            user-select: none;
            pointer-events: none;
        }

        /* 优雅提示小弹窗 */
        .toast-tip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(18, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            padding: 14px 24px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast-tip.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <!-- 背景约束容器，彻底杜绝任何拖拽滚动溢出 -->
    <div class="ambient-wrapper">
        <div class="ambient-bg" id="ambientBg"></div>
        <div class="ambient-overlay"></div>
    </div>

    <div class="container">
        <!-- 顶部全宽栏：左上角设备电量胶囊与详情卡片，右上角关闭按钮 -->
        <div class="top-bar">
            <div class="device-card-wrapper" id="deviceCardWrapper">
                <button class="device-pill" id="devicePill" onclick="toggleDeviceInfo(event)" title="点击查看连接设备详情">
                    <span class="device-bt-icon">
                        <svg viewBox="0 0 24 24"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
                    </span>
                    <span class="device-status-text" id="deviceStatusText">等待连接</span>
                </button>

                <!-- 浮层设备详情卡片 -->
                <div class="device-dropdown" id="deviceDropdown">
                    <div class="device-dropdown-header">
                        <div class="device-name-row">
                            <span class="device-status-dot" id="dropdownStatusDot"></span>
                            <span class="device-name" id="dropdownDeviceName">—</span>
                        </div>
                        <span class="device-status-badge" id="dropdownStatusBadge">等待连接</span>
                    </div>
                    <div class="device-dropdown-body">
                        <div class="spec-row">
                            <span class="spec-label">MAC 地址</span>
                            <span class="spec-val-text" id="dropdownDeviceMac">—</span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label">传输协议</span>
                            <span class="spec-val-text">A2DP / AVRCP</span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label">音频通道</span>
                            <span class="spec-val-text">SINK (无线立体声)</span>
                        </div>
                        <div class="spec-row" style="margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.08); cursor: pointer;" onclick="togglePerfMode(event)" title="点击切换流畅模式">
                            <span class="spec-label">低配流畅模式</span>
                            <span class="spec-val-text" id="perfModeStatus">已关闭</span>
                        </div>
                    </div>
                </div>
            </div>

            <button class="btn-close" id="closeBtn" title="短按返回桌面，长按3秒重启App" aria-label="返回桌面">
                <svg class="close-ring-svg" viewBox="0 0 36 36">
                    <circle class="close-ring-bg" cx="18" cy="18" r="17" />
                    <circle class="close-ring-bar" id="closeRingBar" cx="18" cy="18" r="17" />
                </svg>
                <svg class="close-x-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
        </div>

        <!-- 中部主体区：左侧唱机与播控，右侧歌词流 -->
        <div class="main-body">
            <!-- 左侧面板：黑胶唱机与控制底座 -->
            <div class="left-panel">
                <div class="turntable-container">
                    <div class="vinyl-record" id="vinylRecord">
                        <div class="vinyl-cover" id="vinylCover">
                            <img id="vinylCoverImg" class="vinyl-cover-img" src="" alt="" referrerpolicy="no-referrer" />
                            <div class="vinyl-cover-placeholder" id="vinylCoverPlaceholder">
                                <svg viewBox="0 0 100 100" width="48" height="48">
                                    <circle cx="50" cy="50" r="46" fill="#222" stroke="#444" stroke-width="2"/>
                                    <circle cx="50" cy="50" r="28" fill="#151515" stroke="#333" stroke-width="1.5"/>
                                    <circle cx="50" cy="50" r="14" fill="#ff416c" opacity="0.85"/>
                                    <polygon points="46,42 58,50 46,58" fill="#ffffff"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="tonearm-base">
                        <svg viewBox="0 0 110 205" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">
                            <defs>
                                <radialGradient id="orgBasePlinth" cx="44%" cy="36%" r="64%">
                                    <stop offset="0%" stop-color="rgba(255,255,255,0.48)"/>
                                    <stop offset="48%" stop-color="rgba(255,255,255,0.20)"/>
                                    <stop offset="82%" stop-color="rgba(255,255,255,0.08)"/>
                                    <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
                                </radialGradient>
                                <linearGradient id="orgArmRest" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="rgba(255,255,255,0.72)"/>
                                    <stop offset="100%" stop-color="rgba(255,255,255,0.22)"/>
                                </linearGradient>
                            </defs>
                            <!-- 1. 磨砂亚克力基座圆托盘 (与万向球同心的大圆盘) -->
                            <circle cx="52" cy="34" r="26" fill="url(#orgBasePlinth)" stroke="rgba(255,255,255,0.45)" stroke-width="1.0"/>
                            <circle cx="52" cy="34" r="19" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.6"/>

                            <!-- 2. 唱臂停放位置 (-32°) 的支撑托架 -->
                            <path d="M 54 53 C 55 60, 61 65, 67 67" fill="none" stroke="url(#orgArmRest)" stroke-width="3.4" stroke-linecap="round"/>
                            <path d="M 64 63 C 65 70, 72 70, 74 63" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="1.8" stroke-linecap="round"/>
                            <circle cx="74" cy="63" r="1.0" fill="#ffffff"/>
                        </svg>
                    </div>
                    <div class="tonearm" id="tonearm">
                        <img src="tonearm_screen.png" alt="Tonearm" class="tonearm-overlay">
                    </div>
                </div>

                <div class="player-deck">
                    <div class="meta-container">
                        <div class="song-title" id="songTitle">等待播放蓝牙音乐...</div>
                        <div class="song-artist" id="songArtist">请在手机端播放任意音乐</div>
                    </div>

                    <div class="progress-box">
                        <span id="timeCurrent" class="time-label">00:00</span>

                    <div class="controls-row">
                        <button class="btn-ctrl" onclick="triggerPrev()" title="上一首">

                        <button class="btn-ctrl btn-main" onclick="triggerPlayPause()" title="播放/暂停">
                            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="btn-ctrl" onclick="triggerNext()" title="下一首">
                            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧面板：透明渐隐滚动歌词 -->
            <div class="right-panel">
                <div class="lyrics-viewport" id="lyricsViewport">
                    <div class="empty-lyrics" id="emptyLyrics">
                        <div class="equalizer-wave" id="equalizerWave">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                        <div class="empty-lyrics-text" id="emptyText">正在检索官方歌词与封面...</div>

                    <!-- 律动氛围：大号声波频谱动画 -->
                    <div class="large-visualizer" id="largeVisualizer">
                        <div class="large-wave" id="largeWave">
                            <div class="large-bar" id="lw0"></div>
                            <div class="large-bar" id="lw1"></div>
                            <div class="large-bar" id="lw2"></div>
                            <div class="large-bar" id="lw3"></div>
                            <div class="large-bar" id="lw4"></div>
                            <div class="large-bar" id="lw5"></div>
                            <div class="large-bar" id="lw6"></div>
                            <div class="large-bar" id="lw7"></div>
                            <div class="large-bar" id="lw8"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部全宽栏：左下角音频硬件规格，右下角歌词源切换 -->
        <div class="bottom-bar">
            <div class="audio-spec-card">
                <span class="spec-param" id="specCodec">A2DP</span>
                <span class="spec-slash">/</span>
                <span class="spec-param" id="specRate">蓝牙音频</span>
                <span class="spec-slash" id="specBitsSlash" style="display: none;">/</span>
                <span class="spec-param" id="specBits" style="display: none;"></span>

                <span class="spec-param" id="specChannels">立体声</span>

            <button class="source-tag" id="statusTag" onclick="toggleLyricMenu(event)" title="点击切换歌词源">

                <span id="statusTagText">正在匹配歌词...</span>
                <span class="source-switch-icon">▾</span>

    </div>

        <!-- 歌词源二级选择弹层菜单：极简深空磨砂毛玻璃 -->
        <div class="lyric-source-menu" id="lyricSourceMenu">
            <div class="source-menu-header">
                <span>歌词来源设置</span>
                <span style="font-size: 11px; opacity: 0.5;">点击切换</span>
            </div>
            <div class="source-menu-items">
                <button class="source-menu-item active" id="menuItem-auto" onclick="selectLyricSource('auto', event)">

    <script>
        // 彻底禁止屏幕拖动引起的 WebView 滚动

        // 低配流畅模式切换 (禁用 backdrop-filter 毛玻璃，提升低端芯片帧率)

        // 接收来自 Java 原生层的蓝牙设备状态与音频协议数据
        window.onBluetoothStatusChanged = function(data) {

            } else if (data.connectionState === 'off') {
                if (statusText) statusText.textContent = '蓝牙已关闭';
                if (dropBadge) {
                    dropBadge.textContent = '已关闭';
                    dropBadge.style.background = 'rgba(255, 59, 48, 0.2)';
                    dropBadge.style.color = '#ff3b30';
                }
                if (dropDot) dropDot.style.background = '#ff3b30';
                if (dropName) dropName.textContent = '蓝牙已关闭';
                if (dropMac) dropMac.textContent = '—';
            } else {
                // 蓝牙已配对但未连接，或处于等待连接状态
                if (statusText) statusText.textContent = '未连接';

                    dropBadge.textContent = '未连接';
                    dropBadge.style.background = 'rgba(255, 204, 0, 0.2)';
                    dropBadge.style.color = '#ffcc00';
                }
                if (dropDot) dropDot.style.background = '#8e8e93';
                if (dropName) dropName.textContent = (data.deviceName && data.deviceName !== '—') ? data.deviceName + ' (未连接)' : '—';
                if (dropMac) dropMac.textContent = data.deviceAddress || '—';
            }

            // 更新左下角音频规格
            if (data.codec) {
                const el = document.getElementById('specCodec');

            }
            if (data.sampleRate) {
                const el = document.getElementById('specRate');
                if (el) el.textContent = data.sampleRate;
            }
            const bitsEl = document.getElementById('specBits');
            const bitsSlash = document.getElementById('specBitsSlash');
            if (bitsEl) {
                if (data.bitDepth && data.bitDepth.trim() !== '') {
                    bitsEl.textContent = data.bitDepth;
                    bitsEl.style.display = 'inline';
                    if (bitsSlash) bitsSlash.style.display = 'inline';
                } else {
                    bitsEl.style.display = 'none';
                    if (bitsSlash) bitsSlash.style.display = 'none';
                }
            }
            if (data.channels) {
                const el = document.getElementById('specChannels');

        };

        function updateStatusTag(text, dotColor) {

        function setCoverImage(url) {
