<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>蓝牙音乐看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-overflow-scrolling: auto !important;
        }

        /* 彻底消除任何系统滚动条 */
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }
        ::-webkit-scrollbar-thumb {
            display: none !important;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0b0d10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow: hidden !important;
            overscroll-behavior: none !important;
            touch-action: none !important;
        }

        /* 动态全屏氛围背景约束容器 */
        .ambient-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-bg {
            position: absolute;
            top: -15%;
            left: -15%;
            width: 130%;
            height: 130%;
            background-size: cover;
            background-position: center;
            filter: blur(85px) brightness(0.26) saturate(1.8);
            transform: scale(1.05);
            transition: background-image 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .ambient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 50%, rgba(15, 18, 24, 0.15) 0%, rgba(11, 13, 16, 0.72) 100%);
        }

        /* 全屏容器：网格式纵向布局 */
        .container {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 18px 36px 16px 36px;
            box-sizing: border-box;
        }

        /* 顶部全宽栏：左上角设备电量胶囊，右上角退出按钮 */
        .top-bar {
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 60;
            flex-shrink: 0;
        }

        /* 设备电量胶囊与浮层容器 */
        .device-card-wrapper {
            position: relative;
            display: inline-block;
        }

        .device-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 34px;
            padding: 0 14px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 17px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(16px);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .device-pill:active, .device-pill.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: scale(0.97);
        }

        .device-pill * {
            pointer-events: none;
        }

        .device-bt-icon {
            width: 13px;
            height: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            fill: #00d2ff;
            flex-shrink: 0;
        }

        .device-bt-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .battery-widget {
            display: flex;
            align-items: center;
            position: relative;
        }

        .battery-shell {
            width: 22px;
            height: 11px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 3px;
            padding: 1.5px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }

        .battery-level-bar {
            height: 100%;
            width: 100%;
            background: #1db954;
            border-radius: 1px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .battery-tip {
            width: 2px;
            height: 5px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 0 1px 1px 0;
            margin-left: 1px;
        }

        .battery-pct-text {
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.85);
        }

        /* 展开的详情浮层卡片 */
        .device-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 280px;
            background: rgba(18, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 18px;
            padding: 16px 18px;
            box-sizing: border-box;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(28px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 200;
        }

        .device-dropdown.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .device-dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 12px;
        }

        .device-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .device-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1db954;
            box-shadow: 0 0 8px #1db954;
            flex-shrink: 0;
        }

        .device-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-status-badge {
            font-size: 11px;
            color: #1db954;
            background: rgba(29, 185, 84, 0.12);
            border: 1px solid rgba(29, 185, 84, 0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .device-dropdown-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .spec-label {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .spec-val-text {
            color: rgba(255, 255, 255, 0.88);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: monospace, -apple-system, sans-serif;
        }

        /* 顶部右侧：简约叉叉图标按钮 */
        .btn-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-close svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            fill: none;
            pointer-events: none;
        }

        .btn-close:active {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: scale(0.92);
        }

        /* 中部主体双栏区 */
        .main-body {
            flex: 1;
            width: 100%;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* 左侧面板：黑胶唱机与播控一体化高阶设计 */
        .left-panel {
            width: 44%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-right: 36px;
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            gap: 20px;
        }

        .turntable-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .vinyl-record {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background:
                radial-gradient(circle, transparent 36%, rgba(255, 255, 255, 0.04) 37%, transparent 38%),
                radial-gradient(circle, transparent 48%, rgba(255, 255, 255, 0.035) 49%, transparent 50%),
                radial-gradient(circle, transparent 62%, rgba(255, 255, 255, 0.04) 63%, transparent 64%),
                radial-gradient(circle, transparent 76%, rgba(255, 255, 255, 0.035) 77%, transparent 78%),
                radial-gradient(circle, #0e1013 0%, #17191d 30%, #0d0f12 50%, #1a1d22 70%, #08090a 100%);
            box-shadow:
                0 22px 55px rgba(0, 0, 0, 0.75),
                inset 0 0 0 2px rgba(255, 255, 255, 0.08),
                inset 0 0 16px rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: spinVinyl 24s linear infinite;
            animation-play-state: paused;
            transition: box-shadow 0.6s ease;
        }

        .vinyl-record.playing {
            animation-play-state: running;
            box-shadow:
                0 26px 60px rgba(0, 0, 0, 0.82),
                0 0 30px rgba(255, 255, 255, 0.12),
                inset 0 0 0 2px rgba(255, 255, 255, 0.12);
        }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-cover {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow:
                0 0 0 4px #0d0f12,
                0 0 0 5px rgba(255, 255, 255, 0.16),
                inset 0 0 16px rgba(0, 0, 0, 0.7);
            background: #14161b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl-cover-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 2;
        }

        .vinyl-cover-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .vinyl-center-dot {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 0%, #d8d8d8 40%, #777777 90%, #333333 100%);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.75), inset 0 1px 1px #ffffff;
            z-index: 10;
        }

        .tonearm-base {
            position: absolute;
            top: 2px;
            right: 22px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle, #555 0%, #222 70%, #111 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.4);
            border: 2px solid rgba(255,255,255,0.15);
            z-index: 9;
        }

        /* 真实黑胶唱臂：根据播放进度实时计算旋转角度，支持平滑物理走针 */
        .tonearm {
            position: absolute;
            top: 4px;
            right: 20px;
            width: 70px;
            height: 140px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 145"><path d="M26 0 A15 15 0 0 1 46 0 L41 95 L20 132 L9 126 L29 93 Z" fill="%23e2e2e2"/><path d="M34 10 L37 93 L27 91 Z" fill="%23ffffff" opacity="0.3"/><circle cx="16" cy="129" r="3" fill="%23ff416c"/></svg>');
            background-repeat: no-repeat;
            background-size: contain;
            transform-origin: 36px 9px;
            transform: rotate(-32deg);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 10;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6));
            will-change: transform;
        }

        /* 紧凑而富有质感的控制底座 */
        .player-deck {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 18px 20px 16px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .meta-container {
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
        }

        .song-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.3;
        }

        .song-artist {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.65);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .time-label {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            letter-spacing: 0.5px;
            min-width: 36px;
            text-align: center;
        }

        .progress-bar-bg {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            position: relative;
            overflow: visible;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            border-radius: 3px;
            transition: width 0.3s linear;
        }

        .progress-bar-thumb {
            position: absolute;
            right: -4px;
            top: -2.5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 75, 43, 0.9);
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-ctrl:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.22);
        }

        .btn-ctrl svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            pointer-events: none;
        }

        .btn-main {
            width: 52px;
            height: 52px;
            background: #ffffff;
            border: none;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.28);
        }

        .btn-main:active {
            transform: scale(0.92);
            background: #e6e6e6;
            box-shadow: 0 3px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-main svg {
            width: 24px;
            height: 24px;
            fill: #0b0d10;
        }

        /* 右侧面板：歌词大视口 */
        .right-panel {
            width: 56%;
            height: 100%;
            padding-left: 36px;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
        }

        .lyrics-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            /* 纯净透明视口，绝无任何黑色遮罩与 GPU 闪烁 */
        }

        .lyrics-stream {
            position: absolute;
            width: 100%;
            top: 40%;
            /* 采用苹果级临界阻尼缓动曲线，丝滑推进，绝不回弹抖动 */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            text-align: left;
            will-change: transform;
        }

        /* 
           歌词固定行高设计：彻底杜绝动态字体尺寸变化引起的 DOM 布局重排（Reflow）颠簸抖动！
           高亮放大完全通过 GPU transform: scale 渲染，物理 offsetTop 永恒恒定！
        */
        .lyric-line {
            height: 50px;
            line-height: 50px;
            font-size: 21px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0.15;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: left center;
            white-space: nowrap;
            overflow: visible;
        }

        /* 当前激活歌词：高亮、实心白、无模糊杂边、彻底去除发散光晕 */
        .lyric-line.active {
            font-weight: 700;
            color: #ffffff;
            opacity: 1;
            transform: scale(1.28);
            text-shadow: none !important;
        }

        .lyric-line.near-1 {
            color: rgba(255, 255, 255, 0.85);
            opacity: 0.75;
            transform: scale(1.04);
        }

        .lyric-line.near-2 {
            color: rgba(255, 255, 255, 0.65);
            opacity: 0.45;
            transform: scale(1.0);
        }

        .lyric-line.near-3 {
            color: rgba(255, 255, 255, 0.45);
            opacity: 0.22;
            transform: scale(0.98);
        }

        .lyric-line.near-4 {
            color: rgba(255, 255, 255, 0.30);
            opacity: 0.08;
            transform: scale(0.96);
        }

        .lyric-line.far {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.94);
        }

        /* 蓝牙实时单行车载歌词视口：纯净大字无晕光 */
        .live-stream-box {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
            padding-bottom: 20px;
            text-align: center;
            padding-left: 20px;
            padding-right: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .live-stream-lyric {
            font-size: 38px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.5;
            letter-spacing: 0.6px;
            text-shadow: none !important;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 92%;
            word-break: break-word;
        }

        .empty-lyrics {
            width: 100%;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            gap: 16px;
        }

        .equalizer-wave {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            height: 36px;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, #ff416c, #ff4b2b);
            border-radius: 2px;
            animation: waveBounce 1.2s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 16px; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 28px; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 36px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 22px; animation-delay: 0.4s; }
        .wave-bar:nth-child(5) { height: 14px; animation-delay: 0.15s; }

        @keyframes waveBounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }

        /* 底部全宽栏：左下角音频硬件规格，右下角歌词源切换 */
        .bottom-bar {
            width: 100%;
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 50;
            flex-shrink: 0;
            padding-top: 4px;
        }

        /* 全屏左下角：发烧级音频参数卡片（文字统一低调优雅排版） */
        .audio-spec-card {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(14px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.3px;
            font-variant-numeric: tabular-nums;
        }

        .spec-param {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
        }

        .spec-slash, .spec-bullet {
            color: rgba(255, 255, 255, 0.3);
        }

        /* 全屏右下角：歌词源切换胶囊 */
        .source-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 15px;
            letter-spacing: 0.4px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(12px);
        }

        .source-tag * {
            pointer-events: none;
        }

        .source-tag:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.96);
        }

        .source-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #1db954;
            display: inline-block;
            transition: background-color 0.3s;
        }

        .source-switch-icon {
            font-size: 12px;
            opacity: 0.6;
            margin-left: 2px;
        }

        /* 10秒无操作后自动优雅渐隐顶栏与底栏 */
        .top-bar, .bottom-bar {
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 1;
        }

        body.idle .top-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
        }

        body.idle .bottom-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
        }

        /* 右侧屏幕滑动调节音量 HUD 浮层 */
        .volume-hud {
            position: fixed;
            right: 42px;
            top: 50%;
            transform: translateY(-50%) scale(0.92);
            width: 52px;
            padding: 18px 0;
            background: rgba(18, 22, 28, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(24px);
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            transition: opacity 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .volume-hud.show {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        .volume-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            fill: #ffffff;
        }

        .volume-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .volume-track {
            width: 6px;
            height: 110px;
            background: rgba(255, 255, 255, 0.14);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
        }

        .volume-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, #00d2ff, #0072ff);
            border-radius: 3px;
            transition: height 0.08s linear;
        }

        .volume-text {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <!-- 背景约束容器，彻底杜绝任何拖拽滚动溢出 -->
    <div class="ambient-wrapper">
        <div class="ambient-bg" id="ambientBg"></div>
        <div class="ambient-overlay"></div>
    </div>

    <div class="container">
        <!-- 顶部全宽栏：左上角设备电量胶囊与详情卡片，右上角关闭按钮 -->
        <div class="top-bar">
            <div class="device-card-wrapper" id="deviceCardWrapper">
                <button class="device-pill" id="devicePill" onclick="toggleDeviceInfo(event)" title="点击查看连接设备详情">
                    <span class="device-bt-icon">
                        <svg viewBox="0 0 24 24"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
                    </span>
                    <div class="battery-widget" id="batteryWidget" style="display: none;">
                        <div class="battery-shell">
                            <div class="battery-level-bar" id="batteryLevelBar" style="width: 100%;"></div>
                        </div>
                        <span class="battery-tip"></span>
                    </div>
                    <span class="battery-pct-text" id="batteryPctText">已连接</span>
                </button>

                <!-- 浮层设备详情卡片 -->
                <div class="device-dropdown" id="deviceDropdown">
                    <div class="device-dropdown-header">
                        <div class="device-name-row">
                            <span class="device-status-dot"></span>
                            <span class="device-name" id="dropdownDeviceName">XY</span>
                        </div>
                        <span class="device-status-badge">已连接</span>
                    </div>
                    <div class="device-dropdown-body">
                        <div class="spec-row">
                            <span class="spec-label">MAC 地址</span>
                            <span class="spec-val-text" id="dropdownDeviceMac">C8:1F:E8:E2:CC:9D</span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label">设备电量</span>
                            <span class="spec-val-text" id="dropdownDeviceBat">手机未回传 (A2DP)</span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label">传输协议</span>
                            <span class="spec-val-text">A2DP / AVRCP</span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label">音频通道</span>
                            <span class="spec-val-text">SINK (无线立体声)</span>
                        </div>
                    </div>
                </div>
            </div>

            <button class="btn-close" onclick="triggerExit(event)" title="返回桌面" aria-label="返回桌面">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <!-- 中部主体区：左侧唱机与播控，右侧歌词流 -->
        <div class="main-body">
            <!-- 左侧面板：黑胶唱机与控制底座 -->
            <div class="left-panel">
                <div class="turntable-container">
                    <div class="vinyl-record" id="vinylRecord">
                        <div class="vinyl-cover" id="vinylCover">
                            <img id="vinylCoverImg" class="vinyl-cover-img" src="" alt="" referrerpolicy="no-referrer" />
                            <div class="vinyl-cover-placeholder" id="vinylCoverPlaceholder">
                                <svg viewBox="0 0 100 100" width="48" height="48">
                                    <circle cx="50" cy="50" r="46" fill="#222" stroke="#444" stroke-width="2"/>
                                    <circle cx="50" cy="50" r="28" fill="#151515" stroke="#333" stroke-width="1.5"/>
                                    <circle cx="50" cy="50" r="14" fill="#ff416c" opacity="0.85"/>
                                    <polygon points="46,42 58,50 46,58" fill="#ffffff"/>
                                </svg>
                            </div>
                        </div>
                        <div class="vinyl-center-dot"></div>
                    </div>
                    <div class="tonearm-base"></div>
                    <div class="tonearm" id="tonearm"></div>
                </div>

                <div class="player-deck">
                    <div class="meta-container">
                        <div class="song-title" id="songTitle">等待播放蓝牙音乐...</div>
                        <div class="song-artist" id="songArtist">请在手机端播放任意音乐</div>
                    </div>

                    <div class="progress-box">
                        <span id="timeCurrent" class="time-label">00:00</span>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="progressBar">
                                <div class="progress-bar-thumb"></div>
                            </div>
                        </div>
                        <span id="timeTotal" class="time-label">00:00</span>
                    </div>

                    <div class="controls-row">
                        <button class="btn-ctrl" onclick="triggerPrev()" title="上一首">
                            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        <button class="btn-ctrl btn-main" onclick="triggerPlayPause()" title="播放/暂停">
                            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button class="btn-ctrl" onclick="triggerNext()" title="下一首">
                            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧面板：透明渐隐滚动歌词 -->
            <div class="right-panel">
                <div class="lyrics-viewport" id="lyricsViewport">
                    <div class="lyrics-stream" id="lyricsStream">
                        <div class="empty-lyrics" id="emptyLyrics">
                            <div class="equalizer-wave">
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                            </div>
                            <div id="emptyText">正在检索官方歌词与封面...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部全宽栏：左下角音频硬件规格，右下角歌词源切换 -->
        <div class="bottom-bar">
            <div class="audio-spec-card">
                <span class="spec-param" id="specCodec">AAC</span>
                <span class="spec-slash">/</span>
                <span class="spec-param" id="specRate">48 kHz</span>
                <span class="spec-slash">/</span>
                <span class="spec-param" id="specBits">24-Bit</span>
                <span class="spec-bullet">·</span>
                <span class="spec-param" id="specChannels">双声道立体声</span>
            </div>

            <button class="source-tag" id="statusTag" onclick="toggleLyricSource(event)" title="点击切换歌词源">
                <span class="source-dot" id="sourceDot"></span>
                <span id="statusTagText">正在匹配歌词...</span>
                <span class="source-switch-icon">⇄</span>
            </button>
        </div>
    </div>

    <!-- 右侧屏幕滑动调节音量 HUD 浮层 -->
    <div class="volume-hud" id="volumeHud">
        <div class="volume-icon" id="volumeIcon">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </div>
        <div class="volume-track">
            <div class="volume-fill" id="volumeFill" style="height: 50%;"></div>
        </div>
        <span class="volume-text" id="volumeText">50%</span>
    </div>

    <script>
        // 彻底禁止屏幕拖动引起的 WebView 滚动
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        let currentTrack = { title: "", artist: "", album: "", duration: 0, streamLyric: "" };
        let isPlaying = false;
        let lastPositionMs = 0;
        let lastSyncTime = performance.now();
        let lyrics = [];
        let parsedOfficialLyrics = [];
        let hasOfficialLyrics = false;
        let activeLyricIndex = -1;
        let currentCoverUrl = "";
        let lyricMode = 'official'; // 'official' | 'bluetooth'
        let userExplicitMode = null; // 用户手动切换锁定模式

        // 歌曲元数据与歌词内存缓存表（避免返回桌面重新点击时重复请求与闪白）
        const songCache = {};

        function toggleDeviceInfo(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const dropdown = document.getElementById('deviceDropdown');
            const pill = document.getElementById('devicePill');
            if (dropdown) {
                const isOpen = dropdown.classList.toggle('show');
                if (pill) {
                    if (isOpen) pill.classList.add('active');
                    else pill.classList.remove('active');
                }
            }
        }

        // 点击或触摸外部区域自动关闭设备详情浮层
        function handleOutsideDismiss(e) {
            const wrapper = document.getElementById('deviceCardWrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                const dropdown = document.getElementById('deviceDropdown');
                const pill = document.getElementById('devicePill');
                if (dropdown && dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                    if (pill) pill.classList.remove('active');
                }
            }
        }
        document.addEventListener('pointerdown', handleOutsideDismiss);
        document.addEventListener('touchstart', handleOutsideDismiss, { passive: true });
        document.addEventListener('click', handleOutsideDismiss);

        // 接收来自 Java 原生层的蓝牙设备状态与音频协议数据
        window.onBluetoothStatusChanged = function(data) {
            console.log("Bluetooth status:", data);
            if (!data) return;

            const text = document.getElementById('batteryPctText');
            const dropBat = document.getElementById('dropdownDeviceBat');
            const widget = document.getElementById('batteryWidget');

            if (data.batteryLevel !== undefined && data.batteryLevel >= 0) {
                const pct = Math.min(100, Math.max(0, data.batteryLevel));
                const bar = document.getElementById('batteryLevelBar');
                if (widget) widget.style.display = 'flex';
                if (bar) {
                    bar.style.width = pct + '%';
                    if (pct <= 20) {
                        bar.style.background = '#ff4b2b';
                    } else if (pct <= 40) {
                        bar.style.background = '#f5a623';
                    } else {
                        bar.style.background = '#1db954';
                    }
                }
                if (text) text.textContent = pct + '%';
                if (dropBat) dropBat.textContent = pct + '%';
            } else {
                // 手机未通过 A2DP 回传电量（标准蓝牙车载协议限制）：不显示伪造电量，显示真实连接态
                if (widget) widget.style.display = 'none';
                if (text) text.textContent = '已连接';
                if (dropBat) dropBat.textContent = '手机未回传 (A2DP协议限制)';
            }

            if (data.deviceName) {
                const nameEl = document.getElementById('dropdownDeviceName');
                if (nameEl) nameEl.textContent = data.deviceName;
            }
            if (data.deviceAddress) {
                const macEl = document.getElementById('dropdownDeviceMac');
                if (macEl) macEl.textContent = data.deviceAddress;
            }

            // 更新左下角音频规格
            if (data.codec) {
                const el = document.getElementById('specCodec');
                if (el) el.textContent = data.codec;
            }
            if (data.sampleRate) {
                const el = document.getElementById('specRate');
                if (el) el.textContent = data.sampleRate;
            }
            if (data.bitDepth) {
                const el = document.getElementById('specBits');
                if (el) el.textContent = data.bitDepth;
            }
            if (data.channels) {
                const el = document.getElementById('specChannels');
                if (el) el.textContent = data.channels;
            }
        };

        function updateStatusTag(text, dotColor) {
            const tagText = document.getElementById('statusTagText');
            const dot = document.getElementById('sourceDot');
            if (tagText) tagText.textContent = text;
            if (dot && dotColor) dot.style.backgroundColor = dotColor;
        }

        function setCoverImage(url) {
            currentCoverUrl = url || "";
            const img = document.getElementById('vinylCoverImg');
            const bg = document.getElementById('ambientBg');
            if (currentCoverUrl) {
                img.onload = () => { img.style.opacity = '1'; };
                img.onerror = () => { img.style.opacity = '0'; };
                img.src = currentCoverUrl;
                bg.style.backgroundImage = `url('${currentCoverUrl}')`;
            } else {
                img.style.opacity = '0';
                bg.style.backgroundImage = 'none';
            }
        }

        function formatTime(ms) {
            if (!ms || ms < 0 || isNaN(ms)) return "00:00";
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function parseLRC(lrcText) {
            if (!lrcText) return [];
            const lines = lrcText.split('\n');
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;

            for (const line of lines) {
                const matches = [...line.matchAll(timeReg)];
                const text = line.replace(timeReg, '').trim();
                if (!text) continue;

                for (const match of matches) {
                    const m = parseInt(match[1]);
                    const s = parseInt(match[2]);
                    const ms = parseInt(match[3].padEnd(3, '0').slice(0, 3));
                    const totalTime = m * 60000 + s * 1000 + ms;
                    result.push({ time: totalTime, text: text });
                }
            }
            result.sort((a, b) => a.time - b.time);
            return result;
        }

        function renderLyrics(lrcArray) {
            lyrics = lrcArray;
            const stream = document.getElementById('lyricsStream');
            stream.innerHTML = '';
            activeLyricIndex = -1;

            if (!lyrics || lyrics.length === 0) {
                hasOfficialLyrics = false;
                if (currentTrack.streamLyric) {
                    showStreamLyric(currentTrack.streamLyric);
                } else {
                    stream.style.transform = 'translateY(0)';
                    stream.innerHTML = `
                        <div class="empty-lyrics">
                            <div class="equalizer-wave">
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                            </div>
                            <div>♪ 纯音乐 / 暂无官方歌词 ♪</div>
                        </div>`;
                    updateStatusTag('暂无官方歌词', '#888888');
                }
                return;
            }

            hasOfficialLyrics = true;
            lyrics.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line' + (index === 0 ? ' active' : (index <= 4 ? ` near near-${index}` : ' far'));
                div.id = `line-${index}`;
                div.textContent = item.text;
                stream.appendChild(div);
            });
        }

        function showStreamLyric(text) {
            const stream = document.getElementById('lyricsStream');
            stream.style.transform = 'translateY(-24px)';
            stream.innerHTML = `
                <div class="live-stream-box">
                    <div class="live-stream-lyric">${text}</div>
                </div>`;
            updateStatusTag('车载蓝牙实时歌词', '#4a90e2');
        }

        function toggleLyricSource(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const trackKey = (currentTrack.title + " - " + currentTrack.artist).toLowerCase().trim();
            const cached = songCache[trackKey];

            if (lyricMode === 'official') {
                lyricMode = 'bluetooth';
                userExplicitMode = 'bluetooth';
                const streamText = currentTrack.streamLyric || (cached && cached.streamLyric) || "当前蓝牙源暂未投送实时单句歌词";
                showStreamLyric(streamText);
            } else {
                lyricMode = 'official';
                userExplicitMode = 'official';
                if (hasOfficialLyrics && parsedOfficialLyrics.length > 0) {
                    renderLyrics(parsedOfficialLyrics);
                    updateStatusTag('已同步官方歌词', '#1db954');
                } else if (cached && cached.parsedLyrics && cached.parsedLyrics.length > 0) {
                    parsedOfficialLyrics = cached.parsedLyrics;
                    hasOfficialLyrics = true;
                    renderLyrics(parsedOfficialLyrics);
                    updateStatusTag('已同步官方歌词', '#1db954');
                } else {
                    renderLyrics([]);
                    updateStatusTag('正在检索官方歌词...', '#f5a623');
                }
            }
        }

        // 接收来自 Java 原生多源高速检索的网络封面与官方歌词 (iTunes, Kugou, LRCLIB)
        window.onOnlineResult = function(data) {
            console.log("onOnlineResult:", data);
            if (!data) return;
            const trackKey = (currentTrack.title + " - " + currentTrack.artist).toLowerCase().trim();
            if (!songCache[trackKey]) songCache[trackKey] = {};

            if (data.coverUrl) {
                songCache[trackKey].coverUrl = data.coverUrl;
                setCoverImage(data.coverUrl);
            }
            if (data.lyrics) {
                songCache[trackKey].rawLrc = data.lyrics;
                const parsed = parseLRC(data.lyrics);
                if (parsed.length > 0) {
                    songCache[trackKey].parsedLyrics = parsed;
                    parsedOfficialLyrics = parsed;
                    hasOfficialLyrics = true;
                    if (userExplicitMode !== 'bluetooth') {
                        lyricMode = 'official';
                        renderLyrics(parsed);
                        updateStatusTag('已同步官方歌词', '#1db954');
                    }
                    return;
                }
            }

            if (lyricMode === 'bluetooth' && currentTrack.streamLyric) {
                showStreamLyric(currentTrack.streamLyric);
            } else if (!hasOfficialLyrics) {
                renderLyrics([]);
                updateStatusTag(currentTrack.streamLyric ? '车载蓝牙歌词' : '无歌词', '#888888');
            }
        };

        window.onMetadataChanged = function(data) {
            console.log("Metadata updated:", data);
            if (!data || !data.title) return;

            const title = data.title;
            const artist = data.artist || "未知歌手";
            const album = data.album || "";
            const streamLyric = data.streamLyric || "";

            const isNewSong = (currentTrack.title !== title || currentTrack.artist !== artist);
            currentTrack = data;

            document.getElementById('songTitle').textContent = title;
            document.getElementById('songArtist').textContent = album ? `${artist} · ${album}` : artist;
            document.getElementById('timeTotal').textContent = formatTime(data.duration);

            const trackKey = (title + " - " + artist).toLowerCase().trim();
            if (!songCache[trackKey]) songCache[trackKey] = {};
            if (streamLyric) songCache[trackKey].streamLyric = streamLyric;

            if (isNewSong) {
                hasOfficialLyrics = false;
                parsedOfficialLyrics = [];
                activeLyricIndex = -1;
                userExplicitMode = null;

                // 优先从内存缓存中秒开封面和歌词
                const cached = songCache[trackKey];
                if (cached && (cached.coverUrl || cached.parsedLyrics)) {
                    if (cached.coverUrl) {
                        setCoverImage(cached.coverUrl);
                    }
                    if (cached.parsedLyrics && cached.parsedLyrics.length > 0) {
                        parsedOfficialLyrics = cached.parsedLyrics;
                        hasOfficialLyrics = true;
                        lyricMode = 'official';
                        renderLyrics(parsedOfficialLyrics);
                        updateStatusTag('已同步官方歌词', '#1db954');
                    }
                } else {
                    updateStatusTag('正在匹配官方歌词与封面...', '#f5a623');
                }
            }

            if (streamLyric) {
                if (userExplicitMode === 'bluetooth' || (!userExplicitMode && !hasOfficialLyrics)) {
                    showStreamLyric(streamLyric);
                }
            }
        };

        window.onPlaybackStateChanged = function(data) {
            if (!data) return;
            isPlaying = !!data.isPlaying;
            lastPositionMs = data.position || 0;
            lastSyncTime = performance.now();

            const vinyl = document.getElementById('vinylRecord');
            const playIcon = document.getElementById('playIcon');

            if (isPlaying) {
                vinyl.classList.add('playing');
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                vinyl.classList.remove('playing');
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        };

        function updateTimeline() {
            let currentPos = lastPositionMs;
            if (isPlaying) {
                const delta = performance.now() - lastSyncTime;
                currentPos += delta;
            }

            // 更新播放进度条
            if (currentTrack.duration > 0) {
                const pct = Math.min(100, Math.max(0, (currentPos / currentTrack.duration) * 100));
                document.getElementById('progressBar').style.width = pct + '%';
                document.getElementById('timeCurrent').textContent = formatTime(currentPos);
            }

            // 真实唱机唱针物理轨迹：根据当前播放进度从黑胶外圈(-26°)平滑走向内圈(-6°)
            const tonearm = document.getElementById('tonearm');
            if (tonearm) {
                if (isPlaying) {
                    let progressRatio = 0;
                    if (currentTrack.duration > 0) {
                        progressRatio = Math.min(1.0, Math.max(0.0, currentPos / currentTrack.duration));
                    }
                    const tonearmAngle = -26 + progressRatio * 20; // 0% 时在 -26° (外圈)，100% 时在 -6° (内圈外缘)
                    tonearm.style.transform = `rotate(${tonearmAngle.toFixed(2)}deg)`;
                } else {
                    tonearm.style.transform = 'rotate(-32deg)'; // 停放回唱臂架
                }
            }

            // 官方歌词流处理
            if (lyricMode === 'official' && hasOfficialLyrics && lyrics && lyrics.length > 0) {
                let targetIndex = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    if (currentPos >= lyrics[i].time) {
                        targetIndex = i;
                    } else {
                        break;
                    }
                }

                // 严格单调防抖迟滞锁：
                // 严禁因手机蓝牙 AVRCP 传输延时微弱抖动导致 targetIndex 往回掉引发的歌词上下颠簸。
                // 仅当用户手动拖动倒退超过 3 秒时才允许回退。
                if (activeLyricIndex >= 0 && targetIndex < activeLyricIndex) {
                    const activeTime = lyrics[activeLyricIndex] ? lyrics[activeLyricIndex].time : 0;
                    if (currentPos > (activeTime - 3000)) {
                        targetIndex = activeLyricIndex;
                    }
                }

                if (targetIndex !== activeLyricIndex && targetIndex >= 0) {
                    activeLyricIndex = targetIndex;
                    const lines = document.querySelectorAll('.lyric-line');
                    for (let idx = 0; idx < lines.length; idx++) {
                        const el = lines[idx];
                        const dist = Math.abs(idx - targetIndex);
                        el.className = 'lyric-line';
                        if (dist === 0) {
                            el.classList.add('active');
                        } else if (dist <= 4) {
                            el.classList.add('near', `near-${dist}`);
                        } else {
                            el.classList.add('far');
                        }
                    }

                    const targetEl = document.getElementById(`line-${targetIndex}`);
                    if (targetEl) {
                        const stream = document.getElementById('lyricsStream');
                        // 固定行高，无任何布局重排抖动
                        const offset = targetEl.offsetTop;
                        stream.style.transform = `translateY(-${offset}px)`;
                    }
                }
            }

            requestAnimationFrame(updateTimeline);
        }
        requestAnimationFrame(updateTimeline);

        function triggerPlayPause() {
            if (window.AndroidApp) window.AndroidApp.togglePlayPause();
        }

        function triggerNext() {
            if (window.AndroidApp) window.AndroidApp.skipNext();
        }

        function triggerPrev() {
            if (window.AndroidApp) window.AndroidApp.skipPrevious();
        }

        function triggerExit(e) {
            if (e && e.preventDefault) e.preventDefault();
            if (e && e.stopPropagation) e.stopPropagation();
            if (window.AndroidApp) window.AndroidApp.exitToHome();
        }

        // ===== 10秒无操作自动优雅渐隐顶栏、底栏与返回指示条 =====
        let idleTimer = null;

        function resetIdleTimer() {
            if (document.body.classList.contains('idle')) {
                document.body.classList.remove('idle');
                if (window.AndroidApp && window.AndroidApp.onIdleStateChanged) {
                    window.AndroidApp.onIdleStateChanged(false);
                }
            }
            if (window.AndroidApp && window.AndroidApp.onUserInteraction) {
                window.AndroidApp.onUserInteraction();
            }

            clearTimeout(idleTimer);
            idleTimer = setTimeout(function() {
                const dropdown = document.getElementById('deviceDropdown');
                // 如果用户当前打开了详情浮层，暂不触发渐隐
                if (!dropdown || !dropdown.classList.contains('show')) {
                    document.body.classList.add('idle');
                    if (window.AndroidApp && window.AndroidApp.onIdleStateChanged) {
                        window.AndroidApp.onIdleStateChanged(true);
                    }
                } else {
                    resetIdleTimer();
                }
            }, 10000);
        }

        ['pointerdown', 'touchstart', 'mousemove', 'click', 'keydown'].forEach(function(evt) {
            document.addEventListener(evt, resetIdleTimer, { passive: true });
        });
        resetIdleTimer();

        // ===== 右侧屏幕滑动调节系统音量交互识别 =====
        // 映射规则：从屏幕正中间往上滑到顶（约半屏高度 400px）增加 25% 音量
        let touchStartY = 0;
        let touchStartX = 0;
        let touchStartVolume = 50;
        let isVolumeSwiping = false;
        let volumeHideTimeout = null;

        function updateVolumeUI(pct) {
            const fill = document.getElementById('volumeFill');
            const text = document.getElementById('volumeText');
            const icon = document.getElementById('volumeIcon');
            const hud = document.getElementById('volumeHud');
            if (fill) fill.style.height = pct + '%';
            if (text) text.textContent = pct + '%';
            if (icon) {
                if (pct === 0) {
                    icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
                } else if (pct <= 40) {
                    icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 9v6h4l5 5V4L11 9H7z"/></svg>';
                } else {
                    icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
                }
            }
            if (hud) hud.classList.add('show');
        }

        document.addEventListener('touchstart', function(e) {
            resetIdleTimer();
            if (e.touches && e.touches.length === 1) {
                const t = e.touches[0];
                // 仅识别右侧屏幕（大于屏幕 44% 宽度，即右侧面板视口区）
                if (t.clientX > window.innerWidth * 0.44) {
                    touchStartX = t.clientX;
                    touchStartY = t.clientY;
                    touchStartVolume = window.AndroidApp && window.AndroidApp.getVolume ? window.AndroidApp.getVolume() : 50;
                    isVolumeSwiping = false;
                }
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            resetIdleTimer();
            if (e.touches && e.touches.length === 1 && touchStartX > window.innerWidth * 0.44) {
                const t = e.touches[0];
                const deltaY = touchStartY - t.clientY; // 往上滑动为正
                const deltaX = Math.abs(t.clientX - touchStartX);

                // 纵向滑动意图识别，过滤微小抖动
                if (Math.abs(deltaY) > 8 && Math.abs(deltaY) > deltaX) {
                    isVolumeSwiping = true;
                    if (e.cancelable) e.preventDefault();

                    // 映射：从正中间往上滑到顶（约半屏高度 400px）增加 25% 音量
                    const halfHeight = window.innerHeight * 0.5 || 400;
                    const deltaPct = (deltaY / halfHeight) * 25.0;
                    const targetPct = Math.max(0, Math.min(100, Math.round(touchStartVolume + deltaPct)));

                    if (window.AndroidApp && window.AndroidApp.setVolumePercent) {
                        window.AndroidApp.setVolumePercent(targetPct);
                    }
                    updateVolumeUI(targetPct);

                    clearTimeout(volumeHideTimeout);
                }
            }
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
            resetIdleTimer();
            if (isVolumeSwiping) {
                isVolumeSwiping = false;
                clearTimeout(volumeHideTimeout);
                volumeHideTimeout = setTimeout(function() {
                    const hud = document.getElementById('volumeHud');
                    if (hud) hud.classList.remove('show');
                }, 1200);
            }
            touchStartX = 0;
        }, { passive: true });
    </script>
</body>
