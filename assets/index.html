<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>蓝牙音乐看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-overflow-scrolling: auto !important;
        }

        /* 彻底消除任何系统滚动条 */
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            background: transparent !important;
        }
        ::-webkit-scrollbar-thumb {
            display: none !important;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0b0d10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            overflow: hidden !important;
            overscroll-behavior: none !important;
            touch-action: none !important;
        }

        /* 动态全屏氛围背景约束容器 */
        .ambient-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-bg {
            position: absolute;
            top: -15%;
            left: -15%;
            width: 130%;
            height: 130%;
            background-size: cover;
            background-position: center;
            filter: blur(85px) brightness(0.26) saturate(1.8);
            transform: scale(1.05);
            transition: background-image 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .ambient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 50%, rgba(15, 18, 24, 0.15) 0%, rgba(11, 13, 16, 0.72) 100%);
        }

        /* 全屏容器：网格式纵向布局 */
        .container {
            position: relative;
            z-index: 2;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 18px 36px 16px 36px;
            box-sizing: border-box;
        }

        /* 顶部全宽栏：左上角设备电量胶囊，右上角退出按钮 */
        .top-bar {
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 60;
            flex-shrink: 0;
        }

        /* 设备电量胶囊与浮层容器 */
        .device-card-wrapper {
            position: relative;
            display: inline-block;
        }

        .device-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 36px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(16px);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .device-pill:active, .device-pill.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: scale(0.97);
        }

        .device-pill * {
            pointer-events: none;
        }

        .device-bt-icon {
            width: 13px;
            height: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            fill: #00d2ff;
            flex-shrink: 0;
        }

        .device-bt-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .battery-widget {
            display: flex;
            align-items: center;
            position: relative;
        }

        .battery-shell {
            width: 22px;
            height: 11px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 3px;
            padding: 1.5px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }

        .battery-level-bar {
            height: 100%;
            width: 100%;
            background: #1db954;
            border-radius: 1px;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .battery-tip {
            width: 2px;
            height: 5px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 0 1px 1px 0;
            margin-left: 1px;
        }

        .battery-pct-text {
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.85);
        }

        /* 展开的详情浮层卡片 */
        .device-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 280px;
            background: rgba(18, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 18px;
            padding: 16px 18px;
            box-sizing: border-box;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(28px);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px) scale(0.96);
            transition: opacity 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 200;
        }

        .device-dropdown.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .device-dropdown-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 12px;
        }

        .device-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .device-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1db954;
            box-shadow: 0 0 8px #1db954;
            flex-shrink: 0;
        }

        .device-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-status-badge {
            font-size: 11px;
            color: #1db954;
            background: rgba(29, 185, 84, 0.12);
            border: 1px solid rgba(29, 185, 84, 0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .device-dropdown-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .spec-label {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .spec-val-text {
            color: rgba(255, 255, 255, 0.88);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: monospace, -apple-system, sans-serif;
        }

        /* 顶部右侧：简约叉叉图标按钮（支持长按3秒充能进度环，视觉中心精准居中） */
        .btn-close {
            position: relative;
            width: 36px;
            height: 36px;
            box-sizing: border-box;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            padding: 0;
            margin: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .close-ring-svg {
            position: absolute;
            top: -1px;
            left: -1px;
            width: 36px;
            height: 36px;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .close-ring-bg {
            fill: none;
            stroke: transparent;
            stroke-width: 2.2;
        }

        .close-ring-bar {
            fill: none;
            stroke: #ff4b2b;
            stroke-width: 2.2;
            stroke-dasharray: 107;
            stroke-dashoffset: 107;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.15s ease-out;
        }

        .btn-close.pressing .close-ring-bar {
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 3s linear;
        }

        .close-x-icon {
            width: 18px;
            height: 18px;
            display: block;
            margin: auto;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            pointer-events: none;
        }

        .btn-close:active {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            transform: scale(0.92);
        }

        /* 中部主体双栏区 */
        .main-body {
            flex: 1;
            width: 100%;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* 左侧面板：黑胶唱机与播控一体化高阶设计 */
        .left-panel {
            width: 44%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-right: 36px;
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            gap: 20px;
        }

        .turntable-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .vinyl-record {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background:
                radial-gradient(circle, transparent 36%, rgba(255, 255, 255, 0.04) 37%, transparent 38%),
                radial-gradient(circle, transparent 48%, rgba(255, 255, 255, 0.035) 49%, transparent 50%),
                radial-gradient(circle, transparent 62%, rgba(255, 255, 255, 0.04) 63%, transparent 64%),
                radial-gradient(circle, transparent 76%, rgba(255, 255, 255, 0.035) 77%, transparent 78%),
                radial-gradient(circle, #0e1013 0%, #17191d 30%, #0d0f12 50%, #1a1d22 70%, #08090a 100%);
            box-shadow:
                0 22px 55px rgba(0, 0, 0, 0.75),
                inset 0 0 0 2px rgba(255, 255, 255, 0.08),
                inset 0 0 16px rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: spinVinyl 24s linear infinite;
            animation-play-state: paused;
            transition: box-shadow 0.6s ease;
        }

        .vinyl-record.playing {
            animation-play-state: running;
            box-shadow:
                0 26px 60px rgba(0, 0, 0, 0.82),
                0 0 30px rgba(255, 255, 255, 0.12),
                inset 0 0 0 2px rgba(255, 255, 255, 0.12);
        }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-cover {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow:
                0 0 0 4px #0d0f12,
                0 0 0 5px rgba(255, 255, 255, 0.16),
                inset 0 0 16px rgba(0, 0, 0, 0.7);
            background: #14161b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl-cover-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 2;
        }

        .vinyl-cover-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .vinyl-center-dot {
            display: none;
        }

        .tonearm-base {
            position: absolute;
            top: -12px;
            right: -8px;
            width: 110px;
            height: 205px;
            z-index: 9;
            pointer-events: none;
        }

        /* 真实黑胶唱臂：精工金属材质、高保真倒角与唱头，根据播放进度实时计算旋转角度 */
        .tonearm {
            position: absolute;
            top: -12px;
            right: -8px;
            width: 110px;
            height: 205px;
            transform-origin: 52px 34px;
            transform: rotate(-32deg);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 10;
            filter: drop-shadow(2px 6px 14px rgba(0,0,0,0.65));
            will-change: transform;
            pointer-events: none;
        }

        .tonearm svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 紧凑而富有质感的控制底座 */
        .player-deck {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 16px 20px 15px 20px;
            box-sizing: border-box;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .meta-container {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        .song-title {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.36;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }

        .song-artist {
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.68);
            margin-top: 5px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }

        .progress-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .time-label {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            letter-spacing: 0.5px;
            min-width: 36px;
            text-align: center;
        }

        .progress-bar-bg {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
            position: relative;
            overflow: visible;
        }

        .progress-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            border-radius: 3px;
            transition: width 0.3s linear;
        }

        .progress-bar-thumb {
            position: absolute;
            right: -4px;
            top: -2.5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 75, 43, 0.9);
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .btn-ctrl {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-ctrl:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.22);
        }

        .btn-ctrl svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            pointer-events: none;
        }

        .btn-main {
            width: 52px;
            height: 52px;
            background: #ffffff;
            border: none;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.28);
        }

        .btn-main:active {
            transform: scale(0.92);
            background: #e6e6e6;
            box-shadow: 0 3px 12px rgba(255, 255, 255, 0.2);
        }

        .btn-main svg {
            width: 24px;
            height: 24px;
            fill: #0b0d10;
        }

        /* 右侧面板：歌词大视口 */
        .right-panel {
            width: 56%;
            height: 100%;
            padding-left: 36px;
            display: flex;
            flex-direction: column;
            position: relative;
            min-height: 0;
        }

        .lyrics-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            /* 纯净透明视口，绝无任何黑色遮罩与 GPU 闪烁 */
        }

        .lyrics-stream {
            position: absolute;
            width: 100%;
            top: 40%;
            /* 采用苹果级临界阻尼缓动曲线，丝滑推进，绝不回弹抖动 */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            text-align: left;
            will-change: transform;
        }

        /* 
           歌词固定行高设计：彻底杜绝动态字体尺寸变化引起的 DOM 布局重排（Reflow）颠簸抖动！
           高亮放大完全通过 GPU transform: scale 渲染，物理 offsetTop 永恒恒定！
        */
        .lyric-line {
            height: 50px;
            line-height: 50px;
            font-size: 21px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0.15;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), color 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: left center;
            white-space: nowrap;
            overflow: visible;
        }

        /* 当前激活歌词：高亮、实心白、无模糊杂边、彻底去除发散光晕 */
        .lyric-line.active {
            font-weight: 700;
            color: #ffffff;
            opacity: 1;
            transform: scale(1.28);
            text-shadow: none !important;
        }

        .lyric-line.near-1 {
            color: rgba(255, 255, 255, 0.85);
            opacity: 0.75;
            transform: scale(1.04);
        }

        .lyric-line.near-2 {
            color: rgba(255, 255, 255, 0.65);
            opacity: 0.45;
            transform: scale(1.0);
        }

        .lyric-line.near-3 {
            color: rgba(255, 255, 255, 0.45);
            opacity: 0.22;
            transform: scale(0.98);
        }

        .lyric-line.near-4 {
            color: rgba(255, 255, 255, 0.30);
            opacity: 0.08;
            transform: scale(0.96);
        }

        .lyric-line.far {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.94);
        }

        /* 蓝牙实时单行车载歌词视口：纯净大字无晕光 */
        .live-stream-box {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
            padding-bottom: 20px;
            text-align: center;
            padding-left: 20px;
            padding-right: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .live-stream-lyric {
            font-size: 38px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.5;
            letter-spacing: 0.6px;
            text-shadow: none !important;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 92%;
            word-break: break-word;
        }

        .empty-lyrics {
            width: 100%;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            gap: 16px;
        }

        .equalizer-wave {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            height: 36px;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, #ff416c, #ff4b2b);
            border-radius: 2px;
            animation: waveBounce 1.2s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 16px; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 28px; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 36px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 22px; animation-delay: 0.4s; }
        .wave-bar:nth-child(5) { height: 14px; animation-delay: 0.15s; }

        @keyframes waveBounce {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1); }
        }

        /* 底部全宽栏：左下角音频硬件规格，右下角歌词源切换 */
        .bottom-bar {
            width: 100%;
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 50;
            flex-shrink: 0;
            padding-top: 4px;
        }

        /* 全屏左下角：发烧级音频参数卡片（与四个角落及音量组件统一 36px 规格） */
        .audio-spec-card {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 36px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.3px;
            font-variant-numeric: tabular-nums;
        }

        .spec-param {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
        }

        .spec-slash, .spec-bullet {
            color: rgba(255, 255, 255, 0.35);
        }

        /* 全屏右下角：歌词源切换胶囊（与四个角落及音量组件统一 36px 规格） */
        .source-tag {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 36px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            letter-spacing: 0.3px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(16px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .source-tag * {
            pointer-events: none;
        }

        .source-tag:active {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(0.96);
        }

        .source-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #1db954;
            display: inline-block;
            transition: background-color 0.3s;
        }

        .source-switch-icon {
            font-size: 12px;
            opacity: 0.6;
            margin-left: 2px;
        }

        /* 6秒无操作后自动优雅渐隐四个角落的控件与音量条 */
        .top-bar, .bottom-bar {
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            opacity: 1;
        }

        body.idle .top-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
        }

        body.idle .bottom-bar {
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
        }

        /* 常驻垂直音量控制组件：极简磨砂质感，与右上角关闭按钮宽度相等（36px）、右边距严格对齐（36px），加减号位于圆弧圆心 */
        .volume-widget {
            position: fixed;
            right: 36px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            padding: 0;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 60;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body.idle .volume-widget {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) scale(0.96);
        }

        /* 手机端按键调整音量时：仅淡入音量条，四个角的控件保持隐藏 */
        body.idle .volume-widget.force-show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(-50%) scale(1);
        }

        .vol-btn {
            width: 36px;
            height: 36px;
            box-sizing: border-box;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            padding: 0;
            margin: 0;
            border-radius: 50%;
            transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .vol-btn:active {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            transform: scale(0.9);
        }

        .vol-btn svg {
            width: 18px;
            height: 18px;
            display: block;
            margin: auto;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            pointer-events: none;
        }

        .vol-track-container {
            width: 100%;
            padding: 2px 0 3px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 禁止按到音量条直接跳跃调节 */
        }

        .vol-track {
            width: 4px;
            height: 96px;
            background: rgba(255, 255, 255, 0.16);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            pointer-events: none;
        }

        .vol-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, #00d2ff, #0072ff);
            border-radius: 2px;
            transition: height 0.12s ease-out;
            pointer-events: none;
        }

        .vol-pct-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.2px;
            text-align: center;
            width: 100%;
            padding: 2px 0 2px 0;
            line-height: 1;
            user-select: none;
            pointer-events: none;
        }

        /* 优雅提示小弹窗 */
        .toast-tip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(18, 22, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            padding: 14px 24px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast-tip.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>

                        <button class="btn-ctrl" onclick="triggerNext()" title="下一首">
                            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧面板：透明渐隐滚动歌词 -->
            <div class="right-panel">
                <div class="lyrics-viewport" id="lyricsViewport">
                    <div class="lyrics-stream" id="lyricsStream">
                        <div class="empty-lyrics" id="emptyLyrics">
                            <div class="equalizer-wave">
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                            </div>
                            <div id="emptyText">正在检索官方歌词与封面...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部全宽栏：左下角音频硬件规格，右下角歌词源切换 -->
        <div class="bottom-bar">
            <div class="audio-spec-card">
                <span class="spec-param" id="specCodec">AAC</span>
                <span class="spec-slash">/</span>
                <span class="spec-param" id="specRate">48 kHz</span>
                <span class="spec-slash">/</span>
                <span class="spec-param" id="specBits">24-Bit</span>
                <span class="spec-bullet">·</span>
                <span class="spec-param" id="specChannels">双声道立体声</span>
            </div>

            <button class="source-tag" id="statusTag" onclick="toggleLyricSource(event)" title="点击切换歌词源">
                <span class="source-dot" id="sourceDot"></span>
                <span id="statusTagText">正在匹配歌词...</span>
                <span class="source-switch-icon">⇄</span>
            </button>
        </div>
    </div>

    <!-- 常驻垂直音量控制组件：左右严格对齐右上角关闭按键、宽度相等（36px） -->
    <div class="volume-widget" id="volumeWidget">
        <button class="vol-btn vol-btn-plus" id="volBtnPlus" onclick="handleVolumeStep(1, event)" title="音量增加 (+1%)" aria-label="增加音量">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <div class="vol-track-container" id="volTrackContainer">
            <div class="vol-track">
                <div class="vol-fill" id="volFill" style="height: 50%;"></div>
            </div>
        </div>
        <span class="vol-pct-text" id="volPctText">50%</span>
        <button class="vol-btn vol-btn-minus" id="volBtnMinus" onclick="handleVolumeStep(-1, event)" title="音量减小 (-1%)" aria-label="减小音量">
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>

    <!-- 优雅提示轻弹层 -->
    <div class="toast-tip" id="toastTip">正在重启应用...</div>

    <script>
        // 彻底禁止屏幕拖动引起的 WebView 滚动
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        let currentTrack = { title: "", artist: "", album: "", duration: 0, streamLyric: "" };
        let isPlaying = false;
        let lastPositionMs = 0;
        let lastSyncTime = performance.now();
        let lyrics = [];
        let parsedOfficialLyrics = [];
        let hasOfficialLyrics = false;
        let activeLyricIndex = -1;
        let currentCoverUrl = "";
        let lyricMode = 'official'; // 'official' | 'bluetooth'
        let userExplicitMode = null; // 用户手动切换锁定模式

        // 歌曲元数据与歌词内存缓存表（避免返回桌面重新点击时重复请求与闪白）
        const songCache = {};

        function toggleDeviceInfo(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const dropdown = document.getElementById('deviceDropdown');
            const pill = document.getElementById('devicePill');
            if (dropdown) {
                const isOpen = dropdown.classList.toggle('show');
                if (pill) {
                    if (isOpen) pill.classList.add('active');
                    else pill.classList.remove('active');
                }
            }
        }

        // 点击或触摸外部区域自动关闭设备详情浮层
        function handleOutsideDismiss(e) {
            const wrapper = document.getElementById('deviceCardWrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                const dropdown = document.getElementById('deviceDropdown');
                const pill = document.getElementById('devicePill');
                if (dropdown && dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                    if (pill) pill.classList.remove('active');
                }
            }
        }
        document.addEventListener('pointerdown', handleOutsideDismiss);
        document.addEventListener('touchstart', handleOutsideDismiss, { passive: true });
        document.addEventListener('click', handleOutsideDismiss);

        // 接收来自 Java 原生层的蓝牙设备状态与音频协议数据
        window.onBluetoothStatusChanged = function(data) {
            console.log("Bluetooth status:", data);
            if (!data) return;

            const text = document.getElementById('batteryPctText');
            const dropBat = document.getElementById('dropdownDeviceBat');
            const widget = document.getElementById('batteryWidget');

            if (data.batteryLevel !== undefined && data.batteryLevel >= 0) {
                const pct = Math.min(100, Math.max(0, data.batteryLevel));
                const bar = document.getElementById('batteryLevelBar');
                if (widget) widget.style.display = 'flex';
                if (bar) {
                    bar.style.width = pct + '%';
                    if (pct <= 20) {
                        bar.style.background = '#ff4b2b';
                    } else if (pct <= 40) {
                        bar.style.background = '#f5a623';
                    } else {
                        bar.style.background = '#1db954';
                    }
                }
                if (text) text.textContent = pct + '%';
                if (dropBat) dropBat.textContent = pct + '%';
            } else {
                // 手机未通过 A2DP 回传电量（标准蓝牙车载协议限制）：不显示伪造电量，显示真实连接态
                if (widget) widget.style.display = 'none';
                if (text) text.textContent = '已连接';
                if (dropBat) dropBat.textContent = '手机未回传 (A2DP协议限制)';
            }

            if (data.deviceName) {
                const nameEl = document.getElementById('dropdownDeviceName');
                if (nameEl) nameEl.textContent = data.deviceName;
            }
            if (data.deviceAddress) {
                const macEl = document.getElementById('dropdownDeviceMac');
                if (macEl) macEl.textContent = data.deviceAddress;
            }

            // 更新左下角音频规格
            if (data.codec) {
                const el = document.getElementById('specCodec');
                if (el) el.textContent = data.codec;
            }
            if (data.sampleRate) {
                const el = document.getElementById('specRate');
                if (el) el.textContent = data.sampleRate;
            }
            if (data.bitDepth) {
                const el = document.getElementById('specBits');
                if (el) el.textContent = data.bitDepth;
            }
            if (data.channels) {
                const el = document.getElementById('specChannels');
                if (el) el.textContent = data.channels;
            }
        };

        function updateStatusTag(text, dotColor) {
            const tagText = document.getElementById('statusTagText');
            const dot = document.getElementById('sourceDot');
            if (tagText) tagText.textContent = text;
            if (dot && dotColor) dot.style.backgroundColor = dotColor;
        }

        function setCoverImage(url) {
            currentCoverUrl = url || "";
            const img = document.getElementById('vinylCoverImg');
            const bg = document.getElementById('ambientBg');
            if (currentCoverUrl) {
                img.onload = () => { img.style.opacity = '1'; };
                img.onerror = () => { img.style.opacity = '0'; };
                img.src = currentCoverUrl;
                bg.style.backgroundImage = `url('${currentCoverUrl}')`;
            } else {
                img.style.opacity = '0';
                bg.style.backgroundImage = 'none';
            }
        }

        function formatTime(ms) {
            if (!ms || ms < 0 || isNaN(ms)) return "00:00";
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function parseLRC(lrcText) {
            if (!lrcText) return [];
            const lines = lrcText.split('\n');
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;

            for (const line of lines) {
                const matches = [...line.matchAll(timeReg)];
                const text = line.replace(timeReg, '').trim();
                if (!text) continue;

                for (const match of matches) {
                    const m = parseInt(match[1]);
                    const s = parseInt(match[2]);
                    const ms = parseInt(match[3].padEnd(3, '0').slice(0, 3));
                    const totalTime = m * 60000 + s * 1000 + ms;
                    result.push({ time: totalTime, text: text });
                }
            }
            result.sort((a, b) => a.time - b.time);
            return result;
        }

        function renderLyrics(lrcArray) {
            lyrics = lrcArray;
            const stream = document.getElementById('lyricsStream');
            stream.innerHTML = '';
            activeLyricIndex = -1;

            if (!lyrics || lyrics.length === 0) {
                hasOfficialLyrics = false;
                if (currentTrack.streamLyric) {
                    showStreamLyric(currentTrack.streamLyric);
                } else {
                    stream.style.transform = 'translateY(0)';
                    stream.innerHTML = `
                        <div class="empty-lyrics">
                            <div class="equalizer-wave">
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                            </div>
                            <div style="font-size: 26px; font-weight: 600; color: rgba(255, 255, 255, 0.88); letter-spacing: 1px;">纯音乐，请欣赏</div>
                        </div>`;
                    updateStatusTag('纯音乐', '#888888');
                }
                return;
            }

            hasOfficialLyrics = true;
            lyrics.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line' + (index === 0 ? ' active' : (index <= 4 ? ` near near-${index}` : ' far'));
                div.id = `line-${index}`;
                div.textContent = item.text;
                stream.appendChild(div);
            });
        }

        function showStreamLyric(text) {
            const stream = document.getElementById('lyricsStream');
            stream.style.transform = 'translateY(-24px)';
            stream.innerHTML = `
                <div class="live-stream-box">
                    <div class="live-stream-lyric">${text}</div>
                </div>`;
            updateStatusTag('蓝牙实时歌词', '#4a90e2');
        }

        function getLyricSourceLabel(source) {
            if (!source) return '官方歌词';
            if (source.includes('歌词')) return source;
            return source + '歌词';
        }

        function toggleLyricSource(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const trackKey = (currentTrack.title + " - " + currentTrack.artist).toLowerCase().trim();
            const cached = songCache[trackKey];

            if (lyricMode === 'official') {
                lyricMode = 'bluetooth';
                userExplicitMode = 'bluetooth';
                const streamText = currentTrack.streamLyric || (cached && cached.streamLyric) || "当前蓝牙源暂未投送歌词";
                showStreamLyric(streamText);
                updateStatusTag('蓝牙歌词', '#4a90e2');
            } else {
                lyricMode = 'official';
                userExplicitMode = 'official';
                const srcName = (cached && cached.lyricSource) || currentTrack.lyricSource || '官方';
                const label = getLyricSourceLabel(srcName);
                if (hasOfficialLyrics && parsedOfficialLyrics.length > 0) {
                    renderLyrics(parsedOfficialLyrics);
                    updateStatusTag(label, '#1db954');
                } else if (cached && cached.parsedLyrics && cached.parsedLyrics.length > 0) {
                    parsedOfficialLyrics = cached.parsedLyrics;
                    hasOfficialLyrics = true;
                    renderLyrics(parsedOfficialLyrics);
                    updateStatusTag(label, '#1db954');
                } else {
                    renderLyrics([]);
                    updateStatusTag('纯音乐 / 暂无歌词', '#888888');
                }
            }
        }

        // 接收来自 Java 原生多源高速检索的网络封面与官方歌词 (iTunes, Kugou, LRCLIB)
        window.onOnlineResult = function(data) {
            if (!data) return;
            const trackKey = (currentTrack.title + " - " + currentTrack.artist).toLowerCase().trim();
            if (!songCache[trackKey]) songCache[trackKey] = {};

            if (data.coverUrl) {
                songCache[trackKey].coverUrl = data.coverUrl;
                setCoverImage(data.coverUrl);
            }
            if (data.lyricSource) {
                songCache[trackKey].lyricSource = data.lyricSource;
                currentTrack.lyricSource = data.lyricSource;
            }
            if (data.lyrics) {
                songCache[trackKey].rawLrc = data.lyrics;
                const parsed = parseLRC(data.lyrics);
                if (parsed.length > 0) {
                    songCache[trackKey].parsedLyrics = parsed;
                    parsedOfficialLyrics = parsed;
                    hasOfficialLyrics = true;
                    if (userExplicitMode !== 'bluetooth') {
                        lyricMode = 'official';
                        renderLyrics(parsed);
                        const label = getLyricSourceLabel(data.lyricSource || songCache[trackKey].lyricSource);
                        updateStatusTag(label, '#1db954');
                    }
                    return;
                }
            }

            if (lyricMode === 'bluetooth' && currentTrack.streamLyric) {
                showStreamLyric(currentTrack.streamLyric);
            } else if (!hasOfficialLyrics) {
                renderLyrics([]);
                updateStatusTag(currentTrack.streamLyric ? '蓝牙歌词' : '纯音乐 / 暂无歌词', '#888888');
            }
        };

        window.onMetadataChanged = function(data) {
            if (!data || !data.title) return;

            const title = data.title;
            const artist = data.artist || "未知歌手";
            const album = data.album || "";
            const streamLyric = data.streamLyric || "";

            const isNewSong = (currentTrack.title !== title || currentTrack.artist !== artist);
            currentTrack = data;

            document.getElementById('songTitle').textContent = title;
            const formattedArtist = (artist || "未知歌手").replace(/\s*\/\s*/g, ' / ');
            let artistAlbumText = formattedArtist;
            if (album && !title.toLowerCase().includes(album.toLowerCase()) && !album.toLowerCase().includes(title.toLowerCase())) {
                artistAlbumText = `${formattedArtist} · ${album}`;
            }
            document.getElementById('songArtist').textContent = artistAlbumText;
            document.getElementById('timeTotal').textContent = formatTime(data.duration);

            const trackKey = (title + " - " + artist).toLowerCase().trim();
            if (!songCache[trackKey]) songCache[trackKey] = {};
            if (streamLyric) songCache[trackKey].streamLyric = streamLyric;

            if (isNewSong) {
                hasOfficialLyrics = false;
                parsedOfficialLyrics = [];
                activeLyricIndex = -1;
                userExplicitMode = null;

                // 优先从内存缓存中秒开封面和歌词
                const cached = songCache[trackKey];
                if (cached && (cached.coverUrl || cached.parsedLyrics)) {
                    if (cached.coverUrl) {
                        setCoverImage(cached.coverUrl);
                    }
                    if (cached.parsedLyrics && cached.parsedLyrics.length > 0) {
                        parsedOfficialLyrics = cached.parsedLyrics;
                        hasOfficialLyrics = true;
                        lyricMode = 'official';
                        if (cached.lyricSource) currentTrack.lyricSource = cached.lyricSource;
                        renderLyrics(parsedOfficialLyrics);
                        const label = getLyricSourceLabel(cached.lyricSource);
                        updateStatusTag(label, '#1db954');
                    }
                } else {
                    updateStatusTag('正在匹配歌词与封面...', '#f5a623');
                }
            }

            if (streamLyric) {
                if (userExplicitMode === 'bluetooth' || (!userExplicitMode && !hasOfficialLyrics)) {
                    showStreamLyric(streamLyric);
                }
            }
        };

        window.onPlaybackStateChanged = function(data) {
            if (!data) return;
            isPlaying = !!data.isPlaying;
            lastPositionMs = data.position || 0;
            lastSyncTime = performance.now();

            const vinyl = document.getElementById('vinylRecord');
            const playIcon = document.getElementById('playIcon');

            if (isPlaying) {
                vinyl.classList.add('playing');
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                vinyl.classList.remove('playing');
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        };

        function updateTimeline() {
            let currentPos = lastPositionMs;
            if (isPlaying) {
                const delta = performance.now() - lastSyncTime;
                currentPos += delta;
            }

            // 更新播放进度条
            if (currentTrack.duration > 0) {
                const pct = Math.min(100, Math.max(0, (currentPos / currentTrack.duration) * 100));
                document.getElementById('progressBar').style.width = pct + '%';
                document.getElementById('timeCurrent').textContent = formatTime(currentPos);
            }

            // 真实唱机唱针物理轨迹：根据当前播放进度从黑胶外圈(-26°)平滑走向内圈(-6°)
            const tonearm = document.getElementById('tonearm');
            if (tonearm) {
                if (isPlaying) {
                    let progressRatio = 0;
                    if (currentTrack.duration > 0) {
                        progressRatio = Math.min(1.0, Math.max(0.0, currentPos / currentTrack.duration));
                    }
                    const tonearmAngle = -26 + progressRatio * 20; // 0% 时在 -26° (外圈)，100% 时在 -6° (内圈外缘)
                    tonearm.style.transform = `rotate(${tonearmAngle.toFixed(2)}deg)`;
                } else {
                    tonearm.style.transform = 'rotate(-32deg)'; // 停放回唱臂架
                }
            }

            // 官方歌词流处理
            if (lyricMode === 'official' && hasOfficialLyrics && lyrics && lyrics.length > 0) {
                let targetIndex = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    if (currentPos >= lyrics[i].time) {
                        targetIndex = i;
                    } else {
                        break;
                    }
                }

                // 严格单调防抖迟滞锁：
                // 严禁因手机蓝牙 AVRCP 传输延时微弱抖动导致 targetIndex 往回掉引发的歌词上下颠簸。
                // 仅当用户手动拖动倒退超过 3 秒时才允许回退。
                if (activeLyricIndex >= 0 && targetIndex < activeLyricIndex) {
                    const activeTime = lyrics[activeLyricIndex] ? lyrics[activeLyricIndex].time : 0;
                    if (currentPos > (activeTime - 3000)) {
                        targetIndex = activeLyricIndex;
                    }
                }

                if (targetIndex !== activeLyricIndex && targetIndex >= 0) {
                    activeLyricIndex = targetIndex;
                    const lines = document.querySelectorAll('.lyric-line');
                    for (let idx = 0; idx < lines.length; idx++) {
                        const el = lines[idx];
                        const dist = Math.abs(idx - targetIndex);
                        el.className = 'lyric-line';
                        if (dist === 0) {
                            el.classList.add('active');
                        } else if (dist <= 4) {
                            el.classList.add('near', `near-${dist}`);
                        } else {
                            el.classList.add('far');
                        }
                    }

                    const targetEl = document.getElementById(`line-${targetIndex}`);
                    if (targetEl) {
                        const stream = document.getElementById('lyricsStream');
                        // 固定行高，无任何布局重排抖动
                        const offset = targetEl.offsetTop;
                        stream.style.transform = `translateY(-${offset}px)`;
                    }
                }
            }

            requestAnimationFrame(updateTimeline);
        }
        requestAnimationFrame(updateTimeline);

        function triggerPlayPause() {
            if (window.AndroidApp) window.AndroidApp.togglePlayPause();
        }

        function triggerNext() {
            if (window.AndroidApp) window.AndroidApp.skipNext();
        }

        function triggerPrev() {
            if (window.AndroidApp) window.AndroidApp.skipPrevious();
        }

        function triggerExit(e) {
            if (e && e.preventDefault) e.preventDefault();
            if (e && e.stopPropagation) e.stopPropagation();
            if (window.AndroidApp) window.AndroidApp.exitToHome();
        }

        // ===== 右上角返回桌面叉叉：短按返回桌面，长按3秒重启App =====
        let closePressTimer = null;
        let closePressStartTime = 0;
        let isRestartTriggered = false;
        const closeBtn = document.getElementById('closeBtn');

        function startClosePress(e) {
            if (e) {
                if (e.cancelable && e.type === 'touchstart') e.preventDefault();
                e.stopPropagation();
            }
            if (closePressTimer) return; // 避免 touch 与 pointer 重复触发
            isRestartTriggered = false;
            closePressStartTime = performance.now();
            if (closeBtn) closeBtn.classList.add('pressing');

            clearTimeout(closePressTimer);
            closePressTimer = setTimeout(function() {
                isRestartTriggered = true;
                if (closeBtn) closeBtn.classList.remove('pressing');
                const toast = document.getElementById('toastTip');
                if (toast) toast.classList.add('show');
                if (window.AndroidApp && window.AndroidApp.restartApp) {
                    window.AndroidApp.restartApp();
                }
            }, 3000);
        }

        function cancelClosePress(e) {
            if (e) e.stopPropagation();
            if (!closePressTimer && closePressStartTime === 0) return;
            clearTimeout(closePressTimer);
            closePressTimer = null;
            if (closeBtn) closeBtn.classList.remove('pressing');

            if (isRestartTriggered) return;

            const elapsed = performance.now() - closePressStartTime;
            if (closePressStartTime > 0 && elapsed < 2500) {
                triggerExit(e);
            }
            closePressStartTime = 0;
        }

        if (closeBtn) {
            closeBtn.addEventListener('pointerdown', startClosePress);
            closeBtn.addEventListener('pointerup', cancelClosePress);
            closeBtn.addEventListener('pointercancel', cancelClosePress);
            closeBtn.addEventListener('pointerleave', cancelClosePress);
            closeBtn.addEventListener('touchstart', startClosePress, { passive: false });
            closeBtn.addEventListener('touchend', cancelClosePress);
            closeBtn.addEventListener('touchcancel', cancelClosePress);
            closeBtn.addEventListener('mousedown', startClosePress);
            closeBtn.addEventListener('mouseup', cancelClosePress);
        }

        // ===== 沉浸模式：6秒无操作自动渐隐，支持单击空白处手动切换 =====
        const IDLE_TIMEOUT_MS = 6000;
        let idleTimer = null;

        function setIdleState(isIdle) {
            if (isIdle) {
                const dropdown = document.getElementById('deviceDropdown');
                if (dropdown && dropdown.classList.contains('show')) return;
                document.body.classList.add('idle');
                clearTimeout(idleTimer);
                if (window.AndroidApp && window.AndroidApp.onIdleStateChanged) {
                    window.AndroidApp.onIdleStateChanged(true);
                }
            } else {
                document.body.classList.remove('idle');
                if (window.AndroidApp && window.AndroidApp.onIdleStateChanged) {
                    window.AndroidApp.onIdleStateChanged(false);
                }
                if (window.AndroidApp && window.AndroidApp.onUserInteraction) {
                    window.AndroidApp.onUserInteraction();
                }
                resetIdleTimer();
            }
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(function() {
                setIdleState(true);
            }, IDLE_TIMEOUT_MS);
        }

        // 单击屏幕手动激活淡出 / 唤醒
        let tapDownX = 0;
        let tapDownY = 0;
        let tapDownTime = 0;
        let isTapCandidate = false;
        let lastTapHandledTime = 0;

        function handleTapStart(x, y) {
            tapDownX = x;
            tapDownY = y;
            tapDownTime = performance.now();
            isTapCandidate = true;
        }

        function handleTapEnd(x, y, target) {
            const now = performance.now();
            if (now - lastTapHandledTime < 400) {
                return; // 过滤 pointerup 与 touchend 重复事件
            }
            lastTapHandledTime = now;

            const elapsed = now - tapDownTime;
            const dist = Math.hypot(x - tapDownX, y - tapDownY);
            const isInteractive = target && target.closest && !!target.closest('button, .btn-ctrl, .vol-btn, .volume-widget, .source-tag, .device-pill, .device-dropdown, #closeBtn');

            if (isTapCandidate && elapsed < 500 && dist < 20) {
                isTapCandidate = false;
                if (!isInteractive) {
                    // 点击空白处 / 歌词 / 唱片区域：手动切换淡出/唤醒
                    if (document.body.classList.contains('idle')) {
                        setIdleState(false);
                    } else {
                        setIdleState(true);
                    }
                    return;
                }
            }

            // 点击或交互了具体控件
            if (document.body.classList.contains('idle')) {
                setIdleState(false);
            } else {
                resetIdleTimer();
            }
        }

        document.addEventListener('pointerdown', function(e) {
            handleTapStart(e.clientX, e.clientY);
        }, { passive: true });

        document.addEventListener('pointermove', function(e) {
            if (isTapCandidate) {
                const dist = Math.hypot(e.clientX - tapDownX, e.clientY - tapDownY);
                if (dist > 20) {
                    isTapCandidate = false;
                    if (document.body.classList.contains('idle')) {
                        setIdleState(false);
                    } else {
                        resetIdleTimer();
                    }
                }
            }
        }, { passive: true });

        document.addEventListener('pointerup', function(e) {
            handleTapEnd(e.clientX, e.clientY, e.target);
        }, { passive: true });

        // Fallback for touch devices if PointerEvent doesn't fire
        document.addEventListener('touchstart', function(e) {
            if (e.touches && e.touches[0]) {
                handleTapStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            if (e.changedTouches && e.changedTouches[0]) {
                handleTapEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY, e.target);
            }
        }, { passive: true });

        resetIdleTimer();

        // ===== 常驻垂直音量控制组件交互与系统联动 =====
        let currentVolumePct = 50;
        let volForceTimeout = null;

        function updateVolumeDisplay(pct) {
            currentVolumePct = Math.max(0, Math.min(100, Math.round(pct)));
            const fill = document.getElementById('volFill');
            const text = document.getElementById('volPctText');
            if (fill) fill.style.height = currentVolumePct + '%';
            if (text) text.textContent = currentVolumePct + '%';
        }

        function handleVolumeStep(delta, e) {
            if (e) {
                if (e.preventDefault) e.preventDefault();
                if (e.stopPropagation) e.stopPropagation();
            }
            resetIdleTimer();
            if (window.AndroidApp && window.AndroidApp.changeVolumeBy) {
                const res = window.AndroidApp.changeVolumeBy(delta);
                updateVolumeDisplay(res);
            } else if (window.AndroidApp && window.AndroidApp.setVolumePercent) {
                const target = Math.max(0, Math.min(100, currentVolumePct + delta));
                const res = window.AndroidApp.setVolumePercent(target);
                updateVolumeDisplay(res);
            } else {
                updateVolumeDisplay(currentVolumePct + delta);
            }
        }

        // 手机端物理按键/蓝牙调整音量时的系统级事件同步：仅淡入音量条，四个角落的控件保持隐藏
        window.onSystemVolumeChanged = function(newPct) {
            updateVolumeDisplay(newPct);
            const widget = document.getElementById('volumeWidget');
            if (widget) {
                widget.classList.add('force-show');
                clearTimeout(volForceTimeout);
                volForceTimeout = setTimeout(function() {
                    widget.classList.remove('force-show');
                }, 3000);
            }
        };

        // 页面初始化时拉取当前系统音量
        if (window.AndroidApp && window.AndroidApp.getVolume) {
            try {
                updateVolumeDisplay(window.AndroidApp.getVolume());
            } catch (err) {}
        }
    </script>
</body>
</html>
