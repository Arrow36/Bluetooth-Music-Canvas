                stream.style.transition = 'opacity 0.35s ease-in, transform 0.85s cubic-bezier(0.22, 1, 0.36, 1)';
                stream.style.opacity = '1';
            }
        }

        function showStreamLyric(text) {
            if (currentActiveSource === 'auto' && isPureMusicLyric([{ text }])) {
                renderLyrics([]);
                return;
            }
            const stream = document.getElementById('lyricsStream');
            const emptyBox = document.getElementById('emptyLyrics');
            const largeViz = document.getElementById('largeVisualizer');
            if (largeViz) largeViz.style.display = 'none';
            if (emptyBox) emptyBox.style.display = 'none';
            syncSpectrumVisibility();
            if (stream) {
                stream.style.display = 'block';
                stream.style.opacity = '1';
                stream.style.transform = 'translateY(-24px)';
                stream.textContent = '';
                const box = document.createElement('div');
                box.className = 'live-stream-box';
                const lyric = document.createElement('div');
                lyric.className = 'live-stream-lyric';
                let cleanText = (text || '当前蓝牙源暂未投送歌词').trim();
                cleanText = cleanText.replace(/[\u2018\u2019\u0060\u00b4]/g, "'");
                cleanText = cleanText.replace(/\b([a-zA-Z]+)\s*'\s*([a-zA-Z]+)\b/g, "$1'$2");
                lyric.textContent = cleanText;
                box.appendChild(lyric);
                stream.appendChild(box);
            }
            updateStatusTag('蓝牙实时歌词', '#4a90e2');
        }

        // 歌词源代表色与信息字典（新增律动氛围选项）
        const SOURCE_META = {
            netease: { name: '网易云音乐', color: '#ff3a3a', label: '网易云音乐', id: 'netease' },
            qq: { name: 'QQ音乐', color: '#31c27c', label: 'QQ音乐', id: 'qq' },
            kugou: { name: '酷狗音乐', color: '#0084ff', label: '酷狗音乐', id: 'kugou' },
            lrclib: { name: 'LRCLIB 全球库', color: '#a855f7', label: 'LRCLIB', id: 'lrclib' },
            bluetooth: { name: '蓝牙实时歌词', color: '#38bdf8', label: '蓝牙实时歌词', id: 'bluetooth' },
            visualizer: { name: '律动氛围', color: '#00f2fe', label: '律动氛围', id: 'visualizer' },
            auto: { name: '自动推荐', color: '#f59e0b', label: '自动匹配', id: 'auto' }
        };

        // 记忆歌词源偏好：切歌时严格保持用户手动选择的来源，不自动回退
        let currentActiveSource = localStorage.getItem('preferred_lyric_source') || 'auto';
        let userExplicitMode = (currentActiveSource !== 'auto') ? currentActiveSource : null;

        function getSourceMeta(src) {
            if (!src) return SOURCE_META.auto;
            const s = src.toLowerCase();
            if (s.includes('网易') || s.includes('netease')) return SOURCE_META.netease;
            if (s.includes('qq') || s.includes('tencent')) return SOURCE_META.qq;
            if (s.includes('酷狗') || s.includes('kugou')) return SOURCE_META.kugou;
            if (s.includes('lrclib')) return SOURCE_META.lrclib;
            if (s.includes('律动') || s.includes('visualizer') || s.includes('氛围')) return SOURCE_META.visualizer;
            if (s.includes('蓝牙') || s.includes('bluetooth') || s.includes('stream')) return SOURCE_META.bluetooth;
            return { name: src, color: '#31c27c', label: src, id: 'auto' };
        }

        function getLyricSourceLabel(src) {
            const meta = getSourceMeta(src);
            return meta ? (meta.label || meta.name) : '官方歌词';
        }

        // 播放代次与请求序列号管理（根治切歌竞态、乱序到达与缓存污染）
        let currentPlaybackGeneration = 0;
        let lastSourceRequestId = {};
        let currentSongKey = '';

        function toggleLyricMenu(e) {
            if (e) {
                if (e.target && e.target.closest && e.target.closest('#lyricFontWidget, .lyric-font-widget, .font-btn, #btnFontDec, #btnFontInc, #fontSizeLabel')) {
                    return; // 点击字号控件区域绝不触发歌词源菜单的开闭切换
                }
                if (e.stopPropagation) e.stopPropagation();
            }
            const dropdown = document.getElementById('deviceDropdown');
            const pill = document.getElementById('devicePill');
            if (dropdown) dropdown.classList.remove('show');
            if (pill) pill.classList.remove('active');

            const menu = document.getElementById('lyricSourceMenu');
            if (!menu) return;
            const isOpen = menu.classList.toggle('show');
            document.body.classList.toggle('lyric-menu-open', isOpen);
            updateMenuCheckmarks();
            document.body.classList.remove('idle');
            resetIdleTimer();
        }

        function closeLyricMenu() {
            const menu = document.getElementById('lyricSourceMenu');
            if (menu) menu.classList.remove('show');
            document.body.classList.remove('lyric-menu-open');
            resetIdleTimer();
        }

        function updateMenuCheckmarks() {
            const keys = ['auto', 'netease', 'qq', 'kugou', 'lrclib', 'bluetooth', 'visualizer'];
            keys.forEach(k => {
                const item = document.getElementById('menuItem-' + k);
                if (item) {
                    if (k === currentActiveSource) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                }
            });
        }

        // 点击页面其它任意地方自动收起二级菜单
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('lyricSourceMenu');
            if (!menu || !menu.classList.contains('show')) return;
            const btn = document.getElementById('statusTag');
            const fontWidget = document.getElementById('lyricFontWidget');
            if (!menu.contains(e.target) && (!btn || !btn.contains(e.target)) && (!fontWidget || !fontWidget.contains(e.target))) {
                closeLyricMenu();
            }
        });

        // 获取大号律动频谱条
        let largeWaveBars = [];
        function getLargeWaveBars() {
            if (largeWaveBars.length === 0) {
                const container = document.getElementById('largeWave');
                if (container) {
                    largeWaveBars = Array.from(container.getElementsByClassName('large-bar'));
                }
            }
            return largeWaveBars;
        }

        function applyLyricSourceForCurrentTrack(sourceId, isUserTriggered) {
            const trackKey = currentSongKey || (currentTrack && currentTrack.trackKey) || ((currentTrack ? currentTrack.title : '') + '\t' + (currentTrack ? currentTrack.artist : '')).toLowerCase().trim();
            const cached = ensureSongCacheEntry(trackKey);

            const largeViz = document.getElementById('largeVisualizer');
            const stream = document.getElementById('lyricsStream');
            const emptyBox = document.getElementById('emptyLyrics');

            // 模式 1：律动氛围（大号频谱波形动画）
            if (sourceId === 'visualizer') {
                lyricMode = 'visualizer';
                userExplicitMode = 'visualizer';
                if (stream) stream.style.display = 'none';
                if (emptyBox) emptyBox.style.display = 'none';
                if (largeViz) largeViz.style.display = 'flex';
                updateStatusTag(SOURCE_META.visualizer.label, SOURCE_META.visualizer.color);
                syncSpectrumVisibility();
                return;
            }

            // 非律动氛围：隐藏大号频谱，恢复歌词视口
            if (largeViz) largeViz.style.display = 'none';
            if (stream) stream.style.display = 'block';
            syncSpectrumVisibility();

            // 模式 2：蓝牙实时歌词
            if (sourceId === 'bluetooth') {
                lyricMode = 'bluetooth';
                userExplicitMode = 'bluetooth';
                const streamText = currentTrack.streamLyric || (cached && cached.streamLyric) || "当前蓝牙源暂未投送歌词";
                showStreamLyric(streamText);
                updateStatusTag(SOURCE_META.bluetooth.label, SOURCE_META.bluetooth.color);
                return;
            }

            // 模式 3：自动推荐最佳匹配
            if (sourceId === 'auto') {
                userExplicitMode = null;
                if (cached.parsedLyrics && cached.parsedLyrics.length > 0) {
                    lyricMode = 'official';
                    currentRawLrcText = cached.rawLrc || '';
                    parsedOfficialLyrics = currentRawLrcText ? parseLRC(currentRawLrcText) : cached.parsedLyrics;
                    hasOfficialLyrics = true;
                    renderLyrics(parsedOfficialLyrics);
                    const meta = getSourceMeta(cached.lyricSource);
                    updateStatusTag(meta.label, meta.color);
                } else if (currentTrack.streamLyric) {
                    lyricMode = 'bluetooth';
                    showStreamLyric(currentTrack.streamLyric);
                    updateStatusTag(SOURCE_META.bluetooth.label, SOURCE_META.bluetooth.color);
                } else {
                    renderLyrics([]);
                    updateStatusTag('纯音乐 / 暂无歌词', '#888888');
                }
                return;
            }

            // 模式 4：用户手动指定外部歌词源 (netease / qq / kugou / lrclib)
            lyricMode = 'official';
            userExplicitMode = sourceId;
            const meta = SOURCE_META[sourceId] || SOURCE_META.auto;

            // 若当前歌曲已缓存过此源的歌词，立即呈现
            if (cached[sourceId + '_lyrics']) {
                currentRawLrcText = cached[sourceId + '_rawLrc'] || '';
                parsedOfficialLyrics = currentRawLrcText ? parseLRC(currentRawLrcText) : cached[sourceId + '_lyrics'];
                hasOfficialLyrics = true;
                renderLyrics(parsedOfficialLyrics);
                updateStatusTag(meta.label, meta.color);
                return;
            }

            // 否则向原生层发起精准网络检索（静默更新右下角胶囊，不再弹出居中 Toast）
            updateStatusTag('检索' + meta.label + '中...', meta.color);

            if (window.AndroidApp && window.AndroidApp.requestLyricSource) {
                window.AndroidApp.requestLyricSource(
                    sourceId,
                    currentTrack.title || "",
                    currentTrack.artist || "",
                    currentTrack.album || "",
                    currentPlaybackGeneration
                );
            }
        }

        function selectLyricSource(sourceId, e) {
            if (e && e.stopPropagation) e.stopPropagation();
            currentActiveSource = sourceId;
            userExplicitMode = (sourceId !== 'auto') ? sourceId : null;
            if (currentTrack && sourceId !== 'visualizer') {
                currentTrack.isVideo = false;
            }
            try {
                localStorage.setItem('preferred_lyric_source', sourceId);
            } catch (err) {}
            closeLyricMenu();
            updateMenuCheckmarks();

            applyLyricSourceForCurrentTrack(sourceId, true);
            if (sourceId === 'visualizer' && window.AndroidApp && window.AndroidApp.updateMusicPermission) {
                window.AndroidApp.updateMusicPermission(true, true);
            }
            // 切换歌词来源后，严格启动 6 秒自动淡出控件计时
            resetIdleTimer();
        }

        // 接收来自 Android 原生层针对特定源的检索结果（完全静默化，不弹居中窗）
        window.onSpecificLyricResult = function(data) {
            if (!data) return;
            if (typeof data.generation === 'number' && data.generation !== currentPlaybackGeneration) {
                return;
            }
            const source = data.source;
            if (source && typeof data.sourceRequestId === 'number') {
                if (lastSourceRequestId[source] !== undefined && data.sourceRequestId < lastSourceRequestId[source]) {
                    return;
                }
                lastSourceRequestId[source] = data.sourceRequestId;
            }
            const rawLrc = data.lyrics;
            const lyricSource = data.lyricSource;
            const meta = SOURCE_META[source] || getSourceMeta(lyricSource);

            const trackKey = data.trackKey || currentSongKey || ((currentTrack ? currentTrack.title : '') + '\t' + (currentTrack ? currentTrack.artist : '')).toLowerCase().trim();
            ensureSongCacheEntry(trackKey);

            if (rawLrc && rawLrc.trim().length > 0) {
                const parsed = parseLRC(rawLrc);
                if (parsed.length > 0) {
                    songCache[trackKey][source + '_lyrics'] = parsed;
                    songCache[trackKey][source + '_rawLrc'] = rawLrc;
                    if (userExplicitMode === source) {
                        currentRawLrcText = rawLrc;
                        parsedOfficialLyrics = parsed;
                        hasOfficialLyrics = true;
                        renderLyrics(parsed);
                        updateStatusTag(meta.label, meta.color);
                    }
                    return;
                }
            }

            // 未找到该源歌词
            if (userExplicitMode === source) {
                if (currentTrack.streamLyric) {
                    showStreamLyric(currentTrack.streamLyric);
                    updateStatusTag('蓝牙歌词 (原源无词)', SOURCE_META.bluetooth.color);
                } else {
                    renderLyrics([]);
                    updateStatusTag(meta.label + ' (无词)', '#888888');
                }
            }
        };

        // 接收来自 Java 原生多源高速检索的网络封面与官方歌词 (iTunes, Kugou, LRCLIB)
        window.onOnlineResult = function(data) {
            if (!data) return;
            if (typeof data.generation === 'number' && data.generation !== currentPlaybackGeneration) {
                // 彻底丢弃非当前代次结果，防止切歌迟到回调污染！
                return;
            }
            if (data.source && typeof data.sourceRequestId === 'number') {
                if (lastSourceRequestId[data.source] !== undefined && data.sourceRequestId < lastSourceRequestId[data.source]) {
                    // 彻底丢弃同源乱序到达的旧请求结果！
                    return;
                }
                lastSourceRequestId[data.source] = data.sourceRequestId;
            }

            // 核心保护：若当前曲目处于视频模式，严禁被滞后的旧音乐歌词渲染覆盖大号律动频谱，且黑胶保持空白盘面
            if (currentTrack && currentTrack.isVideo) {
                const stream = document.getElementById('lyricsStream');
                const emptyBox = document.getElementById('emptyLyrics');
                const largeViz = document.getElementById('largeVisualizer');
                if (stream) {
                    stream.textContent = '';
                    stream.style.display = 'none';
                }
                if (emptyBox) emptyBox.style.display = 'none';
                if (largeViz) largeViz.style.display = 'flex';
                syncSpectrumVisibility();
                setCoverImage('');
                return;
            }

            const trackKey = data.trackKey || currentSongKey || ((currentTrack ? currentTrack.title : '') + '\t' + (currentTrack ? currentTrack.artist : '')).toLowerCase().trim();
            ensureSongCacheEntry(trackKey);

            if (isValidCoverUrl(data.coverUrl) && data.lyricSource !== '视频模式') {
                lastValidMusicCoverUrl = data.coverUrl;
                songCache[trackKey].coverUrl = data.coverUrl;
                setCoverImage(data.coverUrl);
            } else if (!songCache[trackKey].coverUrl) {
                setCoverImage('');
            }
            if (data.lyricSource) {
                songCache[trackKey].lyricSource = data.lyricSource;
                currentTrack.lyricSource = data.lyricSource;
            }
            if (data.lyrics) {
                songCache[trackKey].rawLrc = data.lyrics;
                const parsed = parseLRC(data.lyrics);
                if (parsed.length > 0) {
                    songCache[trackKey].parsedLyrics = parsed;
                    // 仅当用户处于“自动推荐”模式或指定源与当前源匹配时，才更新全屏歌词展示；
                    // 若用户手动锁定了特定源（如 QQ音乐、网易云等），而此为其他来源，切歌时绝不被覆盖！
                    if (currentActiveSource === 'auto' || (data.source && data.source === currentActiveSource)) {
                        currentRawLrcText = data.lyrics;
                        parsedOfficialLyrics = parsed;
                        hasOfficialLyrics = true;
                        lyricMode = 'official';
                        renderLyrics(parsed);
                        const meta = getSourceMeta(data.lyricSource || songCache[trackKey].lyricSource);
                        updateStatusTag(meta.label, meta.color);

                        // 蓝牙投送歌词与网上拉取歌词的二次校对
                        if (currentTrack.streamLyric) {
                            crossCheckLyrics(currentTrack.streamLyric);
                        }
                        return;
                    }
                }
            }

            if (currentActiveSource === 'bluetooth') {
                if (currentTrack.streamLyric) {
                    showStreamLyric(currentTrack.streamLyric);
                }
            } else if (currentActiveSource === 'auto' && !hasOfficialLyrics) {
                renderLyrics([]);
                updateStatusTag(currentTrack.streamLyric ? '蓝牙歌词' : '纯音乐 / 暂无歌词', '#888888');
            }
        };

        window.onMetadataChanged = function(data) {
            if (!data || !data.title) return;
            console.log("[JS] onMetadataChanged: title=" + data.title + " isVideo=" + data.isVideo);

            const title = data.title;
            const artist = data.artist || "未知歌手";
            const album = data.album || "";
            const streamLyric = data.streamLyric || "";
            const isVideo = !!data.isVideo;

            if (data.isEnrichment) {
                // 元数据补全或蓝牙流式歌词推送：绝不能切歌、绝不能递增代次、绝不能重置时钟与歌词！
                if (streamLyric) {
                    currentTrack.streamLyric = streamLyric;
                    if (data.trackKey && songCache[data.trackKey]) {
                        songCache[data.trackKey].streamLyric = streamLyric;
                    }
                    crossCheckLyrics(streamLyric);
                    if (userExplicitMode === 'bluetooth' || (!userExplicitMode && !hasOfficialLyrics)) {
                        showStreamLyric(streamLyric);
                    }
                }
                if (album && (!currentTrack.album || currentTrack.album === '')) {
                    currentTrack.album = album;
                    let artistAlbumText = (artist && artist !== "未知歌手" && !artist.toLowerCase().includes("bluetooth"))
                        ? artist.replace(/\s*\/\s*/g, ' / ')
                        : (isVideo ? "蓝牙音频播放" : "未知歌手");
                    if (!title.toLowerCase().includes(album.toLowerCase()) && !album.toLowerCase().includes(title.toLowerCase())) {
                        artistAlbumText = `${artistAlbumText} · ${album}`;
                    }
                    const songArtistEl = document.getElementById('songArtist');
                    if (songArtistEl) songArtistEl.textContent = artistAlbumText;
                }
                if (data.duration && data.duration > 0) {
                    currentTrack.duration = data.duration;
                    durationMs = data.duration;
                    const timeTotal = document.getElementById('timeTotal');
                    if (timeTotal) timeTotal.textContent = formatTime(data.duration);
                }
                if (data.trackKey) currentSongKey = data.trackKey;
                return;
            }

            const isNewSong = (currentTrack.title !== title || currentTrack.artist !== artist);
            if (isNewSong) {
                lastSourceRequestId = {};
            }
            currentPlaybackGeneration = (typeof data.generation === 'number') ? data.generation : (currentPlaybackGeneration + 1);
            currentSongKey = data.trackKey || (songCache[(title + " - " + artist).toLowerCase().trim()] ? (title + " - " + artist).toLowerCase().trim() : (title + "\t" + artist + (album ? "\t" + album : "")).toLowerCase().trim());
            currentTrack = data;
            window.currentTrack = currentTrack;

            document.getElementById('songTitle').textContent = formatSongTitle(title);
            let artistAlbumText = (artist && artist !== "未知歌手" && !artist.toLowerCase().includes("bluetooth"))
                ? artist.replace(/\s*\/\s*/g, ' / ')
                : (isVideo ? "蓝牙音频播放" : "未知歌手");

            if (album && !title.toLowerCase().includes(album.toLowerCase()) && !album.toLowerCase().includes(title.toLowerCase())) {
                artistAlbumText = `${artistAlbumText} · ${album}`;
            }
            document.getElementById('songArtist').textContent = artistAlbumText;
            document.getElementById('timeTotal').textContent = formatTime(data.duration);

            const trackKey = currentSongKey;
            ensureSongCacheEntry(trackKey);
            if (streamLyric) songCache[trackKey].streamLyric = streamLyric;

            if (isVideo) {
                // 视频音轨模式：不提取标题搜歌词与封面，不展示“正在检索”，直接呈现大号 9 频段声波律动
                hasOfficialLyrics = false;
                parsedOfficialLyrics = [];
                activeLyricIndex = -1;
                renderedLyricIndex = -1;
                const stream = document.getElementById('lyricsStream');
                const emptyBox = document.getElementById('emptyLyrics');
                const largeViz = document.getElementById('largeVisualizer');
                if (stream) {
                    stream.innerHTML = '';
                    stream.style.display = 'none';
                }
                if (emptyBox) emptyBox.style.display = 'none';
                if (largeViz) largeViz.style.display = 'flex';
                syncSpectrumVisibility();
                updateStatusTag('视频模式', '#5ac8fa');
                setCoverImage('');
                return;
            }

            if (isNewSong) {
                // 1. 彻底重置播放时钟与进度，杜绝切歌后继承上一首歌末尾进度
                currentRawLrcText = "";
                lastPositionMs = 0;
                lastSyncTime = performance.now();
                lastHardwarePosSyncTime = 0;
                activeLyricIndex = 0;
                renderedLyricIndex = -1;
                lastRenderedSec = 0;
                lastRenderedPct = 0;
                const progressBar = document.getElementById('progressBar');
                if (progressBar) progressBar.style.width = '0%';
                const timeCurrent = document.getElementById('timeCurrent');
                if (timeCurrent) timeCurrent.textContent = '00:00';

                // 2. 切歌过渡动画：淡出上一首歌词流，同时淡入检索提示
                const stream = document.getElementById('lyricsStream');
                const emptyBox = document.getElementById('emptyLyrics');
                const emptyText = document.getElementById('emptyText');
                const largeViz = document.getElementById('largeVisualizer');

                if (largeViz) largeViz.style.display = 'none';

                if (stream) {
                    stream.style.transition = 'opacity 0.25s ease-out';
                    stream.style.opacity = '0';
                }

                if (emptyBox) {
                    if (emptyText) emptyText.textContent = '正在检索官方歌词与封面...';
                    emptyBox.style.display = 'flex';
                    emptyBox.style.transition = 'none';
                    emptyBox.style.opacity = '0';
                    void emptyBox.offsetWidth;
                    emptyBox.style.transition = 'opacity 0.3s ease-in';
                    emptyBox.style.opacity = '1';
                }

                hasOfficialLyrics = false;
                syncSpectrumVisibility();
                parsedOfficialLyrics = [];
                activeLyricIndex = -1;
                renderedLyricIndex = -1;

                // 核心：严格保持用户手动选定的歌词源偏好，切歌时不回退为默认
                updateMenuCheckmarks();

                const cached = songCache[trackKey];
                if (cached && isValidCoverUrl(cached.coverUrl)) {
                    lastValidMusicCoverUrl = cached.coverUrl;
                    setCoverImage(cached.coverUrl);
                } else {
                    // 新曲目尚未检索到封面或无封面时，立即重置为空白黑胶，杜绝残留上一首歌或占位人像图
                    setCoverImage('');
                }

                if (currentActiveSource !== 'auto') {
                    // 用户锁定了特定来源（如 QQ音乐 / 网易云音乐 / 酷狗 / 蓝牙实时歌词）
                    applyLyricSourceForCurrentTrack(currentActiveSource, false);
                } else {
                    // 默认自动推荐模式
                    userExplicitMode = null;
                    if (cached && cached.parsedLyrics && cached.parsedLyrics.length > 0) {
                        currentRawLrcText = cached.rawLrc || '';
                        parsedOfficialLyrics = currentRawLrcText ? parseLRC(currentRawLrcText) : cached.parsedLyrics;
                        hasOfficialLyrics = true;
                        lyricMode = 'official';
                        if (cached.lyricSource) currentTrack.lyricSource = cached.lyricSource;
                        renderLyrics(parsedOfficialLyrics);
                        const label = getLyricSourceLabel(cached.lyricSource);
                        updateStatusTag(label, '#1db954');
                    } else {
                        renderLyrics([]);
                        updateStatusTag('正在匹配歌词与封面...', '#f5a623');
                    }
                }
            }

            if (streamLyric) {
                // 蓝牙投送歌词与网上拉取歌词二次校验
                crossCheckLyrics(streamLyric);

                if (userExplicitMode === 'bluetooth' || (!userExplicitMode && !hasOfficialLyrics)) {
                    showStreamLyric(streamLyric);
                }
            }
        };

        let playbackSpeed = 1.0;
        window.playbackSpeed = playbackSpeed;
        let manualPlaybackLockUntil = 0;
        let manualTargetPlayState = null;

        window.onPlaybackStateChanged = function(data) {
            if (!data) return;
            const pos = (typeof data.position === 'number') ? data.position : 0;
            if (pos >= 0) {
                const isBigSeek = isPlaying && lastPositionMs > 0 && Math.abs(pos - lastPositionMs) > 3000;
                lastPositionMs = pos;

        let remoteMenuFocusIdx = -1;

        document.addEventListener('pointermove', function(e) {
            if (isTapCandidate) {
                const dist = Math.hypot(e.clientX - tapDownX, e.clientY - tapDownY);
                if (dist > 20) {
                    isTapCandidate = false;
                    if (document.body.classList.contains('idle')) {
                        setIdleState(false);
                    } else {
                        resetIdleTimer();
                    }
                }
            }
        }, { passive: true });

        document.addEventListener('pointerup', function(e) {
            handleTapEnd(e.clientX, e.clientY, e.target);
        }, { passive: true });

        // Fallback for touch devices if PointerEvent doesn't fire
        document.addEventListener('touchstart', function(e) {
            if (e.touches && e.touches[0]) {
                handleTapStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            if (e.changedTouches && e.changedTouches[0]) {
                handleTapEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY, e.target);
            }
        }, { passive: true });

        // 点击屏幕空白处保底事件（兼容各种输入设备与电视遥控器）
        document.addEventListener('click', function(e) {
            const now = performance.now();
            if (now - lastTapHandledTime < 400) return; // 过滤重复合成点击
            lastTapHandledTime = now;

            const isMenuOpen = isAnySecondaryMenuOpen();
            let isInteractive = false;
            if (e.target && e.target.closest) {
                if (isMenuOpen) {
                    isInteractive = !!e.target.closest('button, .btn-ctrl, .vol-btn, .volume-widget, .source-tag, .device-pill, .device-dropdown, .lyric-source-menu, #closeBtn, .font-btn, .lyric-font-widget');
                } else {
                    isInteractive = !!e.target.closest('button, .btn-ctrl, .vol-btn, .volume-widget, .source-tag, .device-pill, .device-dropdown, #closeBtn');
                }
            }

            if (!isInteractive) {
                if (document.body.classList.contains('idle')) {
                    setIdleState(false);
                } else if (isMenuOpen) {
                    closeAllSecondaryMenus();
                    resetIdleTimer();
                } else {
                    setIdleState(true);
                }
            }
        });

        resetIdleTimer();

        // ===== 常驻垂直音量控制组件交互与系统联动 =====
        let currentVolumePct = 50;
        let volForceTimeout = null;

        function updateVolumeDisplay(pct) {
            currentVolumePct = Math.max(0, Math.min(100, Math.round(pct)));
            const fill = document.getElementById('volFill');
            const text = document.getElementById('volPctText');
            if (fill) fill.style.height = currentVolumePct + '%';
            if (text) text.textContent = currentVolumePct + '%';
        }

        function handleVolumeStep(delta, e) {
            if (e) {
                if (e.preventDefault) e.preventDefault();
                if (e.stopPropagation) e.stopPropagation();
            }
            resetIdleTimer();
            if (window.AndroidApp && window.AndroidApp.changeVolumeBy) {
                const res = window.AndroidApp.changeVolumeBy(delta);
                updateVolumeDisplay(res);
            } else if (window.AndroidApp && window.AndroidApp.setVolumePercent) {
                const target = Math.max(0, Math.min(100, currentVolumePct + delta));
                const res = window.AndroidApp.setVolumePercent(target);
                updateVolumeDisplay(res);
            } else {
                updateVolumeDisplay(currentVolumePct + delta);
            }
        }

        // 手机端物理按键/蓝牙调整音量时的系统级事件同步：仅淡入音量条，四个角落的控件保持隐藏
        window.onSystemVolumeChanged = function(newPct) {
            updateVolumeDisplay(newPct);
            const widget = document.getElementById('volumeWidget');
            if (widget) {
                widget.classList.add('force-show');
                clearTimeout(volForceTimeout);
                volForceTimeout = setTimeout(function() {
                    widget.classList.remove('force-show');
                }, 3000);
            }
        };

        // 页面初始化时拉取当前系统音量
        if (window.AndroidApp && window.AndroidApp.getVolume) {
            try {
                updateVolumeDisplay(window.AndroidApp.getVolume());
            } catch (err) {}
        }
    </script>
</body>
</html>
