        let toastTimeout = null;
        function showToastTip(msg) {
            const toast = document.getElementById('toastTip');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function formatTime(ms) {
            if (!ms || ms < 0 || isNaN(ms)) return "00:00";
            const totalSec = Math.floor(ms / 1000);
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function getVisualLength(str) {
            if (!str) return 0;
            let len = 0;
            for (let i = 0; i < str.length; i++) {
                len += str.charCodeAt(i) > 255 ? 2 : 1;
            }
            return len;
        }

        // 智能切分超长单行歌词：防止文字超出屏幕显示范围或折行导致行高破坏
        function splitLongLyrics(items) {
            if (!items || items.length === 0) return [];
            const result = [];
            const strongPuncts = [',', '，', ';', '；', '!', '！', '?', '？', '~', '、'];

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                const text = (item.text || '').trim();
                const vlen = getVisualLength(text);

                // 视觉宽度超出单行舒适阈值 (如中文 > 20字 或 西文 > 40字符) 自动智能分句
                if (vlen > 40) {
                    let p1 = '', p2 = '';

                    // 1. 优先尝试双语 / 显式分隔符 (如 " // " 或 " / " 或 " | ")
                    const explicitSep = text.match(/\s+(\/\/|\/|\|)\s+/);
                    if (explicitSep && explicitSep.index > 3 && (explicitSep.index + explicitSep[0].length) < text.length - 3) {
                        p1 = text.substring(0, explicitSep.index).trim();
                        p2 = text.substring(explicitSep.index + explicitSep[0].length).trim();
                    } else {
                        const mid = Math.floor(text.length / 2);
                        let bestPos = -1;
                        let bestDist = 9999;

                        // 2. 标点符号断句：寻找最靠近中心位置的强标点
                        for (let j = 3; j < text.length - 3; j++) {
                            if (strongPuncts.includes(text[j])) {
                                const dist = Math.abs(j - mid);
                                if (dist < bestDist) {
                                    bestDist = dist;
                                    bestPos = j;
                                }
                            }
                        }

                        // 3. 空格断句（英文/西文长句）：寻找最靠近中点的空格
                        if (bestPos === -1) {
                            for (let j = 4; j < text.length - 4; j++) {
                                if (text[j] === ' ') {
                                    const dist = Math.abs(j - mid);
                                    if (dist < bestDist) {
                                        bestDist = dist;
                                        bestPos = j;
                                    }
                                }
                            }
                        }

                        if (bestPos > 0) {
                            if (text[bestPos] === ' ') {
                                p1 = text.substring(0, bestPos).trim();
                                p2 = text.substring(bestPos + 1).trim();
                            } else {
                                p1 = text.substring(0, bestPos + 1).trim();
                                p2 = text.substring(bestPos + 1).trim();
                            }
                        } else {
                            // 4. 无标点也无空格的超长中文长句，居中对半拆分
                            p1 = text.substring(0, mid).trim();
                            p2 = text.substring(mid).trim();
                        }
                    }

                    if (p1 && p2) {
                        const t1 = item.time;
                        const nextItem = (i + 1 < items.length) ? items[i + 1] : null;
                        const duration = (nextItem && nextItem.time > t1) ? (nextItem.time - t1) : 4000;
                        const l1 = getVisualLength(p1);
                        const l2 = getVisualLength(p2);
                        // 按两句文本权重比例分配时间跨度，限制比例在 35% ~ 65% 之间避免过短过长
                        const ratio = Math.max(0.35, Math.min(0.65, l1 / (l1 + l2)));
                        const t2 = Math.round(t1 + duration * ratio);

                        result.push({ time: t1, text: p1 });
                        result.push({ time: t2, text: p2 });
                        continue;
                    }
                }

                result.push(item);
            }
            return result;
        }

        function parseLRC(lrcText) {
            if (!lrcText) return [];
            const lines = lrcText.split('\n');
            const result = [];
            let globalOffsetMs = 0;

            // 1. 提取全局时间偏移标签 [offset: +/-xxx]
            const offsetReg = /\[offset:\s*([+-]?\d+)\]/i;
            for (const line of lines) {
                const offMatch = line.match(offsetReg);
                if (offMatch) {
                    globalOffsetMs = parseInt(offMatch[1], 10) || 0;
                    break;
                }
            }

            // 2. 支持无小数 [mm:ss]、变长小数 [mm:ss.s] / [mm:ss.xx] / [mm:ss.xxx] 以及分秒毫秒
            const timeReg = /\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g;

            for (const line of lines) {
                // 忽略非歌词的元数据标签行，如 [ti:], [ar:], [al:], [by:], [offset:]
                if (/^\[(ti|ar|al|by|offset|length):/i.test(line.trim())) continue;

                const matches = [...line.matchAll(timeReg)];
                if (matches.length === 0) continue;
                const text = line.replace(timeReg, '').trim();
                if (!text) continue;

                for (const match of matches) {
                    const m = parseInt(match[1], 10);
                    const s = parseInt(match[2], 10);
                    const fracStr = match[3] || '0';
                    const ms = parseInt(fracStr.padEnd(3, '0').slice(0, 3), 10);
                    let totalTime = m * 60000 + s * 1000 + ms + globalOffsetMs;
                    if (totalTime < 0) totalTime = 0;
                    result.push({ time: totalTime, text: text });
                }
            }
            result.sort((a, b) => a.time - b.time);
            return splitLongLyrics(result);
        }
        window.parseLRC = parseLRC;

        // 智能优化歌名分行逻辑（古典作品乐章绑定、括号副标题语义换行、破折号断句、防末尾寡字）
        function formatSongTitle(rawTitle) {
            if (!rawTitle) return "";
            // 1. 标准化标点符号与其后空格：确保冒号后有空格（如 "K. 285:I. Allegro" -> "K. 285: I. Allegro"）
            let t = rawTitle.replace(/:([^\s])/g, ': $1');
            // 2. 乐章罗马数字（I. / II. / III. / IV. 等）与后方速度标记之间绑定不换行空格（\u00A0），
            //    确保 "I." 和 "Allegro" 绝对保持在同一行，绝不孤立分行
            t = t.replace(/\b([IVXLCDM]+\.)\s+/gi, '$1\u00A0');
            // 3. 作品编号前缀（Op. / K. / BWV / Hob. / No.）与其编号之间绑定不换行空格
            t = t.replace(/\b(Op\.|K\.|BWV|Hob\.|No\.)\s*(\d+)/gi, '$1\u00A0$2');
            // 4. 合作歌手标识词绑定（feat. / ft. / with）
            t = t.replace(/\b(feat\.|ft\.|with)\s+/gi, '$1\u00A0');

            // 5. 智能语义断句分行（副标题、影视原声括号、版本说明、破折号断句）
            // 当歌名总字符数较长 (>= 12 个字符) 且包含括号或破折号时，在断句处引入语义换行 \n
            if (t.length >= 12) {
                // 括号副标题前插入换行（如 "好不容易 (电视剧《华灯初上》片尾曲)" -> "好不容易\n(电视剧《华灯初上》片尾曲)"）
                // 仅当括号前已有至少 2 个字符的主歌名时断句，避免标题以括号开头时首行空行
                t = t.replace(/^(.{2,}?)\s*([\(（【\[])(?=[^\)）\]】]{2,}[\)）\]】])/u, '$1\n$2');

                // 破折号副标题前插入换行（如 "青花瓷 - 伴奏" -> "青花瓷\n- 伴奏"）
                if (!t.includes('\n')) {
                    t = t.replace(/^(.{2,}?)\s+([—–\-]\s+.+)$/u, '$1\n$2');
                }
            }

            return t;
        }

        
        // 真实音频频谱与智能节拍律动驱动引擎
        let lastFftTime = 0;
        let realSpectrum = [0.08, 0.08, 0.08, 0.08, 0.08];
        const waveBars = [];

        function getEqualizerBars() {
            if (waveBars.length < 5) {
                const eq = document.getElementById('equalizerWave');
                if (eq) {
                    const bars = eq.querySelectorAll('.wave-bar');
                    waveBars.length = 0;
                    bars.forEach(b => waveBars.push(b));
                }
            }
            return waveBars;
        }

        // Android 原生 Visualizer 实时回调：接收 9 个真实物理频段 (0.08 ~ 1.0)
        window.onAudioSpectrum = function(b0, b1, b2, b3, b4, b5, b6, b7, b8) {
            lastFftTime = performance.now();
            const s9 = isPlaying ? [
                Math.max(0.08, Math.min(1.0, b0 || 0)),
                Math.max(0.08, Math.min(1.0, b1 || 0)),
                Math.max(0.08, Math.min(1.0, b2 || 0)),
                Math.max(0.08, Math.min(1.0, b3 || 0)),
                Math.max(0.08, Math.min(1.0, b4 || 0)),
                Math.max(0.08, Math.min(1.0, b5 || b3 || 0)),
                Math.max(0.08, Math.min(1.0, b6 || b4 || 0)),
                Math.max(0.08, Math.min(1.0, b7 || b4 || 0)),
                Math.max(0.08, Math.min(1.0, b8 || b4 || 0))
            ] : [0.08, 0.08, 0.08, 0.08, 0.08, 0.08, 0.08, 0.08, 0.08];
            realSpectrum = [s9[0], s9[2], s9[4], s9[6], s9[8]];

            // 底部迷你5柱均衡器
            const bars = getEqualizerBars();
            if (bars.length >= 5) {
                bars[0].style.transform = `scaleY(${s9[0].toFixed(3)})`;
                bars[1].style.transform = `scaleY(${s9[2].toFixed(3)})`;
                bars[2].style.transform = `scaleY(${s9[4].toFixed(3)})`;
                bars[3].style.transform = `scaleY(${s9[6].toFixed(3)})`;
                bars[4].style.transform = `scaleY(${s9[8].toFixed(3)})`;
            }

            // 驱动大号律动频谱柱形（真实 9 频段物理 FFT，无伪造插值）
            const lbars = getLargeWaveBars();
            if (lbars.length >= 9) {
                for (let i = 0; i < 9; i++) {
                    lbars[i].style.transform = `scaleY(${s9[i].toFixed(3)})`;
                }
            }
        };

        // ===== 歌词视口手势上下拖拽滑动与 3 秒柔顺回滚 =====
        let isManualScrolling = false;
        let isDraggingLyrics = false;
        let dragStartY = 0;
        let dragStartTranslateY = 0;
        let currentTranslateY = 0;
        let manualScrollResumeTimer = null;

        function updateLyricHighlight(targetIndex, instant) {
            const oldIndex = activeLyricIndex;
            const lines = document.querySelectorAll('.lyric-line');
            if (!lines || lines.length === 0) return;

            if (oldIndex < 0 || oldIndex === targetIndex) {
                // 首次高亮或全量初始化
                for (let idx = 0; idx < lines.length; idx++) {
                    const el = lines[idx];
                    const dist = Math.abs(idx - targetIndex);
                    if (instant) {
                        el.style.transition = 'none';
                    } else if (el.style.transition) {
                        el.style.transition = '';
                    }
                    let newClass = 'lyric-line';
                    if (dist === 0) {
                        newClass += ' active';
                    } else if (dist <= 4) {
                        newClass += ` near near-${dist}`;
                    } else {
                        newClass += ' far';
                    }
                    el.className = newClass;
                }
            } else {
                // 真正邻域并集：[oldIndex-4, oldIndex+4] ∪ [targetIndex-4, targetIndex+4]
                const affectedIndices = new Set();
                const total = lines.length;
                for (let i = oldIndex - 4; i <= oldIndex + 4; i++) {
                    if (i >= 0 && i < total) affectedIndices.add(i);
                }
                for (let i = targetIndex - 4; i <= targetIndex + 4; i++) {
                    if (i >= 0 && i < total) affectedIndices.add(i);
                }
                affectedIndices.forEach(idx => {
                    const el = lines[idx];
                    if (!el) return;
                    const dist = Math.abs(idx - targetIndex);
                    if (instant) {
                        el.style.transition = 'none';
                    } else if (el.style.transition) {
                        el.style.transition = '';
                    }
                    let newClass = 'lyric-line';
                    if (dist === 0) {
                        newClass += ' active';
                    } else if (dist <= 4) {
                        newClass += ` near near-${dist}`;
                    } else {
                        newClass += ' far';
                    }
                    el.className = newClass;
                });
            }
            activeLyricIndex = targetIndex;
        }

        function scrollToLyricIndex(index, animated) {
            const stream = document.getElementById('lyricsStream');
            if (!stream) return;
            const targetEl = document.getElementById(`line-${index}`);
            if (!targetEl) return;
            const targetOffset = targetEl.offsetTop;
            currentTranslateY = -targetOffset;
            if (animated) {
                stream.style.transition = 'transform 0.85s cubic-bezier(0.22, 1, 0.36, 1)';
            } else {
                stream.style.transition = 'none';
            }
            stream.style.transform = `translateY(-${targetOffset}px)`;
        }

        // 手松开 3 秒后：优雅淡出当前拖动停留行，瞬间切换到当前播放行并淡入
        function fadeTransitionToCurrentLyric() {
            const stream = document.getElementById('lyricsStream');
            if (!stream) {
                isManualScrolling = false;
                return;
            }

            // 1. 拖动停止 3 秒后，当前停留的歌词视口平滑淡出 (0.28s)
            stream.style.transition = 'opacity 0.28s cubic-bezier(0.4, 0, 1, 1)';
            stream.style.opacity = '0';

            setTimeout(() => {
                if (activeLyricIndex >= 0) {
                    // 2. 在完全隐身状态下无感知直接重定位到当前播放行
                    // instant=true 保证非激活远端行立即变成 visibility: hidden / opacity: 0，无任何 0.4s 滞后残影！
                    updateLyricHighlight(activeLyricIndex, true);
                    scrollToLyricIndex(activeLyricIndex, false);
                }
                // 3. 强制重排并等待渲染树完成帧提交后，再淡入当前播放行 (0.35s)
                void stream.offsetHeight;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        isManualScrolling = false;
                        stream.style.transition = 'opacity 0.35s cubic-bezier(0, 0, 0.2, 1), transform 0.85s cubic-bezier(0.22, 1, 0.36, 1)';
                        stream.style.opacity = '1';
                    });
                });
            }, 290);
        }

        function initLyricsDragGesture() {
            const viewport = document.getElementById('lyricsViewport');
            const stream = document.getElementById('lyricsStream');
            if (!viewport || !stream) return;

            viewport.addEventListener('pointerdown', function(e) {
                if (lyricMode !== 'official' || !hasOfficialLyrics || !lyrics || lyrics.length === 0) return;
                dragStartY = e.clientY;
                dragStartTranslateY = currentTranslateY;
                isDraggingLyrics = false;
                clearTimeout(manualScrollResumeTimer);
                // 若在淡入淡出中再次触碰屏幕，立即恢复满不透明度
                stream.style.opacity = '1';
            });

            viewport.addEventListener('pointermove', function(e) {
                if (lyricMode !== 'official' || !hasOfficialLyrics || !lyrics || lyrics.length === 0) return;
                const deltaY = e.clientY - dragStartY;
                if (!isDraggingLyrics && Math.abs(deltaY) > 5) {
                    isDraggingLyrics = true;
                    isManualScrolling = true;
                    stream.style.transition = 'none';
                }

                if (isDraggingLyrics) {
                    let targetY = dragStartTranslateY + deltaY;
                    const maxOffset = -(lyrics.length - 1) * 50;
                    // 阻尼弹性边界
                    if (targetY > 100) targetY = 100 + (targetY - 100) * 0.3;
                    if (targetY < maxOffset - 100) targetY = maxOffset - 100 + (targetY - (maxOffset - 100)) * 0.3;

                    currentTranslateY = targetY;
                    stream.style.transform = `translateY(${targetY}px)`;

                    // 动态高亮当前视口中心对齐的歌词行
                    const previewIndex = Math.max(0, Math.min(lyrics.length - 1, Math.round(-targetY / 50)));
                    updateLyricHighlight(previewIndex);
                }
            });

            const onDragEnd = function(e) {
                if (!isDraggingLyrics) return;
                isDraggingLyrics = false;
                resetIdleTimer();

                // 手松开 3 秒后：不滚回，优雅淡出后淡入当前播放行
                clearTimeout(manualScrollResumeTimer);
                manualScrollResumeTimer = setTimeout(() => {
                    fadeTransitionToCurrentLyric();
                }, 3000);
            };

            viewport.addEventListener('pointerup', onDragEnd);
            viewport.addEventListener('pointercancel', onDragEnd);
        }
        document.addEventListener('DOMContentLoaded', initLyricsDragGesture);
        setTimeout(initLyricsDragGesture, 200);

        // 智能判断歌词是否为纯音乐（覆盖“作词：... 作曲：... 纯音乐，请欣赏”、无填词、或纯制作演职员信息）
        function isPureMusicLyric(lrcArray) {
            if (!lrcArray || lrcArray.length === 0) return true;

            const creditRegex = /^(作词|作曲|编曲|制作|监制|混音|母带|录音|吉他|贝斯|鼓|键盘|钢琴|弦乐|和声|文案|企划|统筹|出品|发行|原唱|词|曲|op|sp|written by|composed by|arranged by|produced by|mixed by|mastered by|recorded by|lyrics by|music by)[:：\s]/i;
            const pureMusicRegex = /(纯音乐|请欣赏|没有填词|暂无歌词|无歌词|享受音乐|instrumental|no lyrics|pure music)/i;

            let realSingingLines = 0;
            let hasPureMusicMarker = false;

            for (const item of lrcArray) {
                const text = (item.text || "").trim();
                if (!text) continue;

                if (pureMusicRegex.test(text)) {
                    hasPureMusicMarker = true;
                    continue;
                }

                if (creditRegex.test(text)) {
                    // 演职员名单/制作信息行，非歌词唱词
                    continue;
                }

                // 属于实际唱词
                realSingingLines++;
            }

            // 1. 若出现了明确的纯音乐占位文案，只要实际唱词行 <= 2，即确认为纯音乐
            if (hasPureMusicMarker && realSingingLines <= 2) {
                return true;
            }

            // 2. 若全篇只包含作词/作曲等演职员信息而无任何实际唱词，也归为纯音乐
            if (realSingingLines === 0) {
                return true;
            }

            return false;
        }

        // 蓝牙实时歌词与网络拉取官方歌词的双层时间窗口与权威校准引擎
        let isOfficialLyricVerified = false;
        function crossCheckLyrics(streamLyric) {
            if (!streamLyric || !hasOfficialLyrics || !lyrics || lyrics.length === 0) return;
            if (currentTrack && currentTrack.isVideo) return;
            // 忽略纯音乐与演职员占位文案
            if (streamLyric.includes("纯音乐") || streamLyric.includes("请欣赏") || streamLyric.includes("作词") || streamLyric.includes("作曲")) return;

            // 纯净文本标准化（去除标点、符号、空格，统一小写）
            const sClean = streamLyric.toLowerCase().replace(/[^\w\u4e00-\u9fa5]/g, "");
            if (sClean.length < 2) return;

            const curEstimated = lastPositionMs + (isPlaying ? (performance.now() - lastSyncTime) * playbackSpeed : 0);

            // 第一层（优先窗口）：在当前估计进度前后 ±15 秒窗口内匹配，解决重复副歌句子总是命中第一遍的 bug
            const WINDOW_MS = 15000;
            let matchedIndex = -1;

            for (let i = 0; i < lyrics.length; i++) {
                const lTime = lyrics[i].time;
                if (lTime >= curEstimated - WINDOW_MS && lTime <= curEstimated + WINDOW_MS) {
                    const lClean = (lyrics[i].text || "").toLowerCase().replace(/[^\w\u4e00-\u9fa5]/g, "");
                    if (lClean && (lClean.includes(sClean) || sClean.includes(lClean))) {
                        matchedIndex = i;
                        break;
                    }
                }
            }

            // 第二层（全局兜底窗口）：如果优先窗口未命中，并且当前发生了大幅偏移或未定位
            if (matchedIndex < 0) {
                for (let i = 0; i < lyrics.length; i++) {
                    const lClean = (lyrics[i].text || "").toLowerCase().replace(/[^\w\u4e00-\u9fa5]/g, "");
                    if (lClean && (lClean.includes(sClean) || sClean.includes(lClean))) {
                        // 选取与当前进度绝对距离最近的一个候选行，防止无条件跳回第 0 行
                        if (matchedIndex < 0 || Math.abs(lyrics[i].time - curEstimated) < Math.abs(lyrics[matchedIndex].time - curEstimated)) {
                            matchedIndex = i;
                        }
                    }
                }
            }

            if (matchedIndex >= 0) {
                isOfficialLyricVerified = true;
                activeLyricIndex = matchedIndex;
                if (!isManualScrolling) {
                    updateLyricHighlight(activeLyricIndex);
                    scrollToLyricIndex(activeLyricIndex, true);
                }
                if (isPlaying && lyrics[matchedIndex].time > 0) {
                    lastPositionMs = lyrics[matchedIndex].time;
                    lastSyncTime = performance.now();
                }
            }
        }
        window.crossCheckLyrics = crossCheckLyrics;

        function renderLyrics(lrcArray) {
            lyrics = lrcArray;
            const stream = document.getElementById('lyricsStream');
            const emptyBox = document.getElementById('emptyLyrics');
            const emptyText = document.getElementById('emptyText');
            const largeViz = document.getElementById('largeVisualizer');
            isManualScrolling = false;
            clearTimeout(manualScrollResumeTimer);

            if (currentTrack && currentTrack.isVideo) {
                if (stream) {
                    stream.innerHTML = '';
                    stream.style.display = 'none';
                }
                if (emptyBox) emptyBox.style.display = 'none';
                if (largeViz) largeViz.style.display = 'flex';
                return;
            }

            if (currentActiveSource === 'visualizer') {
                if (stream) stream.style.display = 'none';
                if (emptyBox) emptyBox.style.display = 'none';
                if (largeViz) largeViz.style.display = 'flex';
                return;
            }

            // 智能识别：无论是“本身就没歌词”，还是歌词内容全部是“纯音乐请欣赏”等占位文案，
            // 一律自动跳转“律动氛围”（大号 9 频段声波律动），且绝不记忆该临时跳转！
            // 下一首歌如果有歌词，将无缝自动跳回用户之前选择的歌词来源！
            const isPureMusic = isPureMusicLyric(lyrics);

            if (isPureMusic) {
                hasOfficialLyrics = false;
                activeLyricIndex = -1;
                if (currentTrack.streamLyric && !currentTrack.streamLyric.includes("纯音乐") && !currentTrack.streamLyric.includes("请欣赏")) {
                    if (emptyBox) emptyBox.style.display = 'none';
                    if (largeViz) largeViz.style.display = 'none';
                    if (stream) stream.style.display = 'block';
                    showStreamLyric(currentTrack.streamLyric);
                } else {
                    // 自动跳转律动氛围（大号 9 频段声波律动），不显示任何文字！
                    if (emptyBox) emptyBox.style.display = 'none';
                    if (stream) {
                        stream.innerHTML = '';
                        stream.style.display = 'none';
                    }
                    if (largeViz) largeViz.style.display = 'flex';
                    updateStatusTag('纯音乐', '#888888');
                }
                return;
            }

            hasOfficialLyrics = true;
            activeLyricIndex = 0;

            // 1. 提示框与大号频谱平滑隐藏
            if (largeViz) largeViz.style.display = 'none';
            if (emptyBox) {
                emptyBox.style.transition = 'opacity 0.25s ease-out';
                emptyBox.style.opacity = '0';
                setTimeout(() => {
                    if (hasOfficialLyrics && emptyBox) {
                        emptyBox.style.display = 'none';
                    }
                }, 260);
            }

            // 2. 新歌词直接从第0行开始，平滑淡入展示 (0.35s)
            if (stream) {
                stream.innerHTML = '';
                stream.style.display = 'block';
                stream.style.transition = 'none';
                stream.style.opacity = '0';
                stream.style.transform = 'translateY(0px)';
                currentTranslateY = 0;

                lyrics.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'lyric-line' + (index === 0 ? ' active' : (index <= 4 ? ` near near-${index}` : ' far'));
                    div.id = `line-${index}`;
                    div.textContent = item.text;
                    stream.appendChild(div);
                });

                // 强制重排后淡入新歌词
                void stream.offsetWidth;
                stream.style.transition = 'opacity 0.35s ease-in, transform 0.85s cubic-bezier(0.22, 1, 0.36, 1)';
                stream.style.opacity = '1';
            }
        }

        function showStreamLyric(text) {
            const stream = document.getElementById('lyricsStream');
            const emptyBox = document.getElementById('emptyLyrics');
            const largeViz = document.getElementById('largeVisualizer');
            if (largeViz) largeViz.style.display = 'none';
            if (emptyBox) emptyBox.style.display = 'none';
            if (stream) {
                stream.style.display = 'block';
                stream.style.transform = 'translateY(-24px)';
                stream.textContent = '';
                const box = document.createElement('div');
                box.className = 'live-stream-box';
                const lyric = document.createElement('div');
                lyric.className = 'live-stream-lyric';
                lyric.textContent = text || '当前蓝牙源暂未投送歌词';
                box.appendChild(lyric);
                stream.appendChild(box);
            }
            updateStatusTag('蓝牙实时歌词', '#4a90e2');
        }

        // 歌词源代表色与信息字典（新增律动氛围选项）
        const SOURCE_META = {
            netease: { name: '网易云音乐', color: '#ff3a3a', label: '网易云音乐', id: 'netease' },
            qq: { name: 'QQ音乐', color: '#31c27c', label: 'QQ音乐', id: 'qq' },
            kugou: { name: '酷狗音乐', color: '#0084ff', label: '酷狗音乐', id: 'kugou' },
            lrclib: { name: 'LRCLIB 全球库', color: '#a855f7', label: 'LRCLIB', id: 'lrclib' },
            bluetooth: { name: '蓝牙实时歌词', color: '#38bdf8', label: '蓝牙实时歌词', id: 'bluetooth' },
            visualizer: { name: '律动氛围', color: '#00f2fe', label: '律动氛围', id: 'visualizer' },
            auto: { name: '自动推荐', color: '#f59e0b', label: '自动匹配', id: 'auto' }
        };

        // 记忆歌词源偏好：切歌时严格保持用户手动选择的来源，不自动回退
        let currentActiveSource = localStorage.getItem('preferred_lyric_source') || 'auto';
        let userExplicitMode = (currentActiveSource !== 'auto') ? currentActiveSource : null;

        function getSourceMeta(src) {
            if (!src) return SOURCE_META.auto;
            const s = src.toLowerCase();
            if (s.includes('网易') || s.includes('netease')) return SOURCE_META.netease;
            if (s.includes('qq') || s.includes('tencent')) return SOURCE_META.qq;
            if (s.includes('酷狗') || s.includes('kugou')) return SOURCE_META.kugou;
            if (s.includes('lrclib')) return SOURCE_META.lrclib;
            if (s.includes('律动') || s.includes('visualizer') || s.includes('氛围')) return SOURCE_META.visualizer;
            if (s.includes('蓝牙') || s.includes('bluetooth') || s.includes('stream')) return SOURCE_META.bluetooth;
            return { name: src, color: '#31c27c', label: src, id: 'auto' };
        }

        function getLyricSourceLabel(src) {
            const meta = getSourceMeta(src);
            return meta ? (meta.label || meta.name) : '官方歌词';
        }

        // 播放代次与请求序列号管理（根治切歌竞态、乱序到达与缓存污染）
        let currentPlaybackGeneration = 0;
        let lastSourceRequestId = {};
        let currentSongKey = '';

        function toggleLyricMenu(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const dropdown = document.getElementById('deviceDropdown');
            const pill = document.getElementById('devicePill');
            if (dropdown) dropdown.classList.remove('show');
            if (pill) pill.classList.remove('active');

            const menu = document.getElementById('lyricSourceMenu');
            if (!menu) return;
            menu.classList.toggle('show');
            updateMenuCheckmarks();
            document.body.classList.remove('idle');
            resetIdleTimer();
        }

        function closeLyricMenu() {
            const menu = document.getElementById('lyricSourceMenu');
            if (menu) menu.classList.remove('show');
            resetIdleTimer();
        }

        function updateMenuCheckmarks() {
            const keys = ['auto', 'netease', 'qq', 'kugou', 'lrclib', 'bluetooth', 'visualizer'];
            keys.forEach(k => {
                const item = document.getElementById('menuItem-' + k);
                if (item) {
                    if (k === currentActiveSource) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                }
            });
        }

        // 点击页面其它任意地方自动收起二级菜单
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('lyricSourceMenu');
            const btn = document.getElementById('statusTag');
            if (menu && menu.classList.contains('show')) {
                if (!menu.contains(e.target) && (!btn || !btn.contains(e.target))) {
                    closeLyricMenu();
                }
            }
        });

        // 获取大号律动频谱条
        let largeWaveBars = [];
        function getLargeWaveBars() {
            if (largeWaveBars.length === 0) {
                const container = document.getElementById('largeWave');
                if (container) {
                    largeWaveBars = Array.from(container.getElementsByClassName('large-bar'));
                }
            }
            return largeWaveBars;
        }

        function applyLyricSourceForCurrentTrack(sourceId, isUserTriggered) {
            const trackKey = currentSongKey || (currentTrack && currentTrack.trackKey) || ((currentTrack ? currentTrack.title : '') + '\t' + (currentTrack ? currentTrack.artist : '')).toLowerCase().trim();
            if (!songCache[trackKey]) songCache[trackKey] = {};
            const cached = songCache[trackKey];

            const largeViz = document.getElementById('largeVisualizer');
            const stream = document.getElementById('lyricsStream');
            const emptyBox = document.getElementById('emptyLyrics');

            // 模式 1：律动氛围（大号频谱波形动画）
            if (sourceId === 'visualizer') {
                lyricMode = 'visualizer';
                userExplicitMode = 'visualizer';
                if (stream) stream.style.display = 'none';
                if (emptyBox) emptyBox.style.display = 'none';
                if (largeViz) largeViz.style.display = 'flex';
                updateStatusTag(SOURCE_META.visualizer.label, SOURCE_META.visualizer.color);
                return;
            }

            // 非律动氛围：隐藏大号频谱，恢复歌词视口
            if (largeViz) largeViz.style.display = 'none';
            if (stream) stream.style.display = 'block';

            // 模式 2：蓝牙实时歌词
            if (sourceId === 'bluetooth') {
                lyricMode = 'bluetooth';
                userExplicitMode = 'bluetooth';
                const streamText = currentTrack.streamLyric || (cached && cached.streamLyric) || "当前蓝牙源暂未投送歌词";
                showStreamLyric(streamText);
                updateStatusTag(SOURCE_META.bluetooth.label, SOURCE_META.bluetooth.color);
                return;
            }

            // 模式 3：自动推荐最佳匹配
            if (sourceId === 'auto') {
                userExplicitMode = null;
                if (cached.parsedLyrics && cached.parsedLyrics.length > 0) {
                    lyricMode = 'official';
                    parsedOfficialLyrics = cached.parsedLyrics;
                    hasOfficialLyrics = true;
                    renderLyrics(parsedOfficialLyrics);
                    const meta = getSourceMeta(cached.lyricSource);
                    updateStatusTag(meta.label, meta.color);
                } else if (currentTrack.streamLyric) {
                    lyricMode = 'bluetooth';
                    showStreamLyric(currentTrack.streamLyric);
                    updateStatusTag(SOURCE_META.bluetooth.label, SOURCE_META.bluetooth.color);
                } else {
                    renderLyrics([]);
                    updateStatusTag('纯音乐 / 暂无歌词', '#888888');
                }
                return;
            }

            // 模式 4：用户手动指定外部歌词源 (netease / qq / kugou / lrclib)
            lyricMode = 'official';
            userExplicitMode = sourceId;
            const meta = SOURCE_META[sourceId] || SOURCE_META.auto;

            // 若当前歌曲已缓存过此源的歌词，立即呈现
            if (cached[sourceId + '_lyrics']) {
                parsedOfficialLyrics = cached[sourceId + '_lyrics'];
                hasOfficialLyrics = true;
                renderLyrics(parsedOfficialLyrics);
                updateStatusTag(meta.label, meta.color);

                }
                if (window.AndroidApp && window.AndroidApp.onUserInteraction) {
                    window.AndroidApp.onUserInteraction();
                }
                resetIdleTimer();
            }
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            const timeout = isAnySecondaryMenuOpen() ? MENU_IDLE_TIMEOUT_MS : IDLE_TIMEOUT_MS;
            idleTimer = setTimeout(function() {
                setIdleState(true);
            }, timeout);
        }

        // 单击屏幕手动激活淡出 / 唤醒
        let tapDownX = 0;
        let tapDownY = 0;
        let tapDownTime = 0;
        let isTapCandidate = false;
        let lastTapHandledTime = 0;

        function handleTapStart(x, y) {
            tapDownX = x;
            tapDownY = y;
            tapDownTime = performance.now();
            isTapCandidate = true;
        }

        function handleTapEnd(x, y, target) {
            const now = performance.now();
            if (now - lastTapHandledTime < 500) {
                return; // 过滤 500ms 内重复合成事件（pointerup, touchend）
            }

            const elapsed = now - tapDownTime;
            const dist = Math.hypot(x - tapDownX, y - tapDownY);

            // 智能四角控制区大范围保护（大幅扩展触控范围，点偏也不会意外隐藏控件）
            const isBottomRightZone = (x > window.innerWidth - 300 && y > window.innerHeight - 100);
            const isTopLeftZone = (x < 300 && y < 100);
            const isTopRightZone = (x > window.innerWidth - 120 && y < 100);

            const isInteractive = (isBottomRightZone || isTopLeftZone || isTopRightZone) ||
                (target && target.closest && !!target.closest('button, .btn-ctrl, .vol-btn, .volume-widget, .source-tag, .device-pill, .device-dropdown, .lyric-source-menu, #closeBtn, .top-bar, .bottom-bar, .player-deck, .source-menu-item, .device-card-wrapper, .audio-spec-card'));

            // 若用户触碰的是右下角扩展区域但稍有偏差未命中标签，主动触发歌词源菜单
            if (isBottomRightZone && (!target || !target.closest('.source-tag, .lyric-source-menu'))) {
                toggleLyricMenu();
                return;
            }

            if (isTapCandidate && elapsed < 500 && dist < 20) {
                isTapCandidate = false;
                lastTapHandledTime = now;
                if (!isInteractive) {
                    if (document.body.classList.contains('idle')) {
                        setIdleState(false);
                    } else if (isAnySecondaryMenuOpen()) {
                        // 二级菜单展开时，点击空白处仅关闭二级菜单并恢复常规 6 秒自动隐藏倒计时，防止意外黑屏
                        closeAllSecondaryMenus();
                        resetIdleTimer();
                    } else {
                        setIdleState(true);
                    }
                    return;
                }
            }

            // 点击或交互了具体控件
            lastTapHandledTime = now;
            if (document.body.classList.contains('idle')) {
                setIdleState(false);
            } else {
                resetIdleTimer();
            }
        }

        document.addEventListener('pointerdown', function(e) {
            handleTapStart(e.clientX, e.clientY);
        }, { passive: true });

        document.addEventListener('pointermove', function(e) {
            if (isTapCandidate) {
                const dist = Math.hypot(e.clientX - tapDownX, e.clientY - tapDownY);
                if (dist > 20) {
                    isTapCandidate = false;
                    if (document.body.classList.contains('idle')) {
                        setIdleState(false);
                    } else {
                        resetIdleTimer();
                    }
                }
            }
        }, { passive: true });

        document.addEventListener('pointerup', function(e) {
            handleTapEnd(e.clientX, e.clientY, e.target);
        }, { passive: true });

        // Fallback for touch devices if PointerEvent doesn't fire
        document.addEventListener('touchstart', function(e) {
            if (e.touches && e.touches[0]) {
                handleTapStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            if (e.changedTouches && e.changedTouches[0]) {
                handleTapEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY, e.target);
            }
        }, { passive: true });

        // 点击屏幕空白处保底事件（兼容各种输入设备与电视遥控器）
        document.addEventListener('click', function(e) {
            const isInteractive = e.target && e.target.closest && !!e.target.closest('button, .btn-ctrl, .vol-btn, .volume-widget, .source-tag, .device-pill, .device-dropdown, .lyric-source-menu, #closeBtn, .top-bar, .bottom-bar, .player-deck, .source-menu-item, .device-card-wrapper, .audio-spec-card');
            if (!isInteractive) {
                const now = performance.now();
                if (now - lastTapHandledTime < 600) return; // 过滤 300ms 移动端合成点击
                lastTapHandledTime = now;
                if (document.body.classList.contains('idle')) {
                    setIdleState(false);
                } else {
                    setIdleState(true);
                }
            }
        });

        resetIdleTimer();

        // ===== 常驻垂直音量控制组件交互与系统联动 =====
        let currentVolumePct = 50;
        let volForceTimeout = null;

        function updateVolumeDisplay(pct) {
            currentVolumePct = Math.max(0, Math.min(100, Math.round(pct)));
            const fill = document.getElementById('volFill');
            const text = document.getElementById('volPctText');
            if (fill) fill.style.height = currentVolumePct + '%';
            if (text) text.textContent = currentVolumePct + '%';
        }

        function handleVolumeStep(delta, e) {
            if (e) {
                if (e.preventDefault) e.preventDefault();
                if (e.stopPropagation) e.stopPropagation();
            }
            resetIdleTimer();
            if (window.AndroidApp && window.AndroidApp.changeVolumeBy) {
                const res = window.AndroidApp.changeVolumeBy(delta);
                updateVolumeDisplay(res);
            } else if (window.AndroidApp && window.AndroidApp.setVolumePercent) {
                const target = Math.max(0, Math.min(100, currentVolumePct + delta));
                const res = window.AndroidApp.setVolumePercent(target);
                updateVolumeDisplay(res);
            } else {
                updateVolumeDisplay(currentVolumePct + delta);
            }
        }

        // 手机端物理按键/蓝牙调整音量时的系统级事件同步：仅淡入音量条，四个角落的控件保持隐藏
        window.onSystemVolumeChanged = function(newPct) {
            updateVolumeDisplay(newPct);
            const widget = document.getElementById('volumeWidget');
            if (widget) {
                widget.classList.add('force-show');
                clearTimeout(volForceTimeout);
                volForceTimeout = setTimeout(function() {
                    widget.classList.remove('force-show');
                }, 3000);
            }
        };

        // 页面初始化时拉取当前系统音量
        if (window.AndroidApp && window.AndroidApp.getVolume) {
            try {
                updateVolumeDisplay(window.AndroidApp.getVolume());
            } catch (err) {}
        }
    </script>
</body>
</html>
